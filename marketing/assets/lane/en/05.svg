<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">User-controlled checkout handoff</title><desc id="desc">Vitlane prepares an order timeline and waits for the user to approve opening checkout.</desc>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182034}.muted{fill:#6d7485}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700}.title{font-size:30px;font-weight:750;letter-spacing:-.8px}.nav{font-size:16px;font-weight:650}.white{fill:#fff!important}</style>
  <rect width="1200" height="760" rx="28" fill="#f5f6fa"/><rect x="24" y="24" width="1152" height="712" rx="24" fill="#fff" stroke="#e5e8f0"/><rect x="24" y="24" width="220" height="712" rx="24" fill="#20263a"/><circle cx="64" cy="68" r="17" fill="#7568ff"/><path d="M56 68h16M64 60v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="92" y="75" class="nav white">Vitlane</text><rect x="44" y="122" width="180" height="46" rx="13" fill="#343b55"/><circle cx="65" cy="145" r="6" fill="#8e84ff"/><text x="82" y="151" class="small white">Running shoes</text><text x="52" y="213" class="tiny" fill="#8f96aa">RESEARCH</text><text x="52" y="249" class="small" fill="#8f96aa">Live progress</text><text x="52" y="285" class="small" fill="#8f96aa">Candidates</text><text x="52" y="321" class="small" fill="#fff">Decision</text>
  <text x="294" y="75" class="tiny muted">YOUR DECISION</text><rect x="1024" y="47" width="108" height="36" rx="18" fill="#eef8f6"/><circle cx="1045" cy="65" r="5" fill="#3d9a84"/><text x="1058" y="70" class="tiny" fill="#277b6a">Ready</text>
  <text x="294" y="143" class="title">Ready when you are</text><text x="294" y="176" class="body muted">Review the handoff. Nothing continues until you approve it.</text>
  <rect x="294" y="213" width="530" height="420" rx="24" fill="#fff" stroke="#e2e4ec"/><text x="322" y="251" class="label">Checkout timeline</text>
  <circle cx="344" cy="299" r="17" fill="#daf2ec"/><path d="m336 299 6 6 11-13" fill="none" stroke="#288b73" stroke-width="2.5"/><text x="377" y="294" class="small">Request understood</text><text x="377" y="316" class="tiny muted">Budget, size, and delivery saved</text><path d="M344 318v45" stroke="#dfe3ea" stroke-width="2"/>
  <circle cx="344" cy="382" r="17" fill="#daf2ec"/><path d="m336 382 6 6 11-13" fill="none" stroke="#288b73" stroke-width="2.5"/><text x="377" y="377" class="small">Option selected</text><text x="377" y="399" class="tiny muted">Everyday Runner · size 9 · $118</text><path d="M344 401v45" stroke="#dfe3ea" stroke-width="2"/>
  <circle cx="344" cy="465" r="17" fill="#ece9ff"/><circle cx="344" cy="465" r="6" fill="#6759e8"/><text x="377" y="460" class="small">Your approval</text><text x="377" y="482" class="tiny muted">Open the seller checkout in your session</text><path d="M344 484v45" stroke="#dfe3ea" stroke-width="2"/>
  <circle cx="344" cy="548" r="17" fill="#f0f1f5"/><text x="338" y="553" class="tiny muted">4</text><text x="377" y="543" class="small muted">Confirm at the seller</text><text x="377" y="565" class="tiny muted">Review final total and place the order</text>
  <rect x="322" y="589" width="474" height="1" fill="#eceef3"/><text x="322" y="613" class="tiny muted">You can stop or change the selection before checkout.</text>
  <rect x="850" y="213" width="282" height="420" rx="24" fill="#f8f7ff" stroke="#e1ddff"/><text x="878" y="251" class="label" fill="#5547d4">Selected item</text><rect x="878" y="274" width="226" height="128" rx="17" fill="#ebe8ff"/><ellipse cx="991" cy="372" rx="76" ry="11" fill="#d7d2fc"/><path d="M917 351c29-7 45-42 70-44 19-1 26 27 53 32 15 3 28 11 24 21-4 9-32 12-74 8l-68-4c-15-1-18-10-5-13Z" fill="#7366ee"/><path d="M943 344c23 4 40 5 65 1" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="878" y="437" class="body" font-weight="700">Everyday Runner</text><text x="878" y="462" class="tiny muted">Neutral violet · size 9</text><text x="878" y="501" class="label">Estimated total</text><text x="1104" y="501" class="label" text-anchor="end">$118</text><text x="878" y="525" class="tiny muted">Final taxes and delivery appear at checkout.</text>
  <rect x="878" y="552" width="226" height="54" rx="16" fill="#6658ef"/><text x="912" y="584" class="label white">Open secure checkout</text><path d="M1071 579h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="294" y="659" width="838" height="39" rx="13" fill="#f4f5f8"/><circle cx="315" cy="678" r="9" fill="#dfe2ea"/><path d="M312 678h6M315 675v6" stroke="#737a8c" stroke-width="1.5"/><text x="334" y="683" class="tiny muted">Vitlane keeps you in control and shows where the next action happens.</text>
</svg>
