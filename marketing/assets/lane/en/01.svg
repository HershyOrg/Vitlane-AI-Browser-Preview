<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Describe what you need</title>
  <desc id="desc">Vitlane shopping workspace with a natural language request composer.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182034}.muted{fill:#6d7485}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700}.title{font-size:34px;font-weight:750;letter-spacing:-1px}.nav{font-size:16px;font-weight:650}.chip{font-size:14px;font-weight:650}.white{fill:#fff!important}
  </style>
  <rect width="1200" height="760" rx="28" fill="#f5f6fa"/>
