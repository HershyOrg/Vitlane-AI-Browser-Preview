  <circle cx="966" cy="215" r="16" fill="#6b5cf3"/><text x="961" y="220" class="tiny white">1</text><text x="993" y="211" class="small">Set the goal</text><text x="993" y="231" class="tiny muted">Use your own words</text>
  <path d="M966 235v38" stroke="#d9d6ff" stroke-width="2"/>
  <circle cx="966" cy="291" r="16" fill="#e7e4ff"/><text x="961" y="296" class="tiny" fill="#5a4cda">2</text><text x="993" y="287" class="small">Review matches</text><text x="993" y="307" class="tiny muted">Compare clear evidence</text>
  <path d="M966 311v38" stroke="#e4e5eb" stroke-width="2"/>
