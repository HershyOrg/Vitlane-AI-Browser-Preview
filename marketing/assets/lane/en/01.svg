  <rect x="950" y="432" width="157" height="86" rx="16" fill="#eef8f6"/><circle cx="974" cy="456" r="10" fill="#4aa48f"/><path d="m969 456 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="993" y="460" class="tiny" fill="#257a69">Private by design</text><text x="969" y="487" class="tiny muted">Your session stays</text><text x="969" y="505" class="tiny muted">inside your workspace.</text>
  <rect x="294" y="621" width="592" height="66" rx="18" fill="#f6f4ff"/><circle cx="329" cy="654" r="18" fill="#dcd7ff"/><path d="M321 654h16M329 646v16" stroke="#6455e8" stroke-width="2"/><text x="359" y="650" class="small">Use details only when they matter.</text><text x="359" y="671" class="tiny muted">You can adjust the request at any time.</text>
