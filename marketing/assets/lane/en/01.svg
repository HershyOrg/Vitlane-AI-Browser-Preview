  <circle cx="64" cy="68" r="17" fill="#7568ff"/><path d="M56 68h16M64 60v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="92" y="75" class="nav white">Vitlane</text>
  <rect x="44" y="122" width="180" height="46" rx="13" fill="#343b55"/><circle cx="65" cy="145" r="6" fill="#8e84ff"/><text x="82" y="151" class="small white">New request</text>
  <text x="52" y="213" class="tiny" fill="#8f96aa">WORKSPACE</text>
  <text x="52" y="249" class="small" fill="#c9cede">Today</text><text x="52" y="285" class="small" fill="#8f96aa">Saved items</text><text x="52" y="321" class="small" fill="#8f96aa">Activity</text>
  <rect x="44" y="659" width="180" height="52" rx="15" fill="#292f45"/><circle cx="68" cy="685" r="14" fill="#e7e4ff"/><text x="63" y="690" class="tiny" fill="#5649db">A</text><text x="92" y="681" class="tiny" fill="#fff">Your workspace</text><text x="92" y="698" class="tiny" fill="#9da4b9">Private session</text>
