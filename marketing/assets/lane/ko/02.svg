<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">상품 조사 중</title><desc id="desc">Vitlane이 상품의 가격과 배송 조건을 비교하는 진행 화면입니다.</desc>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182034}.muted{fill:#6d7485}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700}.title{font-size:30px;font-weight:750;letter-spacing:-.8px}.nav{font-size:16px;font-weight:650}.white{fill:#fff!important}</style>
  <rect width="1200" height="760" rx="28" fill="#f5f6fa"/><rect x="24" y="24" width="1152" height="712" rx="24" fill="#fff" stroke="#e5e8f0"/><rect x="24" y="24" width="220" height="712" rx="24" fill="#20263a"/><circle cx="64" cy="68" r="17" fill="#7568ff"/><path d="M56 68h16M64 60v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="92" y="75" class="nav white">Vitlane</text>
  <rect x="44" y="122" width="180" height="46" rx="13" fill="#343b55"/><circle cx="65" cy="145" r="6" fill="#8e84ff"/><text x="82" y="151" class="small white">데일리 러닝화</text><text x="52" y="213" class="tiny" fill="#8f96aa">상품 조사</text><text x="52" y="249" class="small" fill="#fff">실시간 진행</text><text x="52" y="285" class="small" fill="#8f96aa">후보</text><text x="52" y="321" class="small" fill="#8f96aa">결정</text>
  <text x="294" y="75" class="tiny muted">데일리 러닝화 · 14만 원 이하</text><rect x="1035" y="48" width="97" height="34" rx="17" fill="#f0efff"/><circle cx="1055" cy="65" r="5" fill="#695bea"/><text x="1068" y="70" class="tiny" fill="#5a4cda">조사 중</text>
  <text x="294" y="143" class="title">가장 잘 맞는 상품을 찾고 있어요</text><text x="294" y="176" class="body muted">현재 판매 정보에서 재고, 배송, 가격을 함께 확인합니다.</text><rect x="294" y="211" width="838" height="86" rx="20" fill="#f8f7ff" stroke="#e1ddff"/><text x="320" y="243" class="label" fill="#5547d4">조사 진행률</text><text x="1078" y="243" class="label" text-anchor="end" fill="#5547d4">72%</text><rect x="320" y="261" width="786" height="8" rx="4" fill="#dedafc"/><rect x="320" y="261" width="566" height="8" rx="4" fill="#6a5bec"/>
  <text x="294" y="345" class="label">실시간 확인 항목</text><rect x="294" y="367" width="402" height="78" rx="17" fill="#fff" stroke="#e5e7ef"/><circle cx="326" cy="406" r="16" fill="#def4ee"/><path d="m319 406 5 5 9-11" fill="none" stroke="#2b8d76" stroke-width="2.5"/><text x="353" y="400" class="small">가격과 사이즈 확인</text><text x="353" y="422" class="tiny muted">18개 판매 정보 확인</text><text x="665" y="411" class="tiny" text-anchor="end" fill="#2b8d76">완료</text>
  <rect x="714" y="367" width="418" height="78" rx="17" fill="#fff" stroke="#dcd8ff"/><circle cx="746" cy="406" r="16" fill="#ece9ff"/><path d="M746 396v10l7 4" fill="none" stroke="#6557e7" stroke-width="2.5" stroke-linecap="round"/><text x="773" y="400" class="small">배송 예정일</text><text x="773" y="422" class="tiny muted">도착 가능 날짜 비교</text><text x="1101" y="411" class="tiny" text-anchor="end" fill="#5a4cda">확인 중</text>
  <rect x="294" y="461" width="402" height="78" rx="17" fill="#fff" stroke="#e5e7ef"/><circle cx="326" cy="500" r="16" fill="#def4ee"/><path d="m319 500 5 5 9-11" fill="none" stroke="#2b8d76" stroke-width="2.5"/><text x="353" y="494" class="small">반품 조건과 평점</text><text x="353" y="516" class="tiny muted">정책을 간단히 정리</text><text x="665" y="505" class="tiny" text-anchor="end" fill="#2b8d76">완료</text>
  <rect x="714" y="461" width="418" height="78" rx="17" fill="#fff" stroke="#e5e7ef"/><circle cx="746" cy="500" r="16" fill="#f0f1f5"/><path d="M739 500h14" stroke="#8a90a0" stroke-width="2.5" stroke-linecap="round"/><text x="773" y="494" class="small">최종 후보 정리</text><text x="773" y="516" class="tiny muted">조건에 맞는 순서로 정렬</text><text x="1101" y="505" class="tiny muted" text-anchor="end">다음</text>
  <rect x="294" y="578" width="838" height="112" rx="20" fill="#20263a"/><circle cx="330" cy="614" r="16" fill="#7366f4"/><path d="M325 614h10M330 609v10" stroke="#fff" stroke-width="2"/><text x="358" y="610" class="label white">지금 우선하는 조건</text><text x="358" y="635" class="small" fill="#cbd0df">편안함 · 무채색 · 270 사이즈 · 이번 주 배송</text><rect x="320" y="653" width="186" height="25" rx="12" fill="#343b55"/><text x="336" y="670" class="tiny" fill="#bfc4d4">예산 상한을 지키는 중</text><text x="1100" y="636" class="tiny" fill="#999ff0" text-anchor="end">조건은 언제든 수정할 수 있어요</text>
</svg>
