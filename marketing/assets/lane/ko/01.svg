<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">원하는 것을 입력하세요</title><desc id="desc">자연어 요청을 입력하는 Vitlane 쇼핑 워크스페이스입니다.</desc>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182034}.muted{fill:#6d7485}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700}.title{font-size:34px;font-weight:750;letter-spacing:-1px}.nav{font-size:16px;font-weight:650}.chip{font-size:14px;font-weight:650}.white{fill:#fff!important}</style>
  <rect width="1200" height="760" rx="28" fill="#f5f6fa"/><rect x="24" y="24" width="1152" height="712" rx="24" fill="#fff" stroke="#e5e8f0"/><rect x="24" y="24" width="220" height="712" rx="24" fill="#20263a"/>
  <circle cx="64" cy="68" r="17" fill="#7568ff"/><path d="M56 68h16M64 60v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="92" y="75" class="nav white">Vitlane</text><rect x="44" y="122" width="180" height="46" rx="13" fill="#343b55"/><circle cx="65" cy="145" r="6" fill="#8e84ff"/><text x="82" y="151" class="small white">새 요청</text>
  <text x="52" y="213" class="tiny" fill="#8f96aa">워크스페이스</text><text x="52" y="249" class="small" fill="#c9cede">오늘</text><text x="52" y="285" class="small" fill="#8f96aa">저장한 항목</text><text x="52" y="321" class="small" fill="#8f96aa">활동</text><rect x="44" y="659" width="180" height="52" rx="15" fill="#292f45"/><circle cx="68" cy="685" r="14" fill="#e7e4ff"/><text x="63" y="690" class="tiny" fill="#5649db">나</text><text x="92" y="681" class="tiny" fill="#fff">내 워크스페이스</text><text x="92" y="698" class="tiny" fill="#9da4b9">비공개 세션</text>
  <text x="294" y="75" class="tiny muted">쇼핑 어시스턴트</text><circle cx="1119" cy="65" r="18" fill="#f0efff"/><circle cx="1119" cy="62" r="5" fill="#6254e8"/><path d="M1110 72c2-7 16-7 18 0" fill="none" stroke="#6254e8" stroke-width="2"/>
  <text x="294" y="164" class="title">무엇을 찾아드릴까요?</text><text x="294" y="198" class="body muted">원하는 결과를 알려주세요. 필요한 조건은 검색하면서 정리할게요.</text>
  <rect x="294" y="236" width="592" height="188" rx="22" fill="#fbfbfd" stroke="#d9dce7" stroke-width="2"/><text x="322" y="278" class="body">14만 원 이하의 편안한 데일리 러닝화를 찾아줘.</text><text x="322" y="308" class="body">무채색, 270 사이즈, 이번 주 배송이면 좋겠어.</text><rect x="322" y="362" width="144" height="36" rx="18" fill="#eeecff"/><text x="344" y="385" class="chip" fill="#5547d4">예산 · 14만 원</text><rect x="477" y="362" width="133" height="36" rx="18" fill="#eef8f6"/><text x="499" y="385" class="chip" fill="#257a69">사이즈 · 270</text><rect x="752" y="352" width="108" height="48" rx="15" fill="#6658ef"/><text x="779" y="382" class="label white">시작하기</text><path d="M827 376h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="294" y="476" class="label">이렇게 시작해보세요</text><rect x="294" y="497" width="145" height="42" rx="21" fill="#fff" stroke="#e2e4ec"/><text x="318" y="523" class="chip">상품 비교하기</text><rect x="450" y="497" width="145" height="42" rx="21" fill="#fff" stroke="#e2e4ec"/><text x="474" y="523" class="chip">구매 계획하기</text><rect x="606" y="497" width="145" height="42" rx="21" fill="#fff" stroke="#e2e4ec"/><text x="630" y="523" class="chip">가격 지켜보기</text>
  <rect x="925" y="129" width="207" height="425" rx="22" fill="#fafafe" stroke="#e7e9f1"/><text x="950" y="169" class="label">이렇게 진행돼요</text><circle cx="966" cy="215" r="16" fill="#6b5cf3"/><text x="961" y="220" class="tiny white">1</text><text x="993" y="211" class="small">목표 입력</text><text x="993" y="231" class="tiny muted">평소 말로 작성해요</text><path d="M966 235v38" stroke="#d9d6ff" stroke-width="2"/><circle cx="966" cy="291" r="16" fill="#e7e4ff"/><text x="961" y="296" class="tiny" fill="#5a4cda">2</text><text x="993" y="287" class="small">후보 비교</text><text x="993" y="307" class="tiny muted">근거를 한눈에 봐요</text><path d="M966 311v38" stroke="#e4e5eb" stroke-width="2"/><circle cx="966" cy="367" r="16" fill="#f0f1f5"/><text x="961" y="372" class="tiny muted">3</text><text x="993" y="363" class="small">직접 결정</text><text x="993" y="383" class="tiny muted">모든 행동을 승인해요</text><rect x="950" y="432" width="157" height="86" rx="16" fill="#eef8f6"/><circle cx="974" cy="456" r="10" fill="#4aa48f"/><path d="m969 456 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="993" y="460" class="tiny" fill="#257a69">개인정보 보호</text><text x="969" y="487" class="tiny muted">내 세션 안에서만</text><text x="969" y="505" class="tiny muted">안전하게 진행해요.</text>
  <rect x="294" y="621" width="592" height="66" rx="18" fill="#f6f4ff"/><circle cx="329" cy="654" r="18" fill="#dcd7ff"/><path d="M321 654h16M329 646v16" stroke="#6455e8" stroke-width="2"/><text x="359" y="650" class="small">필요한 정보만 사용할게요.</text><text x="359" y="671" class="tiny muted">요청 조건은 언제든 바꿀 수 있어요.</text>
</svg>
