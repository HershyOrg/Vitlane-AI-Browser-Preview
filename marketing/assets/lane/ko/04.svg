<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">선택한 상품 상세</title><desc id="desc">선택한 상품의 근거, 가격, 배송, 예산 영향을 보여줍니다.</desc>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182034}.muted{fill:#6d7485}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700}.title{font-size:30px;font-weight:750;letter-spacing:-.8px}.nav{font-size:16px;font-weight:650}.white{fill:#fff!important}</style>
  <rect width="1200" height="760" rx="28" fill="#f5f6fa"/><rect x="24" y="24" width="1152" height="712" rx="24" fill="#fff" stroke="#e5e8f0"/><rect x="24" y="24" width="220" height="712" rx="24" fill="#20263a"/><circle cx="64" cy="68" r="17" fill="#7568ff"/><path d="M56 68h16M64 60v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="92" y="75" class="nav white">Vitlane</text><rect x="44" y="122" width="180" height="46" rx="13" fill="#343b55"/><circle cx="65" cy="145" r="6" fill="#8e84ff"/><text x="82" y="151" class="small white">데일리 러닝화</text><text x="52" y="213" class="tiny" fill="#8f96aa">상품 조사</text><text x="52" y="249" class="small" fill="#8f96aa">실시간 진행</text><text x="52" y="285" class="small" fill="#8f96aa">후보</text><text x="52" y="321" class="small" fill="#fff">결정</text>
  <text x="294" y="72" class="tiny muted">← 후보 3개로 돌아가기</text><text x="294" y="128" class="title">에브리데이 러너</text><text x="294" y="158" class="body muted">요청한 조건에 전체적으로 가장 잘 맞는 상품이에요.</text>
