<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">사용자가 승인하는 결제 이동</title><desc id="desc">Vitlane이 구매 진행 과정을 준비하고 사용자의 결제 화면 열기 승인을 기다립니다.</desc>
  <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#182034}.muted{fill:#6d7485}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700}.title{font-size:30px;font-weight:750;letter-spacing:-.8px}.nav{font-size:16px;font-weight:650}.white{fill:#fff!important}</style>
  <rect width="1200" height="760" rx="28" fill="#f5f6fa"/><rect x="24" y="24" width="1152" height="712" rx="24" fill="#fff" stroke="#e5e8f0"/><rect x="24" y="24" width="220" height="712" rx="24" fill="#20263a"/><circle cx="64" cy="68" r="17" fill="#7568ff"/><path d="M56 68h16M64 60v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="92" y="75" class="nav" fill="#fff">Vitlane</text><rect x="44" y="122" width="180" height="46" rx="13" fill="#343b55"/><circle cx="65" cy="145" r="6" fill="#8e84ff"/><text x="82" y="151" class="small" fill="#fff">데일리 러닝화</text><text x="52" y="213" class="tiny" fill="#8f96aa">상품 조사</text><text x="52" y="249" class="small" fill="#8f96aa">실시간 진행</text><text x="52" y="285" class="small" fill="#8f96aa">후보</text><text x="52" y="321" class="small" fill="#fff">결정</text>
  <text x="294" y="75" class="tiny muted">내 결정</text><rect x="1024" y="47" width="108" height="36" rx="18" fill="#eef8f6"/><circle cx="1045" cy="65" r="5" fill="#3d9a84"/><text x="1058" y="70" class="tiny" fill="#277b6a">준비 완료</text><text x="294" y="143" class="title">결정하면 바로 이어갈 수 있어요</text><text x="294" y="176" class="body muted">이동할 내용을 확인하세요. 승인하기 전에는 아무것도 진행되지 않아요.</text>
  <rect x="294" y="213" width="530" height="420" rx="24" fill="#fff" stroke="#e2e4ec"/><text x="322" y="251" class="label">구매 진행 과정</text><circle cx="344" cy="299" r="17" fill="#daf2ec"/><path d="m336 299 6 6 11-13" fill="none" stroke="#288b73" stroke-width="2.5"/><text x="377" y="294" class="small">요청 조건 확인</text><text x="377" y="316" class="tiny muted">예산, 사이즈, 배송 조건 저장</text><path d="M344 318v45" stroke="#dfe3ea" stroke-width="2"/>
  <circle cx="344" cy="382" r="17" fill="#daf2ec"/><path d="m336 382 6 6 11-13" fill="none" stroke="#288b73" stroke-width="2.5"/><text x="377" y="377" class="small">상품 선택 완료</text><text x="377" y="399" class="tiny muted">에브리데이 러너 · 270 · 118,000원</text><path d="M344 401v45" stroke="#dfe3ea" stroke-width="2"/>
  <circle cx="344" cy="465" r="17" fill="#ece9ff"/><circle cx="344" cy="465" r="6" fill="#6759e8"/><text x="377" y="460" class="small">사용자 승인</text><text x="377" y="482" class="tiny muted">내 세션에서 판매처 결제 화면 열기</text><path d="M344 484v45" stroke="#dfe3ea" stroke-width="2"/>
  <circle cx="344" cy="548" r="17" fill="#f0f1f5"/><text x="338" y="553" class="tiny muted">4</text><text x="377" y="543" class="small muted">판매처에서 최종 확인</text><text x="377" y="565" class="tiny muted">최종 금액을 보고 직접 주문 확정</text><rect x="322" y="589" width="474" height="1" fill="#eceef3"/><text x="322" y="613" class="tiny muted">결제 화면을 열기 전까지 선택을 바꾸거나 멈출 수 있어요.</text>
  <rect x="850" y="213" width="282" height="420" rx="24" fill="#f8f7ff" stroke="#e1ddff"/><text x="878" y="251" class="label" fill="#5547d4">선택한 상품</text><rect x="878" y="274" width="226" height="128" rx="17" fill="#ebe8ff"/><ellipse cx="991" cy="372" rx="76" ry="11" fill="#d7d2fc"/><path d="M917 351c29-7 45-42 70-44 19-1 26 27 53 32 15 3 28 11 24 21-4 9-32 12-74 8l-68-4c-15-1-18-10-5-13Z" fill="#7366ee"/><path d="M943 344c23 4 40 5 65 1" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="878" y="437" class="body" font-weight="700">에브리데이 러너</text><text x="878" y="462" class="tiny muted">뉴트럴 바이올렛 · 270</text><text x="878" y="501" class="label">예상 합계</text><text x="1104" y="501" class="label" text-anchor="end">118,000원</text><text x="878" y="525" class="tiny muted">세금과 배송비는 결제 화면에서 확정돼요.</text><rect x="878" y="552" width="226" height="54" rx="16" fill="#6658ef"/><text x="916" y="584" class="label" fill="#fff">안전한 결제 화면 열기</text><path d="M1071 579h12m-5-5 5 5-5 5" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="294" y="659" width="838" height="39" rx="13" fill="#f4f5f8"/><circle cx="315" cy="678" r="9" fill="#dfe2ea"/><path d="M312 678h6M315 675v6" stroke="#737a8c" stroke-width="1.5"/><text x="334" y="683" class="tiny muted">다음 행동이 일어나는 위치를 보여주고, 모든 결정을 사용자에게 맡깁니다.</text>
</svg>
