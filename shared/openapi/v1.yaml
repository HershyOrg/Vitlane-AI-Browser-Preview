        internalNote: { type: string, maxLength: 4000 }
        observedCondition: { type: string, minLength: 1, maxLength: 2000 }
        evidenceSource: { type: string, enum: [OPERATOR_OBSERVATION, MERCHANT_PAGE, MERCHANT_POLICY, RECEIPT, OTHER] }
        evidenceHash: { type: string, minLength: 16, maxLength: 256 }
        observedAt: { type: string, format: date-time }
        decidedByUserId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 1 }
        authorizationHash: { type: string }
        executionProfileHash: { type: string }
