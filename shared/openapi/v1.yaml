openapi: 3.1.0
info:
  title: Vitlane API
  version: 8.16.0
  description: >-
    AccountOverview, Curation/CartView, AgencyOrder 작성·발행·TEST 결제,
    AgencyOrder tracking·운영자 exact lookup, Marketing, Managed Intelligence 운영 사용량,
    Planning과 Research API. 보호된 /api/v1 endpoint는 브라우저 HttpOnly cookie 또는
    모바일용 opaque Bearer AuthSession 중 정확히 하나를 받는다.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /analytics/config:
    get:
      operationId: getAnalyticsConfig
      security: []
      summary: 선택적 사용자 행동 분석의 공개 실행 설정
      responses:
        '200':
          description: 비밀값 없는 설정, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, mode, measurementId, release]
                properties:
                  schemaVersion: { type: string, enum: [vitlane.analytics-config.v1] }
                  mode: { type: string, enum: [disabled, debug, ga4] }
                  measurementId: { type: string }
                  release: { type: string }
  /curations/{curationId}/control-mode:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    get:
      operationId: getCurationControlMode
      responses:
        '200':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationControlModeV1'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    put:
      operationId: setCurationControlMode
      responses:
        '200':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationControlModeV1'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurationControlModeV1'
  /curations/{curationId}/threads:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    get:
      operationId: listCurationThreads
      summary: 큐레이션의 요청 스레드와 현재 Auto/수동 모드를 함께 조회한다
      description: >-
        최근 100개 스레드를 생성 시각 최신순으로 주고, controlMode로 모드를 함께 돌려준다(ADR-0081).
        Web은 진행 중(INTERPRETING·RUNNING) 스레드가 있고 탭이 보일 때만 이 조회를 반복하고,
        탭 복귀와 스레드에 닿는 행동 뒤에는 한 번씩 읽는다.
      responses:
        '200':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationThreadListV2'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: submitCurationThread
      responses:
        '202':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationThreadV2'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCurationThreadV2'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: body clientRequestId와 같다. 접수 시 동시성 슬롯을 확보한다.
  /curations/{curationId}/threads/{threadId}/combination:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    - in: path
      name: threadId
      required: true
      schema: { type: string, format: uuid }
    get:
      operationId: getCombinationStatus
      description: 후보·옵션·반응·기준·예산·Cart version을 검증한다. 과거 추천은 표시하되 변경 뒤 반영은 거절한다.
      responses:
        '200':
          description: 현재 상태 또는 사용자가 선택한 범위의 Cart 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CombinationStatusV1' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /curations/{curationId}/representative-cart:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    post:
      operationId: addCurrentRepresentativesToCart
      description: 현재 화면의 대표 상품을 ADD한다. 과거 AI 추천의 membership·상태에 결속하지 않는다. 소유권·현재 후보·Shopify 출처·저장된 Variant·Cart version을 검증하며 기존 동일 Variant는 수량을 유지한다.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepresentativeCartCommandV1' }
      responses:
        '200':
          description: 적격 대표 상품을 추가한 Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogCartView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /curations/{curationId}/threads/{threadId}/combination-cart:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    - in: path
      name: threadId
      required: true
      schema: { type: string, format: uuid }
    post:
      operationId: applyCombinationCart
      description: 추천 상태와 Cart version, SHOPIFY_LIVE 출처, 저장된 선택 Variant 일치를 검증한다. 적격 부분집합을 원자적으로 반영하며 ADD는 기존 동일 Candidate와 Variant의 수량을 보존한다. 가격은 관측값이며 주문 준비에서 재조회한다. 과거 추천은 표시하되 변경 뒤 반영은 거절한다.
      responses:
        '200':
          description: 현재 상태 또는 사용자가 선택한 범위의 Cart 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogCartView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema: { type: string, format: uuid }
        description: body commandId와 같아야 한다. 같은 payload 재시도는 저장된 결과를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CombinationCartCommandV1' }
  /curations/{curationId}/threads/{threadId}/cancel:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    - in: path
      name: threadId
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelCurationThread
      responses:
        '200':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationThreadV2'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /curations/{curationId}/threads/{threadId}/actions/{actionId}/cancel:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    - in: path
      name: threadId
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: actionId
      required: true
      schema: { type: string, format: uuid }
    post:
      operationId: cancelCurationThreadAction
      responses:
        '200':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationThreadV2'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /curations/{curationId}/threads/{threadId}/answer:
    parameters:
    - $ref: '#/components/parameters/CurationId'
    - in: path
      name: threadId
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: answerCurationThread
      responses:
        '202':
          description: 확정된 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationThreadV2'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurationThreadAnswerV1'
  /auth/capabilities:
    get:
      operationId: getAuthenticationCapabilities
      summary: 현재 런타임이 실제로 제공하는 로그인 방법을 반환한다
      security: []
      responses:
        "200":
          description: Web이 노출해도 되는 인증 진입점
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationCapabilities"
  /auth/google/start:
    get:
      operationId: beginGoogleLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, default: / }
        - name: fresh
          in: query
          description: >-
            1이면 운영자 민감 조작용 재인증으로 max_age=0 재로그인을 요구한다
            (ADR-0040 §10).
          schema: { type: string, enum: ["1"] }
      responses:
        "302": { description: Google authorization endpoint로 이동 }
        "303": { description: Google이 설정되지 않았으면 로그인 화면의 오류 안내로 복귀 }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        "303": { description: 검증 결과에 따라 복귀 경로로 이동 }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/mobile/google/start:
    get:
      operationId: beginMobileGoogleLogin
      summary: 시스템 브라우저에서 Google 모바일 로그인을 시작한다
      description: >-
        allowlist에 정확히 등록된 앱 redirect URI와 PKCE S256 challenge를 검증한 뒤
        Google authorization endpoint로 이동한다. 앱은 verifier를 기기 안에 보관하며
        이 endpoint나 redirect URI에 verifier를 보내지 않는다.
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: true
          description: MOBILE_AUTH_REDIRECT_URIS allowlist와 정확히 일치하는 앱 callback URI
          schema: { type: string, format: uri }
        - name: code_challenge
          in: query
          required: true
          description: verifier의 SHA-256을 padding 없는 base64url로 인코딩한 PKCE S256 challenge
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        "302":
          description: Google authorization endpoint로 이동하며 단기 browser binding cookie를 설정함
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/mobile/complete:
    get:
      operationId: completeMobileLogin
      summary: 브라우저 AuthSession을 앱용 1회 handoff code로 회전한다
      description: >-
        Google callback이 내부적으로 도달하는 브라우저 endpoint다. 성공하면 기존 브라우저
        AuthSession을 폐기하고 2분 동안 한 번만 교환할 수 있는 code를 앱 callback URI에
        전달한다. 실패하면 같은 URI에 stable error reason만 전달한다. 장기 AuthSession과
        Google token은 redirect URI에 포함하지 않는다. 앱이 직접 호출하지 않는다.
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: error
          in: query
          required: false
          description: Google callback 실패 때 전달되는 stable authentication reason
          schema: { type: string }
      responses:
        "303":
          description: allowlist의 앱 callback URI로 code 또는 error 하나를 전달함
        "400": { $ref: "#/components/responses/Error" }
  /auth/mobile/exchange:
    post:
      operationId: exchangeMobileLogin
      summary: 1회 handoff code와 PKCE verifier를 opaque Bearer AuthSession으로 교환한다
      description: >-
        code는 발급 뒤 2분 안에 한 번만 사용할 수 있다. 성공한 sessionToken은 URL이나
        로그에 기록하지 않고 OS 보안 저장소에 저장해 Authorization: Bearer로 보낸다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileAuthExchangeRequest"
      responses:
        "201":
          description: 새 모바일 AuthSession 발급됨
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthSession"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dev/auth/session:
    post:
      operationId: createDevelopmentSession
      summary: local·test에서만 고정 검수 프로필의 AuthSession을 만든다
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, format: uuid, writeOnly: true }
                profileKey: { type: string }
                sessionMode:
                  type: string
                  enum: [cookie, bearer]
                  default: cookie
                  description: >-
                    cookie는 브라우저 HttpOnly cookie를, bearer는 local·test 네이티브 검수용
                    opaque sessionToken 응답을 요청한다.
      responses:
        "201":
          description: 개발용 AuthSession 발급됨
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DevelopmentCookieSession"
                  - $ref: "#/components/schemas/MobileAuthSession"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dev/auth/profiles/{profileKey}/reset:
    parameters:
      - name: profileKey
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resetDevelopmentProfile
      summary: local·test 검수 프로필의 사용자 소유 데이터를 신규 상태로 비운다
      security: []
      responses:
        "204": { description: 신규 사용자 상태로 초기화됨 }
        "404": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: 로그아웃됨 }
  /auth/logout-all:
    post:
      operationId: logoutAllSessions
      responses:
        "204": { description: 모든 세션 로그아웃 완료 }
        default: { $ref: "#/components/responses/Error" }
  /account:
    delete:
      operationId: requestAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, const: 계정 삭제 }
      responses:
        "204": { description: 계정 삭제 요청 및 모든 세션 해지 완료 }
        default: { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Error" }
  /admin/ops/health:
    get:
      operationId: getOperatorOpsHealth
      summary: 운영자가 core availability와 degraded runtime·PII 없는 관찰값을 함께 읽는다
      description: >-
        ADR-0040 §3·§6 통합 readback. HTTP 503은 core unavailable만 뜻하고,
        Settlement·worker·관찰 집계 문제는 200 degraded와 closed reason code로
        구분한다. 응답은 사용자 식별 정보와 PII 원문을 포함하지 않는다.
      responses:
        "200":
          description: ready 또는 degraded 운영 상태
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOpsHealth" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503":
          description: core database unavailable. 동일 readback shape로 unavailable 사유를 반환한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOpsHealth" }
  /admin/ops/heartbeats:
    get:
      operationId: getOperatorOpsHeartbeats
      summary: 운영자가 read-only Healthchecks 하트비트 상태를 읽는다
      description: >-
        ADR-0040 §6 L1 readback. API key와 ping URL은 브라우저에 노출하지 않으며,
        key가 설정되지 않은 상태도 configured=false인 정상 응답으로 반환한다.
      responses:
        "200":
          description: Healthchecks 연결 상태와 PII 없는 check 목록
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOpsHeartbeats" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/ops/samples:
    get:
      operationId: getOperatorOpsSamples
      summary: 운영자가 bounded ops health 시계열을 읽는다
      description: >-
        5분 간격 first-party display sample을 최대 600개로 decimate해 반환한다.
        임계 판정과 경보는 이 endpoint가 아니라 host watch와 Healthchecks가 소유한다.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
      responses:
        "200":
          description: 요청 기간과 오래된 순서의 chart-ready sample
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOpsSamples" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/ops/sessions:
    get:
      operationId: listActiveAuthSessions
      summary: 허용된 운영자가 활성 로그인 세션을 조회한다
      description: >-
        ADR-0040 §10 ops 화면용. 토큰·해시는 반환하지 않으며 세션 식별과 강제
        revoke 판단에 필요한 최소 정보만 담는다.
      responses:
        "200":
          description: 만료·폐기되지 않은 세션 목록 (최신 생성순, 최대 500)
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAuthSessions" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/ops/users/{userId}/session-revocations:
    post:
      operationId: revokeUserAuthSessions
      summary: 허용된 운영자가 한 사용자의 모든 활성 세션을 사유와 함께 즉시 폐기한다
      description: >-
        조치와 사유는 operator action audit에 append-only로 남는다. 활성 세션이
        없어도 결정 자체를 감사에 기록한다.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonDetail]
              properties:
                reasonDetail: { type: string, minLength: 8, maxLength: 500 }
      responses:
        "200":
          description: 폐기된 세션 수
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionRevocation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/managed-runner/usage:
    get:
      operationId: getManagedRunnerServerUsage
      summary: 허용된 운영자가 서버 전체 ManagedRunner API 사용량을 UTC 일자별로 조회한다
      description: 사용자별 사용량, prompt, 모델 응답과 provider credential은 반환하지 않는다.
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        "200":
          description: 누락 날짜를 0으로 채운 서버 전체 일별 토큰·비용 원장
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedRunnerServerUsage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/managed-runner/reservations/{reservationId}/resolutions:
    post:
      operationId: resolveManagedRunnerUnknownReservation
      summary: 허용된 운영자가 UNKNOWN 비용 reservation을 provider 증거로 SETTLED 또는 RELEASED로 판정한다
      description: >-
        GAP-024 운영 reconcile. 자동 판정 경로는 없으며 같은 reservation은 정확히
        한 번만 닫힌다. RELEASED는 보류 headroom을 반환하고, SETTLED는 증거 금액
        또는 보수적으로 보류 전액을 settled로 전환한다. provider 재호출을
        일으키지 않는다.
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, reasonDetail, evidenceReference]
              properties:
                outcome: { type: string, enum: [SETTLED, RELEASED] }
                reasonDetail: { type: string, minLength: 8, maxLength: 500 }
                evidenceReference: { type: string, minLength: 1, maxLength: 500 }
                settledAmountMicros:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        "200":
          description: 판정이 적용된 reservation 상태
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedRunnerReservationResolution"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /account/wallet-registration-attempts:
    post:
      operationId: createWalletRegistrationAttempt
      summary: 서명 전 10분 Wallet 등록 시도를 만들며 Wallet 자체는 아직 저장하지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, chainId, clientOperationId]
              properties:
                address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
                chainId: { type: string, examples: ["eip155:91342"] }
                clientOperationId: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201":
          description: 동일 operation은 서명 메시지와 nonce를 exact replay한다
          content:
            application/json:
              schema:
                type: object
                required: [attempt, replay]
                properties:
                  attempt: { $ref: "#/components/schemas/WalletRegistrationAttempt" }
                  replay: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/wallet-registration-attempts/{attemptId}/complete:
    parameters:
      - name: attemptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeWalletRegistrationAttempt
      summary: 유효한 EIP-191 서명 뒤에만 Wallet, 소유권 proof와 default를 원자 저장한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, signature, clientOperationId]
              properties:
                nonce: { type: string }
                signature: { type: string }
                clientOperationId: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: 불변 등록 command 결과와 조회 시점의 최신 Wallet projection
          content:
            application/json:
              schema:
                type: object
                required:
                  [registration, latestWallet, ownershipProof, replay]
                properties:
                  registration:
                    { $ref: "#/components/schemas/WalletRegistrationResult" }
                  latestWallet:
                    { $ref: "#/components/schemas/WalletProjection" }
                  ownershipProof: { $ref: "#/components/schemas/WalletOwnershipProof" }
                  replay: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/overview:
    get:
      operationId: getAccountOverview
      summary: 등록 지갑별 ownership·MockDojang KYC 행동과 계정 설정 projection을 조회한다
      responses:
        "200":
          description: 결제 재사용을 위한 Account projection
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/AccountOverview" }
        "401": { $ref: "#/components/responses/Error" }
  /account/shipping-profiles/default:
    put:
      operationId: saveDefaultShippingProfile
      summary: 실제 배송 주소를 암호화해 기본 profile로 저장하고 마스킹된 metadata만 반환한다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingAddressInput" }
      responses:
        "201":
          description: 마스킹된 기본 배송 profile
          content:
            application/json:
              schema:
                type: object
                required: [shippingProfile]
                properties:
                  shippingProfile: { $ref: "#/components/schemas/ShippingProfile" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/shipping-profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: retireShippingProfile
      summary: profile을 폐기하되 이미 발행된 AgencyOrder 배송 snapshot은 유지한다
      responses:
        "204": { description: 폐기됨 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/shipping-profiles/{profileId}/reveal:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revealOwnedShippingProfile
      summary: 인증된 소유자에게 자신의 배송 profile 원문을 no-store로 공개한다
      responses:
        "200":
          description: 캐시하면 안 되는 소유자 배송 주소
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store, max-age=0" }
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address: { $ref: "#/components/schemas/ShippingAddress" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/wallets/{walletId}/kyc-cases:
    parameters:
      - name: walletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: startKYCVerification
      summary: 최근 10분 이내의 현재 proof로 TEST/SIMULATED MockDojang KYC를 시작한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownershipProofId, clientOperationId]
              properties:
                ownershipProofId: { type: string, format: uuid }
                clientOperationId: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201":
          description: MockDojang provider operation이 시작된 KYC case
          content:
            application/json:
              schema:
                type: object
                required: [kycCase, replay]
                properties:
                  kycCase: { $ref: "#/components/schemas/KYCVerificationCase" }
                  replay: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/kyc-cases/{caseId}/check:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: checkKYC
      summary: MockDojang 결과를 확인하고 credential과 최신 observation을 원자 기록한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientOperationId]
              properties:
                clientOperationId: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: 확인된 case와 선택적 credential·observation
          content:
            application/json:
              schema:
                type: object
                required: [kycCase, replay]
                properties:
                  kycCase: { $ref: "#/components/schemas/KYCVerificationCase" }
                  credential: { $ref: "#/components/schemas/KYCCredential" }
                  observation: { $ref: "#/components/schemas/KYCEvidenceObservation" }
                  replay: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/wallets/{walletId}/deregister:
    parameters:
      - name: walletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: deregisterWallet
      summary: 과거 기록을 보존하고 Wallet과 현재 proof를 이후 새 행동에서 제외한다
      responses:
        "204": { description: 등록 해제됨 }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/policy-acceptances/test-settlement:
    post:
      operationId: acceptTestSettlementPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyVersion]
              properties:
                policyVersion: { type: string, const: "2026-07-24" }
      responses:
        "200":
          description: versioned TEST 고지 동의
          content:
            application/json:
              schema:
                type: object
                required: [acceptance]
                properties:
                  acceptance: { $ref: "#/components/schemas/PolicyAcceptance" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /settlement/config:
    get:
      operationId: getSettlementConfig
      summary: 현재 TEST settlement와 faucet의 공개 런타임 설정을 반환한다
      responses:
        "200":
          description: 브라우저가 chain·token·faucet·settlement를 검증하는 공개 설정
          content:
            application/json:
              schema:
                type: object
                required: [settlement]
                properties:
                  settlement: { $ref: "#/components/schemas/SettlementConfig" }
        "401": { $ref: "#/components/responses/Error" }
  /curations:
    get:
      operationId: listCurations
      summary: 사이드바가 보여줄 Curation 제목을 생성 시각 최신순으로 한 쪽씩 조회한다
      description: >-
        보관되지 않은 Curation을 (createdAt, curationId) 최신순으로 20개씩 준다(ADR-0079).
        before와 after는 함께 쓸 수 없다. 제거된 view, sort, limit, cursor 매개변수는 400이다.
      parameters:
        - name: before
          in: query
          description: 이 커서보다 오래된 행. 더 보기에 쓰는 nextCursor 값.
          schema: { type: string, minLength: 1 }
        - name: after
          in: query
          description: 이 커서 뒤에 생긴 행. 탭 복귀 확인에 쓰는 latestCursor 값.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: 사이드바 한 쪽. Target·Session·IntelligenceJob은 읽지 않는다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, curations]
                properties:
                  schemaVersion: { type: string, const: vitlane.curation-list.v2 }
                  curations:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/CurationListItem" }
                  nextCursor:
                    type: string
                    minLength: 1
                    description: >-
                      더 오래된 행이 남았음. after 응답에 있으면 새 행이 한 쪽보다 많다는 뜻이라
                      호출자는 목록을 이 쪽으로 새로 시작한다.
                  latestCursor:
                    type: string
                    minLength: 1
                    description: >-
                      호출자가 이제 아는 가장 최신 행. 첫 쪽과 after 응답에만 있다. after에 새 행이
                      없으면 받은 커서를 그대로 돌려준다.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /shopping-plans:
    post:
      operationId: createShoppingPlan
      summary: 기본 AUTO 또는 명시한 SINGLE 방식으로 Plan을 멱등 생성한다
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShoppingPlanRequest" }
      responses:
        "201":
          description: |
            @Intent-NextStep의 결과로 immutable Plan과 독립 Curation(PLANNING)을
            같은 transaction에서 반환하고 INITIAL PlanningTask와 그
            IntelligenceJob을 시작한다. SINGLE/AUTO 모두 Target·ResearchRound는 0개이며 SINGLE
            INITIAL Proposal만 Target 하나로 제한한다. Intent의 전체 조사 설정은
            immutable Plan과 Planning context에 포함된다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /shopping-plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getShoppingPlan
      responses:
        "200":
          description: Plan 집계와 연결된 Session들
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResult" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/available-actions:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    get:
      operationId: getAvailableCurationActions
      summary: 현재 Curation phase/version에서 Server가 허용하는 typed action catalog를 조회한다
      responses:
        "200":
          description: UI가 임의로 확장할 수 없는 authoritative action catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableCurationActions" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/actions:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    get:
      operationId: listCurationActions
      summary: immutable CurationAction audit envelope를 생성 순서대로 조회한다
      description: |
        PATCH_ONLY도 audit에 존재한다. workspace timeline은 모든 사용자 command를
        projection하고 APPEND에만 결과를 연결한다.
      responses:
        "200":
          description: 최대 100개의 immutable action envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actions]
                properties:
                  actions:
                    type: array
                    items: { $ref: "#/components/schemas/CurationAction" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/actions/{actionId}/target-remove:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - $ref: "#/components/parameters/CurationActionId"
    put:
      operationId: executeTargetRemoveAction
      summary: PATCH_ONLY Target 제거 행동을 IntelligenceJob 없이 원자적으로 실행한다
      description: |
        Target과 해당 Target의 active Selection을 soft-remove한다. 기존
        Research Session·Round·Candidate와 AgencyOrder source snapshot은 유지하고
        AgencyOrder lifecycle과 Curation phase는 변경하지 않는다. actionId는 immutable audit ID다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetRemoveActionRequest" }
      responses:
        "201":
          description: 새 Target 제거 action 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetRemoveActionResult" }
        "200":
          description: 같은 action ID와 payload의 결과 replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetRemoveActionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /intelligence/jobs/{jobId}/retry:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryIntelligenceJob
      summary: retryable로 실패한 IntelligenceJob을 사용자 요청으로 다시 연다
      responses:
        "202":
          description: |
            Job이 PENDING으로 돌아가 다음 dispatch에 실행된다. Server가
            retryable로 분류한 실패만 다시 열리고 attempt 상한이 그대로
            적용되므로 무한 재시도 비용이 될 수 없다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntelligenceJobRef" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /curation-actions/{actionId}/cancel:
    parameters:
      - name: actionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelCurationAction
      summary: 진행 중인 CurationAction의 남은 작업을 멈춘다
      description: |
        해당 action에서 파생된 PENDING/RUNNING IntelligenceJob을 모두 CANCELLED로
        닫고 각 Job이 잡고 있던 제품 target도 같은 transaction에서 함께 닫는다.
        늦은 worker 결과나 retry는 CANCELLED Job을 덮거나 다시 열 수 없다.
        롤백은 없다: 이미
        만들어진 Target이나 Candidate는 사용자의 것이므로 그대로 남고, 남은
        작업만 실행하지 않는다. 이 command가 끝나면 해당 Plan은 다음 action을
        받을 수 있다.
      responses:
        "200":
          description: |
            멈춘 Job 수. action이 이미 끝났으면 0이며 그것도 성공이다 —
            사용자가 멈추라고 했고 멈춰 있다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelCurationActionResult" }
        "401": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/conversation-requests:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    post:
      operationId: submitCurationConversationRequest
      summary: 기존 수동·retry 대화 요청을 접수하고 이전 대기 메시지를 종결한다
      description: 신규 자연어 Auto 요청은 /curations/{curationId}/threads를 사용한다. 이 endpoint의 AUTO 입력은 CURATION_AUTO_THREAD_REQUIRED로 거절한다.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurationConversationRequest" }
      responses:
        "202":
          description: 접수·해소 결과. 수락 제의와 독립적인 새 요청이다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurationConversationRequestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/follow-ups/{messageId}/responses:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: respondToCurationFollowUp
      summary: 해당 메시지에 수락·취소·확인을 기록한다. 수락은 저장된 exact 행동을 실행한다.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response, expectedVersion, clientRequestId]
              properties:
                response: { type: string, enum: [ACCEPT, DISMISS, ACKNOWLEDGE] }
                expectedVersion: { type: integer, minimum: 1 }
                clientRequestId: { type: string, format: uuid }
      responses:
        "200":
          description: 동일 요청 재전송도 같은 처리를 반환하며 새 작업을 만들지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: RECORDED }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/workspace:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    get:
      operationId: getCurationWorkspace
      summary: Curation의 상태·command timeline·live artifact와 CartView를 복구한다
      responses:
        "200":
          description: 여러 제품의 canonical read model을 합성한 lifecycle-neutral workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurationWorkspace" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /shopping-plans/{planId}/expansions:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: createCurationExpansion
      summary: PLANNING_ADD_TARGETS 또는 CURATION_ADD_TARGETS typed action을 실행한다
      description: |
        Idempotency-Key, curationActionId와 owner command ID는 같은 UUID다.
        AUTO의 첫 PLANNING_ADD_TARGETS만 INITIAL CurationRun을 만들고 그 밖에는
        EXPANSION Run을 만든다. 유효한 Proposal은 Target과 READY Session까지만
        materialize한다. CURATION_ADD_TARGETS는 그 뒤 같은 action lineage의
        Research child Work를 시작한다. 기존 Target과 Curation phase는 바꾸지 않는다.
      parameters:
        - $ref: "#/components/parameters/CurationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteExpansionActionRequest" }
      responses:
        "202":
          description: INITIAL 또는 EXPANSION Run과 연결된 PlanningTask가 생성되거나 멱등 재생됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateCurationExpansionResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /shopping-plans/{planId}/expansions/current:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getCurrentCurationExpansion
      summary: 새로고침 복구를 위해 현재 열린 CurationRun을 조회한다
      description: |
        Plan당 동시에 하나만 허용되는 열린 INITIAL/EXPANSION Run을 반환한다. 만료되거나
        취소된 PlanningTask와 Research 결과 상태를 먼저 조정하며, 열린 Run이
        없으면 404를 반환한다. 응답의 planningTask.contextVersion/contextHash는
        해당 Run의 immutable Planning context이고 replay는 항상 true다.
      responses:
        "200":
          description: 현재 열린 Run, 연결된 PlanningTask와 복구 표시
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateCurationExpansionResult" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /shopping-plans/{planId}/expansions/{runId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCurationExpansion
      summary: INITIAL 또는 EXPANSION CurationRun의 진행 상태를 조회한다
      description: |
        Run은 Planning owner의 Target materialization lifecycle만 나타낸다.
        ResearchRound와 Intelligence 실행 상태는 복제하지 않으며, current endpoint와
        달리 ID로 terminal Run도 조회할 수 있다.
      responses:
        "200":
          description: CurationRun 상태
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/CurationRun" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /shopping-plans/{planId}/research-rounds:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: startPlanResearch
      summary: PLANNING_START_CURATING action으로 명시 Session의 최초 조사를 시작한다
      description: |
        Idempotency-Key와 curationActionId는 같은 UUID다. Curation phase를
        CURATING으로 전이하고 선택한 active Target별 첫 ResearchRound와
        Round별 IntelligenceJob을 같은 transaction에서 만든다. Round당 Job은
        하나뿐이라 같은 action을 재전송해도 조사가 중복 실행되지 않는다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartCuratingActionRequest" }
      responses:
        "201":
          description: 생성 또는 멱등 replay된 ResearchRound 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartPlanResearchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/liked-variants:
    get:
      operationId: listCatalogLikedVariants
      summary: 현재 사용자의 Variant 및 원본 상품 fallback 좋아요를 조회한다
      responses:
        "200":
          description: 계정 범위 Variant 좋아요
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogLikedVariant" }
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/LikedProductV1" }
        "401": { $ref: "#/components/responses/Error" }
  /account/purchase-checks:
    get:
      operationId: listAccountPurchaseChecks
      summary: 현재 사용자가 구매 체크한 외부 상품을 계정 범위로 조회한다
      description: >-
        사용자 자기보고(SELF_REPORTED)의 계정 사영이다(ADR-0075). 주문·결제·영수증이
        아니며 checked=true 기록만 최신순으로 최대 50건 반환한다. snapshot은 체크
        시점에 사용자가 본 표시값이고, 스냅샷 도입 전 Amazon 기록은 null이다. 상품
        URL과 상품군 제목은 저장값이 아니라 참조와 현재 Target에서 도출한다.
      responses:
        "200":
          description: no-store 사용자 소유 데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseCheckListV1" }
        "401": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/hydrations:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    post:
      operationId: hydrateCatalogResearchWorkspace
      summary: 소스별로 Candidate 표시값을 새로 조회한다
      description: >-
        canonical Curation workspace는 DB-only다. VISIBLE_TARGET은 해당 Target의
        visible Candidate만, HIDDEN_TARGET은 사용자가 연 해당 Target의 hidden
        Candidate만 no-store로 보강한다. CANDIDATE는 미해결 Candidate 하나만 다시
        조회한다. AMAZON과 한국 외부 판매처 source는 candidateId를 포함한 CANDIDATE
        scope 한 개만 허용한다. Shopify Target당 최대 50개이며 일부 Candidate가
        UNRESOLVED여도 나머지 READY Candidate는 함께 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, targetId]
              properties:
                source: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$', default: SHOPIFY }
                scope: { type: string, enum: [VISIBLE_TARGET, HIDDEN_TARGET, CANDIDATE] }
                targetId: { type: string, format: uuid }
                candidateId:
                  type: string
                  minLength: 1
                  description: CANDIDATE scope에서만 필수다.
              oneOf:
                - properties:
                    scope: { type: string, enum: [VISIBLE_TARGET, HIDDEN_TARGET] }
                  not: { required: [candidateId] }
                - required: [candidateId]
                  properties:
                    scope: { type: string, const: CANDIDATE }
      responses:
        "200":
          description: fresh Candidate 표시값과 저장된 configuration·interaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogResearchHydration" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/targets/{targetId}/criteria:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: targetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTargetCriteria
      summary: 다음 조사에 사용할 현재 대상·축을 조회한다. 기존 Target은 null일 수 있다.
      responses:
        "200":
          description: 현재 기준. 기존 후보의 평가 snapshot과 독립적이다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TargetCriteriaSetV1"
                  - { type: 'null' }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: changeTargetCriteria
      summary: 기준 version CAS와 body idempotencyKey로 현재 기준만 변경한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, expectedCriteriaVersion, expectedCurationVersion, idempotencyKey, criteria]
              properties:
                schemaVersion: { type: string, const: vitlane.criteria-command.v1 }
                expectedCriteriaVersion: { type: integer, minimum: 0 }
                expectedCurationVersion: { type: integer, minimum: 1 }
                idempotencyKey: { type: string, minLength: 1, maxLength: 180 }
                criteria: { $ref: "#/components/schemas/TargetCriteriaSetV1" }
      responses:
        "200":
          description: 저장된 기준. 동일 요청은 같은 결과를 재생한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetCriteriaSetV1" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/targets/{targetId}/catalog-research/expansions:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: targetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: expandCatalogResearchTarget
      deprecated: true
      summary: 제거된 동기 Expand. 외부 호출 없이 410 RESEARCH_EXPAND_REMOVED를 반환한다.
      responses:
        "410": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/variant-pages:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: getCatalogResearchVariantPage
      summary: 소스별 명시적 Variant를 최대 20개씩 조회한다. Amazon은 relationToken을 반환한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cursorToken:
                  type: string
                  minLength: 1
                  description: 서버가 발급한 short-lived opaque next-page token
      responses:
        "200": { description: 최대 20개 Variant와 opaque next-page token }
        default: { $ref: "#/components/responses/Error" }
  /admin/catalog-sources/amazon/usage:
    get:
      operationId: getAmazonAPIUsage
      summary: 운영자 전용 Amazon API 잔여량과 24시간 호출·실패 원인
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 마지막 quota 확인값, 보수적인 추정 잔여량, safe reason code. 미확인은 null이며 0으로 대체하지 않는다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmazonAPIUsageV3" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/catalog-sources/amazon/control:
    put:
      operationId: setAmazonSourceControl
      summary: 최신 운영자 인증으로 Amazon 신규 API 호출 On/Off 저장
      description: DB에 운영 의도를 저장하고 version 충돌을 검사한다. 실행 중인 호출은 완료될 수 있다. 저장된 후보·반응·외부 구매 기록은 변경하지 않는다. 설정 변경 자체는 provider를 호출하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, expectedVersion]
              properties:
                enabled: { type: boolean }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 저장한 운영 설정과 서버 capability
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, control, configured, enabled, mode]
                properties:
                  schemaVersion: { type: string, const: vitlane.amazon-source-control.v1 }
                  control: { $ref: "#/components/schemas/AmazonSourceControl" }
                  configured: { type: boolean }
                  enabled: { type: boolean }
                  mode: { type: string, enum: [LIVE, STUB, DISABLED] }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/amazon/state:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: amazonState
      summary: 선택 옵션·버전과 사용자 구매 체크를 DB에서 조회
      responses:
        "200":
          description: no-store 사용자 소유 데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmazonCandidateStateV3" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/amazon/external-link:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: amazonExternalLink
      summary: 저장된 선택 ASIN의 외부 구매 링크. provider 호출 없음
      responses:
        "200":
          description: no-store 사용자 소유 데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalLinkV3" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/amazon/resolve:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: amazonResolve
      summary: relationToken으로 검증한 단일 ASIN의 현재 상세
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantRef, relationToken]
              properties:
                variantRef: { $ref: "#/components/schemas/AmazonVariantRefV3" }
                relationToken: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "200":
          description: no-store 사용자 소유 데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmazonVariantResolutionV3" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/amazon/purchase-check:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: amazonPurchaseCheck
      summary: 구매 자기보고 저장·취소. Cart·Order·Payment를 생성하지 않음
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantRef, checked, expectedVersion]
              properties:
                variantRef: { $ref: "#/components/schemas/AmazonVariantRefV3" }
                checked: { type: boolean }
                expectedVersion: { type: integer, minimum: 0 }
                snapshot:
                  description: >-
                    체크 시점에 사용자가 본 표시값(ADR-0075). 계정 목록 전용이며 카탈로그·
                    가격·주문 권위가 아니다. 생략하면 이전 스냅샷을 유지한다.
                  $ref: "#/components/schemas/PurchaseCheckSnapshotV1"
      responses:
        "200":
          description: no-store 사용자 소유 데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalPurchaseFeedbackV3" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/liveControl:
    get:
      operationId: getLiveControl
      summary: 정적 상한과 DB runtime deny overlay의 PayPal Live 상태를 조회한다
      responses:
        "200":
          description: credential을 포함하지 않는 운영자 Live 제어 사영
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveControlResponse" }
        default: { $ref: "#/components/responses/Error" }
  /admin/liveControl/kill:
    post:
      operationId: killLiveControl
      summary: 최근 재인증된 운영자가 새 Live 효과 범위를 종료한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, confirmation, reason, expectedVersion]
              properties:
                scope: { type: string, enum: [ALL_NEW_LIVE_EFFECTS, LIVE_ORDER_ISSUE, PAYPAL_LIVE_MONEY_EFFECT, LIVE_MERCHANT_EFFECT] }
                confirmation: { type: string }
                reason: { type: string, minLength: 8 }
                expectedVersion: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 종료 후 Live 제어 사영
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveControlResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/configuration:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: saveCatalogResearchCandidateConfiguration
      summary: 선택한 Variant를 Candidate의 표시 기본값으로 영속화한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, selectedOptions, observedAt]
              properties:
                relationToken: { type: string, description: Amazon 선택에서는 필수인 서버 관계 토큰 }
                expectedVersion: { type: integer, minimum: 0, description: Amazon 현재 configuration 버전. 미선택은 0 }
                variantId: { type: string, minLength: 1 }
                selectedOptions: { type: array, items: { type: string, minLength: 1 } }
                observedAt: { type: string, format: date-time }
      responses:
        "204": { description: Candidate configuration 저장 완료 }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/catalog-research/candidates/{candidateId}/variants/{variantId}/interaction:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: variantId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: saveCatalogResearchVariantInteraction
      summary: 선택 Variant의 pin·sentiment와 계정 좋아요 current state를 원자 저장한다
      description: |
        전체 원하는 상태를 받는 멱등 PUT이다. LIKE는 likedSnapshot을 같은
        PostgreSQL transaction에서 upsert하고 NONE/DISLIKE는 해당 liked 행을
        삭제한다. snapshot은 계정 표시용이며 가격·재고·checkout 권위가 아니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned, sentiment]
              properties:
                relationToken: { type: string, description: 아직 저장하지 않은 Amazon 옵션의 반응은 소유자·Candidate·직접 ASIN 관계와 만료를 검증하는 토큰 필요 }
                pinned: { type: boolean }
                sentiment: { type: string, enum: [NONE, LIKE, DISLIKE] }
                likedSnapshot:
                  $ref: "#/components/schemas/CatalogLikedVariantSnapshot"
              allOf:
                - if:
                    properties:
                      sentiment: { const: LIKE }
                  then:
                    required: [likedSnapshot]
      responses:
        "204": { description: Variant interaction 저장 완료 }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/prepare-agency-order:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    post:
      operationId: previewPrepareAgencyOrder
      summary: CartView Variant를 Shopify에서 fresh exact lookup하여 Step 2 handoff를 검증한다
      description: AgencyOrder·ResolvedOffer·CheckoutQuote·승인·결제는 아직 생성하지 않는다.
      responses:
        "200": { description: 현재 가격·재고·변경 확인 preview }
        default: { $ref: "#/components/responses/Error" }
  /agency-order-capability:
    get:
      operationId: getAgencyOrderCapability
      summary: 현재 런타임의 AgencyOrder 진입 가능 여부를 반환한다
      description: |
        기능이 비활성화되어도 이 endpoint는 항상 존재한다. Web은 READY일 때만
        OrderSheet로 이동하며 UNAVAILABLE이면 Cart를 보존하고 reasonCode를 안내한다.
      responses:
        "200":
          description: 노출 가능한 AgencyOrder capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgencyOrderCapabilityResponse" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/order-sheets:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    post:
      operationId: createAgencyOrderSheet
      summary: CartView의 exact line을 고정하고 배송지 입력 전 OrderSheet를 만든다
      description: 계정 기본 배송지는 입력 초기값일 뿐이며 이 호출은 Shopify Cart나 AgencyOrder를 만들지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedCartVersion, idempotencyKey]
              properties:
                expectedCartVersion: { type: integer, format: int64, minimum: 0 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201":
          description: 배송지 입력을 기다리는 가변 OrderSheetSession
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSheetResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /order-sheets/{orderSheetId}:
    parameters:
      - $ref: "#/components/parameters/OrderSheetId"
    get:
      operationId: getAgencyOrderSheet
      summary: 소유 사용자의 현재 OrderSheetSession을 조회한다
      responses:
        "200":
          description: 현재 OrderSheetSession
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSheetResponse" }
        "404": { $ref: "#/components/responses/Error" }
  /order-sheets/{orderSheetId}/shipping-address:
    parameters:
      - $ref: "#/components/parameters/OrderSheetId"
    put:
      operationId: setAgencyOrderShippingAddress
      summary: OrderSheet 자체 배송지를 암호화 snapshot으로 고정하고 배송 옵션 탐색을 시작한다
      description: 계정 기본 배송지는 변경하지 않는다. 사용자가 선택한 별도 Account 저장 요청만 기본 배송지를 바꾼다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSheetShippingAddressCommand"
      responses:
        "200":
          description: 배송지 snapshot과 Shop별 배송 옵션이 반영된 OrderSheetSession
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSheetResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /order-sheets/{orderSheetId}/delivery-selections:
    parameters:
      - $ref: "#/components/parameters/OrderSheetId"
    put:
      operationId: selectAgencyOrderDeliveryOptions
      summary: Shop의 모든 delivery group에 Storefront Cart 배송 옵션을 선택한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, selections]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                selections:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [shopDomain, groupId, optionId]
                    properties:
                      shopDomain: { type: string }
                      groupId: { type: string }
                      optionId: { type: string }
      responses:
        "200":
          description: 선택이 반영된 OrderSheetSession
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSheetResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /order-sheets/{orderSheetId}/preflight:
    parameters:
      - $ref: "#/components/parameters/OrderSheetId"
    post:
      operationId: preflightAgencyOrder
      summary: 주문별 결제 rail을 선택하고 Shop별 UCP Checkout tax·shipping·total을 검증한다
      description: Shopify status와 별도로 가격 완전성·typed buyer message·수동 구매 인계 가능성을 판정한다. complete_checkout은 호출하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, paymentMethod]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                paymentMethod: { type: string, enum: [TVITUSD, PAYPAL_SANDBOX, PAYPAL_LIVE] }
      responses:
        "200":
          description: 발행 가능한 READY OrderSheetSession
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSheetResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /order-sheets/{orderSheetId}/issue:
    parameters:
      - $ref: "#/components/parameters/OrderSheetId"
    post:
      operationId: issueAgencyOrder
      summary: 최종 발행 확인 뒤 AgencyOrder와 선택 rail의 PaymentInstruction을 원자 발행한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, expectedCapabilityRevision, displayedSnapshotHash, idempotencyKey, procurementApproval]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                expectedCapabilityRevision: { type: integer, format: int64, minimum: 0 }
                displayedSnapshotHash: { type: string, minLength: 1 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
                procurementApproval: { $ref: "#/components/schemas/ProcurementApproval" }
      responses:
        "201":
          description: 같은 DB transaction에서 발행된 immutable order와 instruction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgencyOrderResponse" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agencyOrder:
    get:
      operationId: listAgencyOrders
      summary: 사용자의 AgencyOrder 결제·실행·영수증 projection을 최신순으로 조회한다
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [PAYMENT_REQUIRED, IN_PROGRESS, NEEDS_ATTENTION, FINISHED, ALL], default: IN_PROGRESS }
        - name: sort
          in: query
          schema: { type: string, enum: [UPDATED_DESC, CREATED_DESC, CREATED_ASC], default: UPDATED_DESC }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string, description: view와 sort에 묶인 opaque cursor }
      responses:
        "200":
          description: AgencyOrder가 소유하는 단일 구매 추적 목록
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, agencyOrders, countsByView]
                properties:
                  schemaVersion: { type: string, const: vitlane.agency-order-list.v1 }
                  agencyOrders:
                    type: array
                    items: { $ref: "#/components/schemas/AgencyOrderProjection" }
                  nextCursor: { type: string }
                  countsByView: { $ref: "#/components/schemas/AgencyOrderListCounts" }
        "401": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    get:
      operationId: getAgencyOrder
      summary: immutable AgencyOrder와 결제·실행·영수증 projection을 조회한다
      responses:
        "200":
          description: 발행된 AgencyOrder의 현재 전체 진행 상태
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, agencyOrder]
                properties:
                  schemaVersion: { type: string, const: vitlane.agency-order-projection.v1 }
                  agencyOrder: { $ref: "#/components/schemas/AgencyOrderProjection" }
        "404": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/shipping-address-reveal:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: revealAgencyOrderShippingAddress
      summary: 소유자가 AgencyOrder 발행 시 고정된 배송 snapshot을 no-store로 조회한다
      responses:
        "200":
          description: 사용자 소유권 확인을 거친 고정 배송주소
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address: { $ref: "#/components/schemas/ShippingAddress" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/settlement-authorizations:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: createAgencyOrderSettlementAuthorization
      summary: PaymentInstruction과 현재 Wallet ownership proof로 GIWA TEST authorization을 만든다
      description: >-
        기존 sealed authorization과 같은 user·walletId·ownershipProofId 요청은 instruction
        만료 뒤에도 저장된 결과를 반환하며 nonce·서명·deadline을 갱신하지 않는다.
        현재 ownership proof가 잘못됐거나 만료됐으면 422
        SETTLEMENT_WALLET_OWNERSHIP_REQUIRED로 거절한다. 최초 발급은 만료를 허용하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - walletId
                - ownershipProofId
              properties:
                walletId:
                  type: string
                  format: uuid
                ownershipProofId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: AgencyOrder가 source인 settlement authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAuthorizationRecord"
        "202":
          description: Instruction 확인 대기. 사용 가능한 서명은 반환하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required:
                  - schemaVersion
                  - outcome
                  - reasonCode
                properties:
                  schemaVersion:
                    type: string
                    const: vitlane.payment-instruction-confirmation.v1
                  outcome:
                    type: string
                    const: WAITING
                  reasonCode:
                    type: string
                    const: PAYMENT_INSTRUCTION_CONFIRMATION_PENDING
        "409":
          $ref: "#/components/responses/SettlementQuoteStale"
        "422":
          $ref: "#/components/responses/Error"
  /agencyOrder/{agencyOrderId}/wallet-transactions:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: submitAgencyOrderWalletTransaction
      summary: AgencyOrder 결제를 위한 faucet CLAIM 또는 token APPROVE transaction을 기록한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, txHash]
              properties:
                purpose: { type: string, enum: [CLAIM, APPROVE] }
                txHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "204": { description: wallet transaction 기록 완료 }
        "422": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/settlement-transactions:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: submitAgencyOrderPayTransaction
      summary: AgencyOrder의 exact tVITUSD pay transaction을 기록한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txHash]
              properties:
                txHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "204": { description: pay transaction 기록 완료 }
        "422": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/settlement:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    get:
      operationId: getAgencyOrderSettlement
      summary: AgencyOrder의 GIWA TEST settlement 상태를 조회한다
      responses:
        "200":
          description: AgencyOrder-backed settlement
          content:
            application/json:
              schema:
                type: object
                required: [payment, authorization]
                properties:
                  payment: { $ref: "#/components/schemas/SettlementPayment" }
                  authorization: { $ref: "#/components/schemas/PaymentAuthorizationRecord" }
        "404": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/refund-intents:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: createAgencyOrderRefundIntent
      summary: refundAfter 이후 AgencyOrder TEST 결제의 기존 rail 환불 의도를 반환한다
      responses:
        "200":
          description: AgencyOrder와 결제에 고정된 환불 의도
          content:
            application/json:
              schema:
                type: object
                required: [refundIntent]
                properties:
                  refundIntent: { $ref: "#/components/schemas/RefundIntent" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/refund-transactions:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: submitAgencyOrderRefundTransaction
      summary: AgencyOrder TEST 환불 transaction을 기존 rail에 기록한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txHash]
              properties:
                txHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "204": { description: refund transaction 기록 완료 }
        "422": { $ref: "#/components/responses/Error" }
  # PayPal 고객 결제 rail. Checkout은 full-order AUTHORIZE까지만 수행하고,
  # MerchantOrder별 exact partial capture는 Procurement 시작 시 별도 실행한다.
  /agencyOrder/{agencyOrderId}/paypal/checkout:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: startPayPalCheckout
      summary: 주문에 고정된 PAYPAL SANDBOX/LIVE instruction으로 PayPal Order를 만들고 승인 URL을 반환한다
      responses:
        "200":
          description: 현재 결제 상태와 payer 승인 URL (멱등 — 열린 결제를 진행)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalCheckout" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/paypal/resume:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: resumePayPalCheckout
      summary: PayPal redirect 복귀 뒤 full-order authorization을 서버 GET으로 확정한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnNonce]
              properties:
                returnNonce: { type: string }
                cancelled: { type: boolean }
      responses:
        "200":
          description: provider 재조회로 확정한 현재 authorization 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalCheckout" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/paypal:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    get:
      operationId: getPayPalCheckout
      summary: 진행 중 PayPal 결제의 현재 상태를 조회한다 (외부 호출 없음)
      responses:
        "200":
          description: 열린 PayPal 결제의 현재 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalCheckout" }
        "404": { $ref: "#/components/responses/Error" }
  /agencyOrder/{agencyOrderId}/refund-requests:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    post:
      operationId: requestAgencyOrderRefund
      summary: 한 MerchantOrder의 불변 gross 전액 환불을 요청한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - merchantOrderId
                - reasonCode
                - publicRationale
              properties:
                merchantOrderId:
                  type: string
                  format: uuid
                  description: 다른 MerchantOrder에는 영향을 주지 않는 whole-MO 환불 경계
                reasonCode:
                  type: string
                  enum:
                    - ITEM_NOT_RECEIVED
                    - ITEM_DAMAGED_DEFECTIVE
                    - WRONG_ITEM_RECEIVED
                    - ORDER_DELAYED
                    - OTHER_SERVICE_FAULT
                publicRationale:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: 고객이 작성하며 심사와 고객 대화에 그대로 보존되는 공개 요청 근거
      responses:
        "202":
          description: 영속 요청의 현재 판단이다. 접수·대기는 구매·환불 완료를 뜻하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderProcessReceipt"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
  /agencyOrder/{agencyOrderId}/procurement-requests:
