                - expectedVersion
                - decline
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                decline:
                  type: boolean
                response:
                  type: object
                  description: TEXT/SINGLE_CHOICE/BOOLEAN_CONSENT별 typed 응답
      responses:
        "202":
          description: 영속 요청의 현재 판단이다. 접수·대기는 구매·환불 완료를 뜻하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderProcessReceipt"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
  /agencyOrder/{agencyOrderId}/receipt:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    get:
      operationId: getAgencyOrderReceipt
      summary: terminal AgencyOrder의 profile-bound 처리 기록을 조회한다
      responses:
        "200":
