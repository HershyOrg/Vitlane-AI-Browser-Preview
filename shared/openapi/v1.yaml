              status: { type: string, enum: [RESOLVING, DISPATCHED, COMPLETE] }
              actionId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
        messages:
          type: array
          description: 응답당 PROPOSAL은 0–1개. pending만 행동 가능하며 나머지는 평문 기록이다.
          items: { $ref: "#/components/schemas/CurationFollowUp" }
