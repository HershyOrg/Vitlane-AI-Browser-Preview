        operationFirstSentAt: { type: string, format: date-time }
        operationIdempotencyDeadline: { type: string, format: date-time }
        originalAuthorizedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PayPalReauthorizationAdoptionResponse:
      type: object
      required: [schemaVersion, result]
      properties:
        schemaVersion: { type: string, const: vitlane.paypal-reauthorization-adoption.v1 }
        result:
          type: object
          required: [adoption, replay]
          properties:
            adoption: { $ref: "#/components/schemas/PayPalReauthorizationAdoption" }
            replay: { type: boolean }
    PayPalMOCompensation:
      type: object
      required: [id, allocationId, fundingPositionId, agencyOrderId,
                 customerPaymentId, rail, providerEnvironment, action, cause,
                 state, amountMinor, currency, executionProfileHash,
                 idempotencyKey, version, approvedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        allocationId: { type: string, format: uuid }
        fundingPositionId: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        customerPaymentId: { type: string, format: uuid }
        rail: { type: string, const: PAYPAL }
        providerEnvironment: { type: string, enum: [SANDBOX, LIVE] }
        action: { type: string, const: REFUND }
        cause: { type: string, enum: [CUSTOMER_REFUND_POST_EFFECT, PROCUREMENT_FAILURE, DELIVERY_EXCEPTION, DELAY_RULE] }
        state: { type: string, enum: [EXECUTION_PENDING, OUTCOME_UNKNOWN, SUCCEEDED, FAILED] }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, const: USD }
        executionProfileHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        providerResourceId: { type: string }
        idempotencyKey: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        approvedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PayPalMORefundAdoption:
      type: object
      required: [id, compensationId, operationId, providerEnvironment,
                 providerRefundId, providerStatus, outcomeState, amountMinor,
                 currency, parentCaptureId, invoiceId, operatorUserId,
                 publicRationale, evidenceSource, evidenceHash, observedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        compensationId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        providerEnvironment: { type: string, enum: [SANDBOX, LIVE] }
        providerRefundId: { type: string }
        providerStatus: { type: string, enum: [COMPLETED, PENDING, FAILED, CANCELLED] }
        outcomeState: { type: string, enum: [OUTCOME_UNKNOWN, SUCCEEDED, FAILED] }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, const: USD }
        parentCaptureId: { type: string }
        invoiceId: { type: string }
        operatorUserId: { type: string, format: uuid }
        publicRationale: { type: string, minLength: 1, maxLength: 2000 }
        evidenceSource: { type: string, enum: [PAYPAL_DASHBOARD, PAYPAL_API, PAYPAL_WEBHOOK, OTHER] }
        evidenceHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        observedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PayPalMORefundAdoptionResponse:
      type: object
      required: [schemaVersion, result]
      properties:
        schemaVersion: { type: string, const: vitlane.paypal-mo-refund-adoption.v1 }
        result:
          type: object
          required: [compensation, adoption, replay]
          properties:
            compensation: { $ref: "#/components/schemas/PayPalMOCompensation" }
            adoption: { $ref: "#/components/schemas/PayPalMORefundAdoption" }
            replay: { type: boolean }
    PayPalCheckout:
      type: object
      required: [schemaVersion, payment, attempt]
      properties:
        schemaVersion: { type: string, enum: ["vitlane.payment-paypal-checkout.v1"] }
        payment:
          type: object
          required:
            [id, agencyOrderId, rail, providerEnvironment, asset, economicEffect,
             merchantExecutionMode, executionProfileHash, amountMinor, currency,
             state, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            agencyOrderId: { type: string, format: uuid }
            rail: { type: string, enum: [PAYPAL] }
            providerEnvironment: { type: string, enum: [SANDBOX, LIVE] }
            asset: { type: string, enum: [USD] }
            economicEffect: { type: string, enum: [NO_REAL_VALUE, REAL_MONEY] }
            merchantExecutionMode: { type: string, enum: [SIMULATED_NO_EFFECT, LIVE_MERCHANT_EFFECT] }
            executionProfileHash: { type: string }
            amountMinor: { type: integer, format: int64 }
            currency: { type: string, enum: [USD] }
            state:
              type: string
              enum:
                [CREATED, ACTION_REQUIRED, PROCESSING, OUTCOME_UNKNOWN,
                 AUTHORIZED, PARTIALLY_CAPTURED, CAPTURED, CLOSED,
                 FAILED, ABANDONED, EXPIRED, SUPERSEDED]
            lastReasonCode: { type: string }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        attempt:
          type: object
          required: [id, customerPaymentId, sequence, state, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            customerPaymentId: { type: string, format: uuid }
            sequence: { type: integer }
            state: { type: string }
            paypalOrderId: { type: string }
            approvalUrl: { type: string, format: uri }
            lastReasonCode: { type: string }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        approvalUrl: { type: string, format: uri }
        returnNonce: { type: string }
    AgencyOrderRefundRequest:
      type: object
      description: One request targets one MerchantOrder and its immutable gross allocation; no line or unit decision exists.
      required: [id, agencyOrderId, merchantOrderId, allocationId, requestedGrossAmount, state, reasonCode, publicRationale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        merchantOrderId: { type: string, format: uuid }
        allocationId: { type: string, format: uuid }
        requestedGrossAmount: { $ref: "#/components/schemas/AgencyMoney" }
        state: { type: string, enum: [REQUESTED, REVIEWING, RESOLVED] }
        reasonCode: { type: string, enum: [ITEM_NOT_RECEIVED, ITEM_DAMAGED_DEFECTIVE, WRONG_ITEM_RECEIVED, ORDER_DELAYED, OTHER_SERVICE_FAULT] }
        publicRationale: { type: string, minLength: 1, maxLength: 500 }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        decisionPublicRationale: { type: string, minLength: 1, maxLength: 2000 }
        decidedAt: { type: string, format: date-time }
        reviewContext: { $ref: "#/components/schemas/RefundReviewContext" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RefundReviewContext:
      type: object
      description: Operator-only whole-MO evidence. Lines describe products and physical units describe logistics facts; neither carries money.
      required: [orderNumber, merchantOrderId, allocationId, shopDomain, merchantId, merchantOrderState, requestedGrossAmount, lines, units]
      properties:
        orderNumber: { type: string }
        merchantOrderId: { type: string, format: uuid }
        allocationId: { type: string, format: uuid }
        shopDomain: { type: string }
        merchantId: { type: string }
        externalOrderRef: { type: string }
        merchantOrderState: { type: string }
        requestedGrossAmount: { $ref: "#/components/schemas/AgencyMoney" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RefundReviewLine" }
        units:
          type: array
          items: { $ref: "#/components/schemas/RefundReviewUnitFact" }
        internalNote: { type: string, maxLength: 4000 }
    RefundReviewLine:
      type: object
      required: [lineId, quantity, productTitle, selectedOptions]
      properties:
        lineId: { type: string }
        quantity: { type: integer, minimum: 1 }
        productUrl: { type: string, format: uri }
        productTitle: { type: string }
        variantId: { type: string }
        variantTitle: { type: string }
        selectedOptions: { type: array, items: { type: string } }
    RefundReviewUnitFact:
      type: object
      required: [merchantOrderUnitId, lineId, unitIndex, disposition, deliveryFacts, returnFacts]
      properties:
        merchantOrderUnitId: { type: string, format: uuid }
        lineId: { type: string }
        unitIndex: { type: integer, minimum: 1 }
        disposition: { type: string }
        deliveryFacts:
          type: object
          required: [recorded]
          properties:
            recorded: { type: boolean }
            expectedFulfillment: { type: string }
            shipmentState: { type: string }
            carrier: { type: string }
            trackingRef: { type: string }
            latestEventStatus: { type: string }
            latestEventNote: { type: string }
            latestEventOccurredAt: { type: string, format: date-time }
            resolutionCause: { type: string }
            resolutionDecision: { type: string }
            resolutionNote: { type: string }
            resolutionRecordedAt: { type: string, format: date-time }
        returnFacts:
          type: object
          required: [recorded]
          properties:
            recorded: { type: boolean }
            state: { type: string }
            merchantDisposition: { type: string }
            note: { type: string }
            updatedAt: { type: string, format: date-time }
    AgencyOrderReceipt:
      type: object
      required: [id, agencyOrderId, kind, paymentRail, providerEnvironment, asset, economicEffect, merchantExecutionMode, executionProfileHash, legalSale, terminalState, terminalTxHash, receiptHash, payload, createdAt]
      oneOf:
        - required: [settlementPaymentId]
        - required: [customerPaymentId]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        settlementPaymentId: { type: string, format: uuid }
        customerPaymentId: { type: string, format: uuid }
        kind: { type: string, enum: [TEST, LIVE_ORDER_RECORD] }
        paymentRail: { type: string, enum: [GIWA, PAYPAL] }
        providerEnvironment: { type: string, enum: [TESTNET, SANDBOX, LIVE] }
        asset: { type: string, enum: [TVITUSD, USD] }
        economicEffect: { type: string, enum: [NO_REAL_VALUE, REAL_MONEY] }
        merchantExecutionMode: { type: string, enum: [SIMULATED_NO_EFFECT, LIVE_MERCHANT_EFFECT] }
        executionProfileHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        legalSale:
          type: boolean
          description: Whether at least one Live merchant order reached PLACED; the Vitlane record is not the merchant's tax receipt.
        terminalState: { type: string, enum: [COMPLETED_ALL, COMPLETED_PARTIAL, REFUNDED_ALL, COMPLETED, REFUNDED] }
        terminalTxHash: { type: string, minLength: 1, maxLength: 255, description: GIWA transaction hash or PayPal Capture/Refund reference. }
        receiptHash: { type: string }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
    AgencyOrderCustomerAction:
      type: object
      description: 서버가 계산한 고객 명령 공간 하나(ADR-0055 §5 — 자문 공간,
        권위 검증은 각 명령 endpoint의 트랜잭션 검사)
      required: [kind]
      properties:
        kind: { type: string, enum: [PAY, CANCEL_PRE_EFFECT, CANCEL_DELAY_RULE, REQUEST_REFUND] }
        rail: { type: string, enum: [GIWA, PAYPAL], description: PAY 전용 결제 rail 축 }
        eligibleMerchantOrderIds:
          type: array
          items: { type: string, format: uuid }
        reasonCodes:
          type: array
          items: { type: string }
    AgencyOrderUnitView:
      type: object
      description: Physical-unit logistics projection. Refund money and customer actions remain on MerchantOrder.
      required: [merchantOrderUnitId, merchantOrderId, allocationId, lineId, unitIndex, shopDomain, stage, refundStatus]
      properties:
        merchantOrderUnitId: { type: string, format: uuid }
        merchantOrderId: { type: string, format: uuid }
        allocationId: { type: string, format: uuid }
        lineId: { type: string }
        unitIndex: { type: integer, minimum: 1 }
        shopDomain: { type: string }
        stage:
          type: string
          enum:
            [ORDERED, PROCURING, PROCUREMENT_FAILED, CANCELLED,
             AWAITING_SHIPMENT, IN_TRANSIT, DELIVERED, EXCEPTION,
             RETURN_IN_PROGRESS, REFUND_REQUESTED, REFUND_PENDING, REFUNDED]
        refundStatus: { type: string, enum: [AVAILABLE, REQUESTED, REFUND_PENDING, REFUNDED] }
        shipment:
          type: object
          required: [id, carrier, trackingRef, state]
          properties:
            id: { type: string, format: uuid }
            carrier: { type: string }
            trackingRef: { type: string }
            state: { type: string }
        returnState: { type: string, enum: [REQUESTED, RETURN_IN_TRANSIT, RECEIVED, MERCHANT_RETURNED, CLOSED, CANCELLED] }
        resolutionCause: { type: string, enum: [MISSING, WRONG_ACTUAL, LOST] }
        resolutionDecision: { type: string, enum: [REFUND, DELIVERED_OK] }
    AgencyOrderProjection:
      type: object
      required: [agencyOrder, paymentInstruction, process, availableActions, chainTransactions, merchantOrders, shipments, units]
      properties:
        agencyOrder: { $ref: "#/components/schemas/AgencyOrder" }
        paymentInstruction: { $ref: "#/components/schemas/AgencyPaymentInstruction" }
        process: { $ref: "#/components/schemas/AgencyOrderProcess" }
        availableActions:
          type: array
          description: 이 상태에서 고객이 할 수 있는 행동의 공간 — FE는 자격
            판정 없이 이 공간을 렌더한다
          items: { $ref: "#/components/schemas/AgencyOrderCustomerAction" }
        payment: { $ref: "#/components/schemas/AgencyOrderPaymentProjection" }
        chainTransactions:
          type: array
          items: { $ref: "#/components/schemas/AgencyOrderChainTransaction" }
        merchantOrders:
          type: array
          items: { $ref: "#/components/schemas/MerchantOrderSummary" }
        shipments:
          type: array
          items: { $ref: "#/components/schemas/ShipmentSummary" }
        units:
          type: array
          description: Physical-unit logistics detail; never a cancellation/refund money boundary.
          items: { $ref: "#/components/schemas/AgencyOrderUnitView" }
        notices:
          type: array
          items: { $ref: "#/components/schemas/AgencyOrderCustomerNotice" }
        receipt: { $ref: "#/components/schemas/AgencyOrderReceipt" }
    OperatorOrderLookupIdentifierType:
      type: string
      enum:
        - AUTO
        - AGENCY_ORDER_ID
        - PAYMENT_ID
        - PAYPAL_ORDER_ID
        - PAYPAL_CAPTURE_ID
        - PAYPAL_REFUND_ID
        - MERCHANT_ORDER_ID
        - MERCHANT_ORDER_REF
        - SHIPMENT_ID
        - TRACKING_REF
        - GIWA_TX_HASH
    OperatorOrderLookupRequest:
      type: object
      additionalProperties: false
      required: [identifierType, value, environment]
      properties:
        identifierType: { $ref: "#/components/schemas/OperatorOrderLookupIdentifierType" }
        value: { type: string, minLength: 1, maxLength: 256 }
        environment: { type: string, enum: [ANY, SANDBOX, TESTNET, LIVE] }
        shopDomain: { type: string, maxLength: 200, description: MERCHANT_ORDER_REF ambiguity qualifier }
        carrier: { type: string, maxLength: 100, description: TRACKING_REF ambiguity qualifier }
    OperatorOrderLookupMatch:
      type: object
      additionalProperties: false
      required: [agencyOrderId, matchedBy, environment, paymentRail]
      properties:
        agencyOrderId: { type: string, format: uuid }
        matchedBy: { $ref: "#/components/schemas/OperatorOrderLookupIdentifierType" }
        environment: { type: string, enum: [SANDBOX, TESTNET, LIVE] }
        paymentRail: { type: string, enum: [GIWA, PAYPAL] }
    OperatorOrderLookupResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, match]
      properties:
        schemaVersion: { type: string, const: vitlane.ordering-operator-order-lookup.v1 }
        match: { $ref: "#/components/schemas/OperatorOrderLookupMatch" }
    OperatorOrderIdentifier:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { $ref: "#/components/schemas/OperatorOrderLookupIdentifierType" }
        value: { type: string }
        qualifier: { type: string }
        relatedResourceId: { type: string }
    OrderProcessReceipt:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - agencyOrderId
        - requestId
        - flowId
        - kind
        - outcome
        - guidance
      properties:
        schemaVersion:
          type: string
          const: vitlane.order-process-receipt.v1
        agencyOrderId:
          type: string
          format: uuid
        merchantOrderId:
          type: string
          format: uuid
        requestId:
          type: string
        flowId:
          type: string
          format: uuid
        kind:
          type: string
        outcome:
          type: string
          enum:
            - RECEIVED
            - ACCEPTED
            - DEFERRED
            - WAITING
            - COMPLETED
            - REJECTED
        guidance:
          type: object
          required:
            - customerAction
            - operatorAction
          properties:
            reasonCode:
              type: string
            waitingFor:
              type: string
            customerAction:
              type: string
            operatorAction:
              type: string
    OperatorOrderTimelineResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, timeline]
      properties:
        schemaVersion: { type: string, const: vitlane.ordering-operator-order-timeline.v3 }
        timeline: { $ref: "#/components/schemas/OperatorOrderTimeline" }
    OperatorOrderTimeline:
      type: object
      additionalProperties: false
      required:
        - agencyOrderId
        - process
        - requests
        - decisions
        - events
        - effects
      properties:
        agencyOrderId:
          type: string
          format: uuid
        process:
          type: object
          additionalProperties: false
          required:
            - state
            - version
            - lastAppliedSeq
            - updatedAt
          properties:
            state:
              type: string
            terminalReason:
              type: string
            lastReasonCode:
              type: string
            version:
              type: integer
              format: int64
            lastAppliedSeq:
              type: integer
              format: int64
            wakeAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        requests:
          type: array
          items:
            $ref: "#/components/schemas/OrderProcessReceipt"
        decisions:
          type: array
          description: 결정 version별 MO 차이·발행 Effect·ProcessState다.
          items:
            type: object
            additionalProperties: false
            required:
              - version
              - seqFrom
              - seqTo
              - stageAfter
              - stageChanged
              - merchantOrders
              - effects
              - processState
              - decidedAt
            properties:
              version:
                type: integer
                format: int64
              seqFrom:
                type: integer
                format: int64
              seqTo:
                type: integer
                format: int64
              stageBefore:
                type: string
              stageAfter:
                type: string
              terminalReason:
                type: string
              lastReasonCode:
                type: string
              stageChanged:
                type: boolean
              merchantOrders:
                type: array
                items:
                  type: object
              effects:
                type: array
                items:
                  type: object
              wakeAt:
                type: string
                format: date-time
              processState:
                type: object
              decidedAt:
                type: string
                format: date-time
        events:
          type: array
          description: order_process_events — seq순. appliedVersion은 이 이벤트를 소비한 결정 version이다.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - seq
              - source
              - type
              - payload
              - occurredAt
              - recordedAt
            properties:
              id:
                type: integer
                format: int64
              seq:
                type: integer
                format: int64
              source:
                type: string
              type:
                type: string
              flowId:
                type: string
                format: uuid
              causationEffectId:
                type: string
                format: uuid
              payload:
                type: object
              occurredAt:
                type: string
                format: date-time
              recordedAt:
                type: string
                format: date-time
              sourceEntityVersion:
                type: integer
                format: int64
              appliedVersion:
                type: integer
                format: int64
        effects:
          type: array
          description: 전달 상태는 업무 성공과 별개다.
          items:
            type: object
            required:
              - effectId
              - flowId
              - target
              - type
              - deliveryState
              - claimVersion
              - idempotencyKey
              - causedByEventId
              - attemptCount
              - nextAttemptAt
              - payload
              - createdAt
            properties:
              effectId:
                type: string
                format: uuid
              flowId:
                type: string
                format: uuid
              requestId:
                type: string
              merchantOrderId:
                type: string
                format: uuid
              target:
                type: string
                enum:
                  - AGENCYORDER
                  - PAYMENT
                  - PROCUREMENT
                  - LOGISTICS
                  - SUPPORT
              type:
                type: string
              deliveryState:
                type: string
                enum:
                  - PENDING
                  - CONSUMED
              claimVersion:
                type: integer
              idempotencyKey:
                type: string
              causedByEventId:
                type: integer
              attemptCount:
                type: integer
              nextAttemptAt:
                type: string
                format: date-time
              payload:
                type: object
              createdAt:
                type: string
                format: date-time
              consumedAt:
                type: string
                format: date-time
    OperatorOrderInvestigationResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, investigation]
      properties:
        schemaVersion: { type: string, const: vitlane.ordering-operator-order-investigation.v1 }
        investigation: { $ref: "#/components/schemas/OperatorOrderInvestigation" }
    OperatorOrderInvestigation:
      type: object
      additionalProperties: false
      required:
        - order
        - process
        - paymentInstruction
        - identifiers
        - chainTransactions
        - merchantOrders
        - shipments
        - units
        - checkpoints
      properties:
        order:
          type: object
          additionalProperties: false
          required: [agencyOrderId, status, issuedAt, expiresAt, snapshotHash,
                     executionProfile, executionProfileHash, customerPayableTotal,
                     passThroughTotal, agencyFeeTotal, shippingMasked,
                     shippingCountry, issuanceEvidence, lines]
          properties:
            agencyOrderId: { type: string, format: uuid }
            status: { type: string, const: ISSUED }
            issuedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            snapshotHash: { type: string }
            executionProfile: { $ref: "#/components/schemas/OrderExecutionProfile" }
            executionProfileHash: { type: string }
            customerPayableTotal: { $ref: "#/components/schemas/Money" }
            passThroughTotal: { $ref: "#/components/schemas/Money" }
            agencyFeeTotal: { $ref: "#/components/schemas/Money" }
            shippingMasked: { type: string }
            shippingCountry: { type: string }
            issuanceEvidence: { type: object }
            lines:
              type: array
              items: { type: object }
        process: { $ref: "#/components/schemas/AgencyOrderProcess" }
        paymentInstruction:
          type: object
          description: capability·PII field를 제외한 결제 지시 evidence
        payment: { $ref: "#/components/schemas/AgencyOrderPaymentProjection" }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/OperatorOrderIdentifier" }
        chainTransactions:
          type: array
          items: { $ref: "#/components/schemas/AgencyOrderChainTransaction" }
        merchantOrders:
          type: array
          items: { $ref: "#/components/schemas/MerchantOrderSummary" }
        shipments:
          type: array
          items: { $ref: "#/components/schemas/ShipmentSummary" }
        units:
          type: array
          items: { $ref: "#/components/schemas/AgencyOrderUnitView" }
        receipt:
          type: object
          description: payload를 제외한 terminal receipt evidence
        checkpoints:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, state, observedAt]
            properties:
              kind: { type: string }
              state: { type: string }
              reasonCode: { type: string }
              reference: { type: string }
              observedAt: { type: string, format: date-time }
    AuthenticationCapabilities:
      type: object
      required: [googleEnabled, mobileGoogleEnabled, localReviewEnabled, localReviewSeeded,
                 localReviewProfiles, merchantEffectMode]
      properties:
        googleEnabled:
          type: boolean
          description: 현재 Server에 Google OIDC provider가 구성됨
        mobileGoogleEnabled:
          type: boolean
          description: >-
            Google OIDC와 하나 이상의 exact mobile redirect allowlist가 모두 구성되어
            PKCE 모바일 handoff를 시작할 수 있음
        localReviewEnabled:
          type: boolean
          description: production에서 금지되는 개발 AuthSession 경로가 활성화됨
        localReviewSeeded:
          type: boolean
          description: 빈 userId 요청을 받을 고정 로컬 검수 User가 구성됨
        localReviewProfiles:
          type: array
          description: production에서는 빈 배열인 사람이 선택할 수 있는 검수 프로필
          items:
            $ref: "#/components/schemas/LocalReviewProfile"
        merchantEffectMode:
          type: string
          enum: [SANDBOX, LIVE]
          description: 배포 전역 merchant effect 모드(ADR-0052 Step 6
            activation 소유) — 모드 배너의 단일 소스(ADR-0057 D3)
    MobileAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, verifier]
      properties:
        code:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 앱 callback이 받은 2분 유효·1회용 opaque handoff code
        verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
          description: code_challenge를 만든 PKCE verifier
    MobileAuthSession:
      type: object
