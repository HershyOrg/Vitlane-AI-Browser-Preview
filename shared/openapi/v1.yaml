          maxItems: 90
          items: { $ref: "#/components/schemas/ManagedRunnerUsageDay" }
    ManagedRunnerReservationResolution:
      type: object
      additionalProperties: false
      required: [reservationId, status, amountMicros, completedAt]
      properties:
        reservationId: { type: string, format: uuid }
        status: { type: string, enum: [SETTLED, RELEASED] }
        amountMicros: { type: integer, format: int64, minimum: 1 }
        settledAmountMicros: { type: integer, format: int64, minimum: 0 }
        completedAt: { type: string, format: date-time }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    LocationContext:
      type: object
      required: [country]
      properties:
        country: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: string }
    ResearchScope:
      type: object
      required: [country, allowedItems, blockedItems, urlMode]
      properties:
        category: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: string }
        allowedItems:
          type: array
          items: { type: string }
        blockedItems:
          type: array
          items: { type: string }
        minPrice:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        maxPrice:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        referenceUrl: { type: string }
        urlMode: { type: string, enum: [NONE, REFERENCE, EXACT_PRODUCT] }
    CreateShoppingPlanRequest:
      type: object
      required: [originalIntent, executionMode, location]
      anyOf:
        - required: [budget]
        - required: [totalBudget]
      properties:
        controlMode: { type: string, enum: [AUTO, MANUAL], description: 새 큐레이션의 모드. 홈 기본 AUTO이며 다른 큐레이션에 전파하지 않는다. }
        originalIntent: { type: string, minLength: 1 }
        planningMode:
          type: string
          enum: [SINGLE, AUTO]
          default: AUTO
        budget: { $ref: "#/components/schemas/InitialCurationBudgetV1" }
        totalBudget:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Legacy creation provenance. When budget is present, its nullable total/currency is authoritative; null does not create a hidden spending limit.
        executionMode: { type: string, enum: [EXPERIMENT, LIVE] }
        location: { $ref: "#/components/schemas/LocationContext" }
        category: { type: string }
        allowedItems:
          type: array
          items: { type: string }
        blockedItems:
          type: array
          items: { type: string }
        minPrice:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        maxPrice:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        referenceUrl: { type: string }
        urlMode: { type: string, enum: [NONE, REFERENCE, EXACT_PRODUCT], default: NONE }
        agentMode:
          type: string
          enum: [MANAGED]
          description: |
            조사 실행 주체. ADR-0038이 외부 Agent beta를 폐기해 새 Plan은
            MANAGED만 허용된다. EXTERNAL을 보내면 409
            EXTERNAL_AGENT_RETIRED로 거절되며, 폐기 전에 저장된 Plan의 멱등
            replay는 그대로 반환된다.
        modelKey:
          type: string
          description: MANAGED 실행에 사용할 모델 key. MANAGED에서 필수다.
    ShoppingPlan:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - originalIntent
        - planningMode
        - executionMode
        - totalBudget
        - locationContext
        - researchScope
        - createdAt
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        originalIntent: { type: string }
        planningMode: { type: string, enum: [SINGLE, AUTO] }
        executionMode: { type: string, enum: [EXPERIMENT, LIVE] }
        budgetRequest: { $ref: "#/components/schemas/InitialCurationBudgetV1" }
        totalBudget:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Original request budget; after EXPANSION this is not an aggregate cart total or payment approval.
        locationContext: { $ref: "#/components/schemas/LocationContext" }
        researchScope:
          allOf:
            - $ref: "#/components/schemas/ResearchScope"
          description: Intent 입력 시 확정되어 INITIAL Planning/Intelligence context에 전달되는 불변 설정 스냅샷
        createdAt: { type: string, format: date-time }
    Curation:
      type: object
      additionalProperties: false
      required:
        [id, shoppingPlanId, userId, phase, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        shoppingPlanId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        phase:
          type: string
          enum: [PLANNING, CURATING]
          description: AgencyOrder, Intelligence 실행과 archive를 포함하지 않는 유일한 persisted Curation phase
        version: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        archivedByUserId: { type: string, format: uuid }
