        schemaVersion: { type: string, const: vitlane.target-criteria.v1 }
        version: { type: integer, minimum: 1 }
        subject:
          type: object
          additionalProperties: false
          required: [label, productType]
          properties:
            label: { type: string, minLength: 1, maxLength: 100 }
            productType: { type: string, minLength: 1, maxLength: 100 }
        axes:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/ResearchAxisV1" }
        exclusions:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
    AxisAssessmentV1:
      type: object
      additionalProperties: false
      description: 생성 당시 평가. 새 기준·언어·재조사는 기존 후보를 재평가하지 않는다.
      required: [schemaVersion, criteria, weights, scores, totalBasisPoints, totalScore, contentLocale, roundId, modelKey, createdAt, source, observationHash]
      properties:
        schemaVersion: { type: string, const: vitlane.axis-assessment.v1 }
        criteria: { $ref: "#/components/schemas/TargetCriteriaSetV1" }
        weights:
          type: array
          minItems: 1
          maxItems: 8
          description: 축 순서와 같고 largest remainder 배분으로 합계가 100이다.
          items: { type: integer, minimum: 0, maximum: 100 }
        scores:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [axisId, scorePercent, basis, explanation, factIds]
            properties:
              axisId: { type: string, minLength: 1 }
              scorePercent: { type: integer, minimum: 0, maximum: 100 }
              basis: { type: string, enum: [PROVIDED, INFERRED, UNKNOWN] }
              explanation: { type: string, minLength: 1, maxLength: 400 }
              factIds:
                type: array
                items: { type: string, enum: [name, description, price, image] }
        totalBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        totalScore: { type: integer, minimum: 0, maximum: 100 }
        contentLocale: { type: string, enum: [ko-KR, en-US] }
        roundId: { anyOf: [{ type: string, format: uuid }, { const: "" }], description: "BACKGROUND_FINDING에서는 빈 값이며 findingId를 사용한다." }
        findingId: { type: string, format: uuid }
        modelKey: { type: string }
        source: { type: string }
        observationHash: { type: string }
        createdAt: { type: string, format: date-time }
    ResearchDiscoveryOutcomeV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, status, addedCount, duplicateCount, rejectedCount]
      properties:
        schemaVersion: { type: string, const: vitlane.research-discovery-outcome.v1 }
        status:
          type: string
          enum: [ADDED, NO_NEW_CANDIDATES, EVALUATING]
          description: EVALUATING은 수집 직후 미평가로 먼저 공개된 상태다. Round가 종결되면 ADDED 또는 NO_NEW_CANDIDATES가 된다.
        addedCount: { type: integer, minimum: 0, maximum: 50 }
        duplicateCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        evaluatedCount:
          type: integer
          minimum: 0
          description: addedCount 중 유효한 축 평가를 받은 수. 이전 Round 기록에는 없을 수 있다.
        unevaluatedCount:
          type: integer
          minimum: 0
          description: addedCount 중 평가 없이 admitted된 수. 정렬 시 0점이며 후보에서 제외되지 않는다.

