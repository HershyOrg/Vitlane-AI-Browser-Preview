          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
  /support/messages:
    get:
      operationId: listSupportMessages
      summary: 내 지원 대화 메시지를 최신순으로 조회한다
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: 이 메시지 id보다 오래된 페이지를 조회한다(커서)
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 최신순 메시지 목록
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, messages]
                properties:
                  schemaVersion: { type: string, const: vitlane.support-messages.v1 }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/SupportMessage" }
    post:
      operationId: sendSupportMessage
      summary: 고객이 지원 대화에 메시지를 보낸다 — agencyOrderId 첨부는 자기 소유 주문만 서버가 허용한다(운영자와 대칭)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                agencyOrderId: { type: string, format: uuid }
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SupportMessageMultipart"
      responses:
        "201":
          description: 접수된 메시지
          content:
            application/json:
              schema:
                type: object
                required: [message, replay]
                properties:
                  message: { $ref: "#/components/schemas/SupportMessage" }
                  replay: { type: boolean }
        "200":
          description: 멱등 재생
          content:
            application/json:
              schema:
                type: object
                required: [message, replay]
                properties:
                  message: { $ref: "#/components/schemas/SupportMessage" }
                  replay: { type: boolean, const: true }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /support/messages/read:
    post:
      operationId: markSupportMessagesRead
      summary: 내 대화의 안 읽은 답변 전체를 읽음 처리한다(워터마크, 멱등)
      responses:
        "200":
          description: 읽음 처리 결과
