                    - RETURN_IN_TRANSIT
                    - RECEIVED
                    - MERCHANT_RETURNED
                    - CLOSED
                    - CANCELLED
                merchantDisposition:
                  type: string
                  enum:
                    - RESTOCKED
                    - MERCHANT_REFUNDED
                    - DISCARDED
                    - UNRESOLVED
                note:
                  type: string
                  maxLength: 2000
      responses:
        "202":
          description: 영속 요청의 현재 판단이다. 접수·대기는 구매·환불 완료를 뜻하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderProcessReceipt"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
      parameters:
        - name: Idempotency-Key
