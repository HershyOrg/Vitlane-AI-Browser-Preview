              variantId: { type: string }
              configurationVersion: { type: integer }
              quantity: { type: integer, minimum: 1 }
              cartItemId: { type: string }
              checkoutEligible: { type: boolean }
              allocationFit: { type: string, enum: [WITHIN, OVER, UNKNOWN] }
        currency: { type: string, enum: [USD, KRW] }
        minimumMinor: { type: [integer, 'null'], format: int64 }
        maximumMinor: { type: [integer, 'null'], format: int64 }
        budgetMinor: { type: [integer, 'null'], format: int64 }
        differenceMinor: { type: [integer, 'null'], format: int64 }
        budgetStatus: { type: string, enum: [WITHIN, OVER, UNKNOWN, NO_LIMIT] }
        priceBasis: { type: string, enum: [EXACT, RANGE, ESTIMATED, UNKNOWN] }
        estimated: { type: boolean }
        missingTargetIds: { type: array, items: { type: string } }
        sourceState: { type: string }
        budgetVersion: { type: integer }
        cartVersion: { type: integer }
        criteriaVersions: { type: object, additionalProperties: { type: integer } }
        compatibility: { type: string, enum: [SUPPORTED, UNVERIFIED, UNRELATED, CONFLICT] }
        reasons: { type: array, maxItems: 3, items: { type: string } }
        tips:
          type: array
