          description: 서버 KoreanCatalogAPIs 정의의 API 상품 id(OWN_PRODUCT, OWN_WEB, NAVER_WEBKR, SERP_GOOGLE, ELEVENST_HTML, KURLY_JSON, ZIGZAG_HTML, LOTTEON_HTML, DAISOMALL_HTML …). 새 몰 API는 계약 변경 없이 추가된다.
        apiProvider:
          type: string
        apiProduct:
          type: string
        quotaScope:
          type: string
        resources:
          $ref: '#/components/schemas/ResearchProviderResourceStateV1'
        configured:
          type: boolean
        control:
          $ref: '#/components/schemas/AmazonSourceControl'
        localRequestsPerMinute:
          type: integer
          minimum: 1
        localDailyLimit:
          type: integer
          minimum: 1
        localMaxConcurrent:
          type: integer
          minimum: 1
          description: 이 API 상품의 동시 진행 호출 상한(Vitlane 로컬 보호값). 초과 admission은 짧게 한 번 기다린 뒤 재시도한다.
        requests24h:
          type: integer
          minimum: 0
        notFound24h:
          type: integer
          minimum: 0
          description: 24시간 내 정상 완료했지만 상품을 발견하지 못한 호출 수. 11번가가 판매 중지·잘못된 상품번호에 돌려주는 HTTP 200 stub이 여기에 들어가며 failures24h와 분리한다.
        failures24h:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - reasonCode
            - count
            properties:
              reasonCode:
                type: string
              count:
                type: integer
                minimum: 0
        estimatedRemaining:
          type: integer
          minimum: 0
        quota:
          $ref: '#/components/schemas/CatalogProviderQuotaV1'
    ResearchRoundSummaryV1:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - windowDays
      - since
      - generatedAt
      - rounds
      - failures
      - sources
      - apiCalls
      - admitted
      - evaluation
      - steps
      - attempts
      - reservations
      properties:
        schemaVersion:
          type: string
          const: vitlane.research-round-summary.v1
        steps:
          type: array
          description: 조사 Job의 Intelligence step 종류별 완료 소요 시간(초). 완료된 step만 집계한다.
          items:
            type: object
            additionalProperties: false
            required: [kind, count, p50Seconds, p95Seconds]
            properties:
              kind: { type: string }
              count: { type: integer, minimum: 0 }
              p50Seconds: { type: number, minimum: 0 }
              p95Seconds: { type: number, minimum: 0 }
        attempts:
          type: array
          description: 조사 attempt의 상태·failure code 분포. Round 행이 감추는 QUOTA_EXCEEDED·EFFECT_UNKNOWN을 포함한다.
          items:
            type: object
            additionalProperties: false
            required: [status, failureCode, count]
            properties:
              status: { type: string }
              failureCode: { type: string }
              count: { type: integer, minimum: 0 }
        reservations:
          type: array
          description: managed 모델 예산 예약 원장의 상태별 건수와 금액(USD micros). HELD·UNKNOWN은 당일 한도를 계속 점유한다.
          items:
            type: object
            additionalProperties: false
            required: [status, count, amountMicros]
            properties:
              status: { type: string }
              count: { type: integer, minimum: 0 }
              amountMicros: { type: integer, minimum: 0 }
        windowDays:
          type: integer
          minimum: 1
          maximum: 30
        since:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        routes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [routeId, policyVersion, productVertical, decision, reason, count, meanPressure]
            properties:
              routeId: { type: string }
              policyVersion: { type: string }
              productVertical: { type: string }
              decision: { type: string, enum: [STARTED, SUCCEEDED, PARTIAL, EMPTY, FAILED, SKIPPED, DEFERRED] }
              reason: { type: string }
              count: { type: integer, minimum: 0 }
              meanPressure: { type: number, minimum: 0, maximum: 1 }
        rounds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [country, status, count]
            properties:
              country: { type: string }
              status: { type: string }
              count: { type: integer, minimum: 0 }
        failures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [failureCode, stepKind, retryable, count]
            properties:
              failureCode: { type: string }
              stepKind:
                type: string
                description: 실패를 기록한 마지막 Intelligence step. 기록이 없으면 빈 문자열.
              retryable: { type: boolean }
              count: { type: integer, minimum: 0 }
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [country, source, status, reasonCode, count]
            properties:
              country: { type: string }
              source: { type: string }
              status: { type: string }
              reasonCode: { type: string }
              count: { type: integer, minimum: 0 }
        apiCalls:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [apiId, outcome, billable, count]
            properties:
              apiId: { type: string }
              outcome: { type: string }
              billable:
                type: boolean
                description: false는 로컬 admission 거절 기록이며 upstream 호출이 아니다.
              count: { type: integer, minimum: 0 }
        admitted:
          type: object
          additionalProperties: false
          required: [rounds, median, buckets]
          properties:
            rounds: { type: integer, minimum: 0 }
            median: { type: number, minimum: 0 }
            buckets:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [label, count]
                properties:
                  label: { type: string }
                  count: { type: integer, minimum: 0 }
        evaluation:
          type: object
          additionalProperties: false
          required: [evaluated, unevaluated]
          properties:
            evaluated: { type: integer, minimum: 0 }
            unevaluated: { type: integer, minimum: 0 }
