      responses:
        "200":
          description: 고객 신원과 최신순 메시지
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, userId, messages, awaitingReply, actionRequired]
                properties:
                  schemaVersion: { type: string, const: vitlane.support-thread.v2 }
                  userId: { type: string, format: uuid }
                  customer: { $ref: "#/components/schemas/SupportCustomerContact" }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/SupportMessage" }
                  awaitingReply: { type: boolean }
                  awaitingCustomerMessageId: { type: string, format: uuid, description: "awaitingReply=true일 때 처리 대상인 최신 ordinary 고객 TEXT 메시지" }
                  actionRequired: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: replySupportConversation
      summary: 운영자가 답변한다 — agencyOrderId 첨부 시 소유자 일치를 서버가 검증한다
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
