    parameters:
      - $ref: "#/components/parameters/ProcurementTaskId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: recordProcurementResult
      summary: effect lock 뒤 운영자가 실행 mode에 맞는 TEST/LIVE 구매 사실을 기록하고 서버가 증거 해시·시각을 생성한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - done
              oneOf:
                - properties:
                    done:
                      const: true
                  required:
                    - evidenceKind
                    - externalOrderRef
                    - receiptSafeRef
                    - amountMode
                    - evidenceSource
                - properties:
                    done:
                      const: false
                  required:
                    - failureCode
              properties:
                done:
                  type: boolean
                failureCode:
                  type: string
                  enum:
                    - VARIANT_UNAVAILABLE
                    - VARIANT_COMBINATION_INVALID
                    - VARIANT_AMBIGUOUS
                    - VARIANT_REQUIRES_CLARIFICATION
                    - PRODUCT_UNAVAILABLE
                    - PRICE_CHANGED
                    - SHIPPING_UNAVAILABLE
                evidenceKind:
                  type: string
                  enum:
                    - SANDBOX_TEST_EVIDENCE
                    - LIVE_MERCHANT_EFFECT_EVIDENCE
                  description: 저장된 MerchantOrder executionMode와 정확히 일치해야 한다
                externalOrderRef:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: TEST/LIVE 모두 opaque safe reference만 허용
                receiptSafeRef:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: 영수증 원문·URL·credential이 아닌 안전한 reference
                amountMode:
                  type: string
                  enum:
                    - UNCHANGED
                    - CHANGED
                  description: UNCHANGED면 서버가 승인된 MO 총액을 사용한다. CHANGED일 때만 actualAmountMinor가 필수다
                actualAmountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                  description: CHANGED일 때 UI의 USD 입력을 cent로 변환한 값. 승인 상한 이하여야 한다
                evidenceSource:
                  type: string
                  enum:
                    - OPERATOR_OBSERVATION
                    - MERCHANT_PAGE
                    - MERCHANT_POLICY
                    - RECEIPT
                    - OTHER
      responses:
        "202":
          description: 영속 요청의 현재 판단이다. 접수·대기는 구매·환불 완료를 뜻하지 않는다.
