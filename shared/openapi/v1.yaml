      properties:
        schemaVersion: { const: vitlane.curation-budget.v1 }
        commandId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
        kind: { type: string, enum: [ENABLE, DISABLE, SET_TOTAL, SET_TARGET, SET_QUANTITY, SET_MINIMUM] }
        currency: { type: string, enum: [KRW, USD], description: ENABLE 또는 SET_TOTAL에서 원장 통화 설정. SET_TOTAL은 새 통화의 총액과 전체 배분을 원자적으로 저장한다. }
        totalAmount: { type: string }
        allocationMode:
          type: string
          enum: [AUTO, EQUAL, MANUAL, PROPORTIONAL]
          description: 활성화 AUTO/EQUAL/MANUAL, 총액 편집 PROPORTIONAL/MANUAL. 지속 모드가 아닌 primitive 입력 형식이다. 통합 Auto는 검증된 MANUAL 배분값으로 호출한다.
