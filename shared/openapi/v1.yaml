        schema: { type: string, format: uuid }
    get:
      operationId: getSupportOperatorThread
      summary: 운영자가 한 고객의 대화 스레드를 조회한다
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
