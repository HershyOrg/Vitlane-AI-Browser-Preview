    CurationThreadResponseV1:
      type: object
      description: >-
        Thread가 마지막 RESPONSE Action에서 쓴 글(ADR-0086). body는 상품을 [[c1]] 같은 참조 토큰으로만
        부르고 references가 그 토큰을 저장된 후보로 푼다. 알 수 없는 참조·직접 링크는 거절한다. 자연어 가격·상품명은 완전 검증하지 않는다.
        v2의 optional combination은 서버 계산 금액과 상태 version을 갖는 과거 추천이며 결제 견적이 아니다.
      additionalProperties: false
      required:
      - schemaVersion
      - kind
      - body
      - locale
      - references
      - createdAt
      properties:
        schemaVersion:
          type: string
          enum: [vitlane.thread-response.v1, vitlane.thread-response.v2]
        kind:
          type: string
          enum:
          - COMMENT
          - ANSWER
        body:
          type: string
          maxLength: 1200
        locale:
          type: string
        references:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - ref
            - candidateId
            - targetId
            - title
            properties:
              ref:
                type: string
                pattern: '^[a-z][a-z0-9]{0,7}$'
              candidateId:
                type: string
              targetId:
                type: string
              title:
                type: string
        modelKey:
          type: string
        createdAt:
          type: string
          format: date-time
        combination:
          $ref: '#/components/schemas/CurationCombinationV1'
    CurationCombinationV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, kind, items, currency, minimumMinor, maximumMinor, budgetMinor, differenceMinor, budgetStatus, priceBasis, estimated, missingTargetIds, sourceState, budgetVersion, cartVersion, criteriaVersions, compatibility, reasons, tips, cautions, budgetAdvice]
      properties:
        schemaVersion: { type: string, const: vitlane.combination.v1 }
        id: { type: string }
        kind: { type: string, enum: [PICK, ECONOMY, ALTERNATIVE] }
        items:
