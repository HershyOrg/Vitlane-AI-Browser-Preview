        processState: { type: string }
        terminalReason: { type: string }
        # 이 MO의 배송 진실 요약(운영정합 4차) — deliveredUnits는 수령 확인만 세고,
        # 예외 lane(누락·오배송·분실) 수는 exceptionUnits로 따로 온다(5차 C3).
