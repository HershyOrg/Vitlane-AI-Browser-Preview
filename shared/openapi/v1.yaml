        productTitle: { type: string }
        variantTitle: { type: string }
        selectedOptions: { type: array, items: { type: string } }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: "#/components/schemas/AgencyMoney" }
        lineSubtotal: { $ref: "#/components/schemas/AgencyMoney" }
        observedAt: { type: string, format: date-time }
        evidenceHash: { type: string }
    AgencyShippingSnapshot:
      type: object
      required: [snapshotRef, snapshotRevision, snapshotHash, maskedSummary, country]
      properties:
        snapshotRef: { type: string, format: uuid }
        snapshotRevision: { type: integer, format: int64, minimum: 1 }
        snapshotHash: { type: string }
        maskedSummary: { type: string }
        country: { type: string, const: US }
    AgencyMerchantCheckout:
      type: object
      required: [merchantId, shopDomain, lineRefs, deliveryGroups, providerStatus, procurementHandling, totals, authoritativeTotal, taxTotal, dutiesDisposition, authEvidence, completionRoute, quoteReadiness, observedAt, expiresAt, evidenceHash]
      properties:
        merchantId: { type: string }
        shopDomain: { type: string }
        lineRefs: { type: array, minItems: 1, items: { type: string } }
        deliveryGroups:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, lineRefs, options]
            properties:
              id: { type: string }
              lineRefs: { type: array, items: { type: string } }
              options:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [id, title, amountMinor, currency]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    amountMinor: { type: integer, format: int64, minimum: 0 }
                    currency: { type: string, const: USD }
              selectedOptionRef: { type: string }
        providerStatus: { type: string }
        providerNotices:
          type: array
          description: 주문 행동과 가격을 바꾸지 않는 immutable provider 관찰값
          items:
            type: object
            additionalProperties: false
            required: [source, presentation, audience, registered]
            properties:
              source: { type: string, enum: [MESSAGE, REQUIREMENT] }
              type: { type: string }
              severity: { type: string }
              code: { type: string }
              safePath: { type: string }
              text: { type: string, maxLength: 1000 }
              presentation: { type: string, enum: [NOTICE, DISCLOSURE, INTERNAL] }
              audience: { type: string, enum: [CUSTOMER_AND_OPERATOR, OPERATOR] }
              registered: { type: boolean }
        procurementHandling:
          type: string
          enum: [NORMAL, OPERATOR_LATER, CUSTOMER_CORRECTION, IMPOSSIBLE]
        totals:
          type: array
          items:
            type: object
            required: [type, amountMinor]
            properties:
              type: { type: string }
              amountMinor: { type: integer, format: int64 }
              displayText: { type: string }
        authoritativeTotal: { $ref: "#/components/schemas/AgencyMoney" }
        taxTotal: { $ref: "#/components/schemas/AgencyMoney" }
        dutiesDisposition: { type: string }
        authEvidence: { type: object }
        completionRoute: { type: string }
        quoteReadiness:
          type: string
          enum: [ESTIMATED, CONFIRMED, UNSAFE, STALE]
        continueUrlSafeRef:
          type: string
          description: raw continue_url이 아닌 암호화 capability vault 참조
        continueUrlHash: { type: string }
        quoteFingerprint: { type: string }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidenceHash: { type: string }
    OrderSheet:
      type: object
      required: [id, sourceCart, lines, shippingAddressInput, shippingAddressSource, merchantCheckouts, passThroughTotal, agencyFee, customerPayableTotal, version, state, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        sourceCart: { type: object }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AgencyOrderLine" } }
        shippingAddress: { $ref: "#/components/schemas/AgencyShippingSnapshot" }
        shippingAddressInput: { $ref: "#/components/schemas/OrderSheetShippingAddressInput" }
        shippingAddressSource:
          type: string
          enum: [EMPTY, ACCOUNT_DEFAULT, ORDER_SHEET]
          description: ACCOUNT_DEFAULT는 폼 초기값일 뿐 AgencyOrder의 배송지 snapshot이 아니다
        paymentSelection: { type: string, enum: [TVITUSD, PAYPAL_SANDBOX, PAYPAL_LIVE] }
        merchantCheckouts: { type: array, items: { $ref: "#/components/schemas/AgencyMerchantCheckout" } }
        displayedSnapshotHash: { type: string }
        issuedAgencyOrderId: { type: string, format: uuid }
        passThroughTotal: { $ref: "#/components/schemas/AgencyMoney" }
        agencyFee: { $ref: "#/components/schemas/AgencyMoney" }
        customerPayableTotal: { $ref: "#/components/schemas/AgencyMoney" }
        version: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [EDITING, DISCOVERING_DELIVERY, DELIVERY_SELECTION_REQUIRED, PREFLIGHTING, READY, ISSUING, CONSUMED, PRICE_CHANGED, RATE_LIMITED, BLOCKED, EXPIRED] }
        blockReason: { type: string }
        retryAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    OrderSheetResponse:
      type: object
      required: [schemaVersion, orderSheet]
      properties:
        schemaVersion: { type: string, const: vitlane.order-sheet.v1 }
        orderSheet: { $ref: "#/components/schemas/OrderSheet" }
    AgencyOrder:
      type: object
      required: [id, status, sourceCartSnapshot, lines, shippingAddress, paymentSelection,
                 executionProfile, executionProfileHash, procurementAuthorization,
                 merchantCheckouts, passThroughTotal, agencyFee, customerPayableTotal,
                 issuanceEvidence, issuedAt, expiresAt, snapshotHash]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, const: ISSUED }
        sourceCartSnapshot: { type: object }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AgencyOrderLine" } }
        shippingAddress: { $ref: "#/components/schemas/AgencyShippingSnapshot" }
        paymentSelection: { type: object }
        executionProfile: { $ref: "#/components/schemas/OrderExecutionProfile" }
        executionProfileHash: { type: string }
        procurementAuthorization: { $ref: "#/components/schemas/ProcurementAuthorization" }
        merchantCheckouts: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AgencyMerchantCheckout" } }
        passThroughTotal: { $ref: "#/components/schemas/AgencyMoney" }
        agencyFee: { type: object }
        customerPayableTotal: { $ref: "#/components/schemas/AgencyMoney" }
        issuanceEvidence: { type: object }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        snapshotHash: { type: string }
    AgencyPaymentSelection:
      type: object
      description: 발행 시 주문 snapshot에 불변 기록되는 결제 축(ADR-0042 §6 ·
        ADR-0057 2차 P0) — economicEffect가 "가짜 돈/진짜 돈"의 주문별 진실이며
        MerchantOrder executionMode가 여기서 파생된다(fail-close).
      required: [rail, providerEnvironment, asset, economicEffect, merchantExecution]
      properties:
        rail: { type: string, enum: [GIWA, PAYPAL] }
        providerEnvironment: { type: string, enum: [TESTNET, SANDBOX, LIVE] }
        asset: { type: string, enum: [TVITUSD, USD] }
        economicEffect: { type: string, enum: [NO_REAL_VALUE, REAL_MONEY] }
        merchantExecution: { type: string, enum: [SIMULATED, LIVE] }
    OrderExecutionProfile:
      type: object
      description: AgencyOrder 발행 시 고정되며 결제·조달·환불 전체가 참조하는 실행 tuple
      required: [paymentRail, providerEnvironment, asset, economicEffect, merchantExecutionMode]
      properties:
        paymentRail: { type: string, enum: [GIWA, PAYPAL] }
        providerEnvironment: { type: string, enum: [TESTNET, SANDBOX, LIVE] }
        asset: { type: string, enum: [TVITUSD, USD] }
        economicEffect: { type: string, enum: [NO_REAL_VALUE, REAL_MONEY] }
        merchantExecutionMode: { type: string, enum: [SIMULATED_NO_EFFECT, LIVE_MERCHANT_EFFECT] }
    ProcurementApproval:
      type: object
      additionalProperties: false
      required: [agencyConsent, privacyConsent, locale, copyVersion]
      properties:
        orderMessage: { type: string, maxLength: 500 }
        deliveryMessage: { type: string, maxLength: 500 }
        agencyConsent: { type: boolean, const: true }
        privacyConsent: { type: boolean, const: true }
        locale: { type: string, enum: [en-US, ko-KR] }
        copyVersion: { type: string, const: procurement-authorization.v1 }
    ProcurementAuthorization:
      type: object
      description: 운영자 수동 구매의 불변 고객 승인 범위. continue URL은 선택적 reference일 뿐 실행 권한이 아니다.
      required: [kind, shops, approvedPassThrough, approvedAgencyFee,
                 approvedCustomerPayable, customerApproval, orderSheetSessionId,
                 sourceCartSnapshotHash, displayedSnapshotHash,
                 executionProfileHash, acceptedAt, authorizationHash]
      properties:
        kind: { type: string, const: MANUAL_OPERATOR_PURCHASE }
        shops:
          type: array
          minItems: 1
          items:
            type: object
            required: [merchantId, shopDomain, lines, approvedAmount, conditions, quoteFingerprint, evidenceHash]
            properties:
              merchantId: { type: string }
              shopDomain: { type: string }
              lines:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [lineId, productUrl, productTitle, variantId, variantTitle, selectedOptions, quantity, unitPrice, lineSubtotal]
                  properties:
                    lineId: { type: string }
                    productUrl: { type: string, format: uri }
                    productTitle: { type: string }
                    variantId: { type: string }
                    variantTitle: { type: string }
                    selectedOptions: { type: array, items: { type: string } }
                    quantity: { type: integer, minimum: 1 }
                    unitPrice: { $ref: "#/components/schemas/AgencyMoney" }
                    lineSubtotal: { $ref: "#/components/schemas/AgencyMoney" }
              approvedAmount: { $ref: "#/components/schemas/AgencyMoney" }
              conditions: { type: object }
              providerNotices: { type: array, items: { type: object } }
              manualSiteSteps:
                type: array
                items:
                  type: object
                  required: [resolution, kind, code]
                  properties:
                    resolution: { type: string, const: MANUAL_SITE_STEP }
                    kind: { type: string }
                    code: { type: string }
                    safePath: { type: string }
              quoteFingerprint: { type: string }
              evidenceHash: { type: string }
              continueUrlSafeRef: { type: string }
              continueUrlHash: { type: string }
        approvedPassThrough: { $ref: "#/components/schemas/AgencyMoney" }
        approvedAgencyFee: { $ref: "#/components/schemas/AgencyMoney" }
        approvedCustomerPayable: { $ref: "#/components/schemas/AgencyMoney" }
        customerApproval: { $ref: "#/components/schemas/ProcurementApproval" }
        orderSheetSessionId: { type: string, format: uuid }
        sourceCartSnapshotHash: { type: string }
        displayedSnapshotHash: { type: string }
        executionProfileHash: { type: string }
        acceptedAt: { type: string, format: date-time }
        authorizationHash: { type: string }
    AgencyPaymentInstruction:
      type: object
      required: [id, agencyOrderId, agencyOrderSnapshotHash, paymentSelection,
                 executionProfileHash, customerPayableTotal, paymentPolicyVersion,
                 state, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        agencyOrderSnapshotHash: { type: string }
        paymentSelection: { $ref: "#/components/schemas/AgencyPaymentSelection" }
        executionProfileHash: { type: string }
        customerPayableTotal: { $ref: "#/components/schemas/AgencyMoney" }
        paymentPolicyVersion: { type: string }
        state: { type: string, enum: [PENDING, CONSUMED, EXPIRED, CONFLICT] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AgencyOrderResponse:
      type: object
      required: [schemaVersion, agencyOrder, paymentInstruction]
      properties:
        schemaVersion: { type: string, const: vitlane.agency-order.v1 }
        agencyOrder: { $ref: "#/components/schemas/AgencyOrder" }
        paymentInstruction: { $ref: "#/components/schemas/AgencyPaymentInstruction" }
    AgencyOrderProcess:
      type: object
      required: [agencyOrderId, state, version, createdAt, updatedAt]
      properties:
        agencyOrderId: { type: string, format: uuid }
        state:
          type: string
          enum: [WAITING_CUSTOMER_PAYMENT, PAYMENT_RECONCILIATION, PROCUREMENT_IN_PROGRESS, LOGISTICS_IN_PROGRESS, RESOLUTION_IN_PROGRESS, ATTENTION_REQUIRED, TERMINAL]
        terminalReason:
          type: string
          enum: [COMPLETED_ALL, COMPLETED_PARTIAL, REFUNDED_ALL, CANCELLED, EXPIRED]
        version: { type: integer, format: int64, minimum: 1 }
        lastReasonCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgencyOrderPaymentProjection:
      type: object
      required: [id, state, amountBaseUnits]
      properties:
        id: { type: string, format: uuid }
        state: { type: string }
        amountBaseUnits: { type: string, pattern: "^[0-9]+$" }
        payTxHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        completeTxHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        refundTxHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        safeBlock: { type: integer, format: int64, minimum: 0 }
        finalizedBlock: { type: integer, format: int64, minimum: 0 }
        lastReasonCode: { type: string }
        updatedAt: { type: string, format: date-time }
    AgencyOrderChainTransaction:
      type: object
      required: [purpose, txHash, state, blockNumber, updatedAt]
      properties:
        purpose: { type: string, enum: [CLAIM, APPROVE, PAY, COMPLETE, REFUND] }
        txHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        state: { type: string, enum: [SUBMITTED, SAFE, FINALIZED, FAILED, REORGED] }
        blockNumber: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    AgencyOrderListCounts:
      type: object
      additionalProperties: false
      required: [PAYMENT_REQUIRED, IN_PROGRESS, NEEDS_ATTENTION, FINISHED, ALL]
      properties:
        PAYMENT_REQUIRED: { type: integer, format: int64, minimum: 0 }
        IN_PROGRESS: { type: integer, format: int64, minimum: 0 }
        NEEDS_ATTENTION: { type: integer, format: int64, minimum: 0 }
        FINISHED: { type: integer, format: int64, minimum: 0, description: "모든 TERMINAL 주문. 상세 결과는 terminalReason으로 구분한다" }
        ALL: { type: integer, format: int64, minimum: 0 }
    MerchantOrderUnitSummary:
      type: object
      description: Physical-unit identity and fulfillment disposition only; no customer money is allocated here.
      required: [id, lineId, unitIndex, disposition]
      properties:
        id: { type: string, format: uuid }
        lineId: { type: string }
        unitIndex: { type: integer, minimum: 1 }
        disposition: { type: string, enum: [PENDING, CUSTOMER_REFUND_DUE, CUSTOMER_REFUND_SATISFIED, ZERO_VALUE_SATISFIED, NO_PAYMENT_EFFECT] }
    MerchantOrderSummary:
      type: object
      description: One immutable Shop-checkout cancellation/refund boundary. customerGrossAmount includes the MO-allocated Vitlane fee.
      required: [id, allocationId, shopDomain, merchantId, checkoutOrdinal, customerGrossAmount, executionMode, state, operational, units, updatedAt]
      properties:
        id: { type: string, format: uuid }
        allocationId: { type: string, format: uuid }
        shopDomain: { type: string }
        merchantId: { type: string }
        checkoutOrdinal: { type: integer, minimum: 1 }
        customerGrossAmount: { $ref: "#/components/schemas/AgencyMoney" }
        executionMode: { type: string, enum: [SIMULATED_NO_EFFECT, LIVE_MERCHANT_EFFECT] }
        state: { type: string, enum: [PLANNED, READY_TO_PLACE, PLACEMENT_PENDING, PLACED, PLACEMENT_UNKNOWN, FAILED, CANCELLED] }
        failureCode: { type: string }
        fundingState: { type: string }
        cancellationState: { type: string }
        refundRequestState: { type: string }
        compensationAction: { type: string }
        compensationState: { type: string }
        disputeState: { type: string, enum: [OPEN, RESOLVED] }
        disputeOutcome: { type: string }
        # ADR-0070: OrderProcessManager의 MO 결정 어휘. 결정 사영 전(발행 직후 ≤1 tick)에는 생략된다.
        phase:
          type: string
          enum: [PLANNED, FUNDING, PURCHASING, PLACED, FULFILLING, DELIVERED,
                 COMPENSATING, COMPENSATED, FAILED, CANCELLED]
        # 고객 취소 intent의 리듀서 판정 — 접수(202) 뒤에도 남아 처리 중·거절·미룸을 보여준다.
        cancelIntent: { $ref: "#/components/schemas/MerchantOrderCancelIntent" }
        operational: { $ref: "#/components/schemas/MerchantOrderOperationalProjection" }
        units:
          type: array
          items: { $ref: "#/components/schemas/MerchantOrderUnitSummary" }
        updatedAt: { type: string, format: date-time }
    MerchantOrderCancelIntent:
      type: object
      additionalProperties: false
      required: [kind, outcome]
      properties:
        kind: { type: string, enum: [PRE_EFFECT, DELAY_RULE] }
        outcome: { type: string, enum: [EFFECT_ISSUED, DEFERRED, REJECTED, SUCCEEDED, SUPERSEDED] }
        code: { type: string }
    MerchantOrderOperationalProjection:
      type: object
      additionalProperties: false
      description: Canonical exact-MO read projection composed by the server. AgencyOrderProcess is not an input to this state.
      required: [stage, workStage, progress, units]
      properties:
        stage:
          type: string
          enum: [PROCUREMENT_PENDING, PROCUREMENT_ACTIVE, AWAITING_SHIPMENT, IN_TRANSIT,
                 DELIVERY_EXCEPTION, REFUND_REVIEW, RETURN_IN_PROGRESS,
                 COMPENSATION_PENDING, PAYPAL_DISPUTE, ATTENTION_REQUIRED, DELIVERED, REFUNDED,
                 PROCUREMENT_FAILED, CANCELLED]
        workStage: { type: string, enum: [PROCUREMENT, LOGISTICS, ISSUE, DONE] }
        terminalReason: { type: string, enum: [DELIVERED, REFUNDED, PROCUREMENT_FAILED, CANCELLED] }
        progress:
          type: object
          additionalProperties: false
          required: [funding, procurement, delivery, resolution]
          properties:
            funding: { type: string, enum: [WAITING, CURRENT, DONE, ISSUE] }
            procurement: { type: string, enum: [WAITING, CURRENT, DONE, ISSUE] }
            delivery: { type: string, enum: [WAITING, CURRENT, DONE, ISSUE] }
            resolution: { type: string, enum: [WAITING, CURRENT, DONE, ISSUE] }
        units:
          type: object
          additionalProperties: false
          required: [total, ordered, procuring, awaitingShipment, inTransit, delivered,
                     exception, returnInProgress, refundRequested, refundPending,
                     refunded, procurementFailed, cancelled]
          properties:
            total: { type: integer, minimum: 0 }
            ordered: { type: integer, minimum: 0 }
            procuring: { type: integer, minimum: 0 }
            awaitingShipment: { type: integer, minimum: 0 }
            inTransit: { type: integer, minimum: 0 }
            delivered: { type: integer, minimum: 0 }
            exception: { type: integer, minimum: 0 }
            returnInProgress: { type: integer, minimum: 0 }
            refundRequested: { type: integer, minimum: 0 }
            refundPending: { type: integer, minimum: 0 }
            refunded: { type: integer, minimum: 0 }
            procurementFailed: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
        resolutionCause: { type: string }
        resolutionDecision: { type: string }
        returnState: { type: string }
        compensationAction: { type: string }
        compensationState: { type: string }
        disputeState: { type: string, enum: [OPEN, RESOLVED] }
        disputeOutcome: { type: string }
    OrderingOperatorWorkItemCounts:
      type: object
      additionalProperties: false
      required: [PAYMENT_RECONCILIATION, PROCESS_INTERVENTION, PROCUREMENT_EXECUTION,
                 REFUND_REVIEW, DELIVERY_RESOLUTION, RETURN_PROGRESS]
      properties:
        PAYMENT_RECONCILIATION: { type: integer, minimum: 0 }
        PROCESS_INTERVENTION: { type: integer, minimum: 0 }
        PROCUREMENT_EXECUTION: { type: integer, minimum: 0 }
        REFUND_REVIEW: { type: integer, minimum: 0 }
        DELIVERY_RESOLUTION: { type: integer, minimum: 0 }
        RETURN_PROGRESS: { type: integer, minimum: 0 }
    OrderingOperatorWorkItem:
      type: object
      description: >-
        owner 큐 항목과 허용 action의 합성. kind=PROCUREMENT_EXECUTION이면 operational과
        assignmentState가 필수인 production-shaped 응답이며 detail.processState는 주문
        요약 참고값일 뿐 MO 상태 권위가 아니다.
      required: [kind, id, agencyOrderId, state, updatedAt, actions, detail]
      properties:
        kind:
          type: string
          enum: [PAYMENT_RECONCILIATION, PROCESS_INTERVENTION, PROCUREMENT_EXECUTION,
                 REFUND_REVIEW, DELIVERY_RESOLUTION, RETURN_PROGRESS]
        id: { type: string }
        agencyOrderId: { type: string, format: uuid }
        state: { type: string }
        assignedOperatorUserId: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
        actions:
          type: array
          items: { type: string }
        operational: { $ref: "#/components/schemas/MerchantOrderOperationalProjection" }
        assignmentState: { type: string, enum: [UNASSIGNED, ACTIVE, EXPIRED, COMPLETED] }
        detail: { type: object }
        accounting: { $ref: "#/components/schemas/OrderAccountingProjection" }
    LogisticsShipment:
      type: object
      required: [id, agencyOrderId, merchantOrderId, carrier, trackingRef, state, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        merchantOrderId: { type: string, format: uuid }
        carrier: { type: string }
        trackingRef: { type: string }
        state: { type: string, enum: [CREATED, LABEL_CREATED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, EXCEPTION, LOST, RETURN_TO_SENDER, RETURNED, CANCELLED_NO_EFFECT, EXCEPTION_RECONCILIATION] }
        version: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShipmentSummary:
      type: object
      description: Logistics 실물 패키지의 고객 사영 합성(계약 v7 §9) — units.disposition 자리에 unit fulfillment가 담긴다
      required: [id, merchantOrderId, carrier, trackingRef, state, units, updatedAt]
      properties:
        id: { type: string, format: uuid }
        merchantOrderId: { type: string, format: uuid }
        carrier: { type: string }
        trackingRef: { type: string }
        state: { type: string, enum: [CREATED, LABEL_CREATED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, EXCEPTION, LOST, RETURN_TO_SENDER, RETURNED, CANCELLED_NO_EFFECT, EXCEPTION_RECONCILIATION] }
        units:
          type: array
          items:
            type: object
            required: [id, lineId, unitIndex, disposition]
            properties:
              id: { type: string, format: uuid }
              lineId: { type: string }
              unitIndex: { type: integer, minimum: 1 }
              disposition: { type: string }
        updatedAt: { type: string, format: date-time }
    # ADR-0059 이후 SYSTEM 지연 rule 고지 전용 잔여 채널 — projection.notices로만
    # 내려간다(운영자 발신·standalone 고객 API는 Support 대화로 흡수).
    AgencyOrderCustomerNotice:
      type: object
      required: [id, agencyOrderId, kind, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        kind: { type: string, enum: [SYSTEM, OPERATOR] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
    # Support 대화(ADR-0059). agencyOrderId는 주문 링크의 유일한 근거인
    # 구조화 참조다 — 고객·운영자 대칭으로 첨부하되 소유권 검증(고객=자기
    # 주문, 운영자=대상 고객 소유 주문)은 서버가 강제하고 본문은 파싱하지
    # 않는다.
    SupportMessage:
      type: object
      required: [id, author, body, createdAt, contentKind]
      properties:
        id: { type: string, format: uuid }
        author: { type: string, enum: [CUSTOMER, OPERATOR, SYSTEM] }
        body: { type: string }
        agencyOrderId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
        contentKind: { type: string, enum: [TEXT, BUSINESS_CARD] }
        businessCard: { $ref: "#/components/schemas/SupportBusinessCard" }
        attachments:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/SupportImageAttachment" }
    SupportMessageMultipart:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        agencyOrderId: { type: string, format: uuid }
        images:
          type: array
          maxItems: 4
          description: JPEG/PNG only; each image is at most 5 MiB and 24 megapixels.
          items: { type: string, format: binary }
    SupportBusinessCard:
      type: object
      required: [type, reference, actionRequired, publicPayload]
      properties:
        type:
          type: string
          enum: [PROCUREMENT_REQUEST, PROCUREMENT_RESPONSE, PROCUREMENT_DECISION, ORDER_CANCELLATION, REFUND_REQUEST, REFUND_DECISION, REFUND_STATUS, PAYPAL_DISPUTE, PAYPAL_DISPUTE_STATUS, DELIVERY_DELAY, DELIVERY_RESOLUTION]
        reference:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [PROCUREMENT, REFUND, PAYPAL_DISPUTE, DELIVERY] }
            id: { type: string, minLength: 1, maxLength: 160 }
        actionRequired: { type: boolean }
        resolvesCardId: { type: string, format: uuid }
        publicPayload:
          type: object
          additionalProperties: true
    SupportImageAttachment:
      type: object
      required: [id, mediaType, width, height, byteSize, contentSha256, createdAt, legalHold, downloadName, cacheControl]
      properties:
        id: { type: string, format: uuid }
        mediaType: { type: string, enum: [image/jpeg, image/png] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        createdAt: { type: string, format: date-time }
        retentionUntil: { type: string, format: date-time }
        legalHold: { type: boolean }
        downloadName: { type: string }
        cacheControl: { type: string, const: "private, no-store" }
    SupportCustomerContact:
      type: object
      required: [email, displayName]
      properties:
        # 탈퇴(tombstone) 계정은 빈 문자열로 온다 — 표시는 Web이 정한다.
        email: { type: string }
        displayName: { type: string }
    SupportConversation:
      type: object
      required: [userId, lastMessage, awaitingReply, actionRequired]
      properties:
        userId: { type: string, format: uuid }
        customer: { $ref: "#/components/schemas/SupportCustomerContact" }
        lastMessage: { $ref: "#/components/schemas/SupportMessage" }
        awaitingReply:
          type: boolean
          description: 최신 ordinary TEXT가 고객 발신이고 exact message의 무응답 처리 기록이 없을 때 true
        awaitingCustomerMessageId:
          type: string
          format: uuid
          description: 답변 없이 처리 행동이 대상으로 삼아야 할 exact ordinary 고객 메시지
        actionRequired:
          type: boolean
          description: 별도의 열린 typed business action card가 하나 이상이면 true
    ProcurementDecisionRecord:
      type: object
      required: [id, merchantOrderId, agencyOrderId, taskId, decision, publicRationale,
