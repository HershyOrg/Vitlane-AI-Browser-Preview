  /admin/agencyOrder/refund-requests:
    get:
      operationId: listAgencyOrderRefundReviewQueue
      summary: 주문·상품·금액·배송·회수 근거를 포함한 미종결 환불 심사 큐를 조회한다
      responses:
        "200":
          description: 내부 메모를 포함할 수 있는 운영자 전용 심사 projection
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, refundRequests]
                properties:
                  schemaVersion: { type: string, const: vitlane.agency-order-refund-queue.v2 }
                  refundRequests:
                    type: array
                    items: { $ref: "#/components/schemas/AgencyOrderRefundRequest" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/agencyOrder/refund-requests/{requestId}/decisions:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideAgencyOrderRefundRequest
      summary: whole-MerchantOrder 환불 요청 하나를 고객 공개 근거와 함께 승인 또는 거절한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - approve
                - publicRationale
              properties:
                approve:
                  type: boolean
                publicRationale:
                  type: string
                  minLength: 1
                  maxLength: 2000
                internalNote:
                  type: string
                  maxLength: 4000
      responses:
        "202":
          description: 영속 요청의 현재 판단이다. 접수·대기는 구매·환불 완료를 뜻하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderProcessReceipt"
        "409":
          $ref: "#/components/responses/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
  /admin/ordering/work-items:
    get:
      operationId: listOrderingOperatorWorkItems
      summary: owner 큐를 합성한 운영 work surface를 조회한다
      description: >-
        PROCUREMENT_EXECUTION 항목의 operational은 서버가 exact MerchantOrder 사실로
        합성한 유일한 표시 상태다. Web은 detail.processState 또는 owner 사실을 다시
        조합해 MO 상태·필터·행동을 만들지 않는다.
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED], default: OPEN }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: MO canonical projection과 서버 허용 action을 포함한 운영 항목
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, items, counts]
                properties:
                  schemaVersion: { type: string, const: vitlane.ordering-operator-work-items.v1 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrderingOperatorWorkItem" }
                  counts: { $ref: "#/components/schemas/OrderingOperatorWorkItemCounts" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/ordering/work-items/counts:
    get:
      operationId: countOrderingOperatorWorkItems
      summary: 운영 work kind와 고객 승인을 지난 Live PayPal 주문의 전역 개수를 조회한다
      responses:
        "200":
          description: 목록 limit과 무관한 kind별 개수 및 고객 승인을 지난 exact Live PayPal 주문 수
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, counts, livePayPalOrderCount]
                properties:
                  schemaVersion: { type: string, const: vitlane.ordering-operator-work-item-counts.v2 }
                  counts: { $ref: "#/components/schemas/OrderingOperatorWorkItemCounts" }
                  livePayPalOrderCount:
                    type: integer
                    minimum: 0
                    description: >-
                      PAYPAL/LIVE/USD/REAL_MONEY/LIVE_MERCHANT_EFFECT 결제에서
                      고객 PayPal 승인 fact가 저장된 주문의 이후 상태 무관 전역 개수
        "403": { $ref: "#/components/responses/Error" }
  /admin/ordering/order-lookups:
    post:
      operationId: lookupOperatorOrder
      summary: 내부·provider·판매처·물류 식별자로 AgencyOrder를 exact 조회한다
      description: >-
        운영자 전용 read surface다. 부분·유사 일치는 하지 않으며 조회 원문은
        URL이나 감사 row에 저장하지 않는다. external order/tracking 값이 여러
        주문과 일치하면 qualifier를 요구하는 409를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperatorOrderLookupRequest" }
      responses:
        "200":
          description: canonical AgencyOrder exact match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOrderLookupResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/ordering/orders/{agencyOrderId}:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    get:
      operationId: getOperatorOrderInvestigation
      summary: exact lookup 결과 주문의 PII-safe evidence 사영을 조회한다
      description: >-
        배송주소 원문·구매자 신원·checkout URL·provider payload는 제외한다.
        상세 열람도 append-only audit에 기록되며 명령은 각 owner endpoint가 소유한다.
      responses:
        "200":
          description: 주문 상태, 연결 식별자와 safe evidence checkpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOrderInvestigationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/ordering/orders/{agencyOrderId}/timeline:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
    get:
      operationId: getOperatorOrderTimeline
      summary: 주문의 process 결정 원장·이벤트·커맨드 timeline을 조회한다
      description: >-
        ADR-0070 §4.7 — 리듀서가 무엇을 보고(이벤트) 무엇을 결정해(결정 version)
        무엇을 시켰는가(커맨드)를 시간순으로 되짚는 read-only 사영이다. payload는
        procmsg 규격상 PII를 담지 않는다. 열람은 상세 조회와 같은 audit을 남긴다.
      responses:
        "200":
          description: process 상태, 결정 원장, 이벤트, 커맨드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorOrderTimelineResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/ordering/order-accounting:
    get:
      operationId: getOrderAccounting
      summary: 환경별 Order 중심 실제·예상 회계 사건을 조회한다
      description: >-
        environment는 필수다. Sandbox PayPal, Live PayPal과 Testnet tVitUSDC를
        섞지 않고, 실제 현금 사건과 아직 일어나지 않은 예상 조정을 분리한다.
      parameters:
        - name: environment
          in: query
          required: true
          schema: { type: string, enum: [SANDBOX, LIVE, TESTNET] }
      responses:
        "200":
          description: 환경이 분리된 Order별 사건 회계
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, summary]
                properties:
                  schemaVersion: { type: string, const: vitlane.order-accounting.v2 }
                  summary: { $ref: "#/components/schemas/OrderAccountingSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/payment/paypal/disputes:
    get:
      operationId: listPayPalDisputes
      summary: 환경을 반드시 지정해 PayPal 분쟁 운영 큐를 조회한다
      parameters:
        - name: environment
          in: query
          required: true
          schema: { type: string, enum: [SANDBOX, LIVE] }
        - name: state
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, ALL], default: OPEN }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Sandbox/Live가 섞이지 않은 분쟁 목록
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, disputes]
                properties:
                  schemaVersion: { type: string, const: vitlane.paypal-dispute-queue.v1 }
                  disputes:
                    type: array
                    items: { $ref: "#/components/schemas/PayPalDisputeCase" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/payment/paypal/disputes/{caseId}:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: environment
        in: query
        required: true
        schema: { type: string, enum: [SANDBOX, LIVE] }
    get:
      operationId: getPayPalDispute
      summary: 분쟁 case와 append-only Resolution Center 수동 기록을 조회한다
      responses:
        "200":
          description: 분쟁 운영 상세
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, dispute]
                properties:
                  schemaVersion: { type: string, const: vitlane.paypal-dispute.v1 }
                  dispute:
                    type: object
                    required: [case, actions]
                    properties:
                      case: { $ref: "#/components/schemas/PayPalDisputeCase" }
                      actions:
                        type: array
                        items: { $ref: "#/components/schemas/PayPalDisputeManualAction" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/payment/paypal/disputes/{caseId}/actions:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: environment
        in: query
        required: true
        schema: { type: string, enum: [SANDBOX, LIVE] }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: recordPayPalDisputeAction
      summary: PayPal Resolution Center에서 이미 수행한 수동 행동과 증거를 CAS 기록한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, actionKind, externalReference,
                         publicRationale, evidenceSource, evidenceHash, observedAt]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                actionKind: { type: string, enum: [CASE_OBSERVED, MESSAGE_SENT, EVIDENCE_SUBMITTED, OFFER_MADE, CLAIM_ACCEPTED, APPEAL_SUBMITTED, OTHER] }
                externalReference: { type: string, minLength: 1, maxLength: 255 }
                publicRationale: { type: string, minLength: 1, maxLength: 2000 }
                internalNote: { type: string, maxLength: 4000 }
                observedProviderStatus: { type: string, enum: [OPEN, WAITING_FOR_SELLER_RESPONSE, WAITING_FOR_BUYER_RESPONSE, UNDER_REVIEW, RESOLVED] }
                observedOutcome: { type: string, enum: [NONE, RESOLVED_BUYER_FAVOUR, RESOLVED_SELLER_FAVOUR, RESOLVED_WITH_PAYOUT, CANCELED_BY_BUYER, ACCEPTED, DENIED] }
                evidenceSource: { type: string, enum: [PAYPAL_RESOLUTION_CENTER, PAYPAL_EMAIL, INTERNAL_ORDER_RECORD, CARRIER, MERCHANT_RECEIPT, OTHER] }
                evidenceHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
                observedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 갱신된 case와 append-only action
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, result]
                properties:
                  schemaVersion: { type: string, const: vitlane.paypal-dispute-action.v1 }
                  result:
                    type: object
                    required: [case, action, replay]
                    properties:
                      case: { $ref: "#/components/schemas/PayPalDisputeCase" }
                      action: { $ref: "#/components/schemas/PayPalDisputeManualAction" }
                      replay: { type: boolean }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/payment/paypal/merchant-orders/{merchantOrderId}/reauthorization-adoptions:
    parameters:
      - name: merchantOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: adoptPayPalMOReauthorization
      summary: 만료된 원 요청이 만든 기존 PayPal authorization을 fresh GET으로만 검증·채택한다
      description: >-
        새 PayPal POST나 새 provider request key를 만들지 않는다. resource ID가 없는
        SENT/UNKNOWN 재승인 작업의 원래 idempotency deadline이 지난 경우에만 열리며,
        저장된 환경·금액·order·payee·생성시각과 정확히 일치해야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerAuthorizationId, evidenceSource, evidenceHash, observedAt]
              properties:
                providerAuthorizationId: { type: string, minLength: 1, maxLength: 255 }
                evidenceSource: { type: string, enum: [PAYPAL_DASHBOARD, PAYPAL_SUPPORT, OTHER] }
                evidenceHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
                internalNote: { type: string, maxLength: 4000 }
                observedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 기존 authorization의 terminal 또는 성공 결과를 검증·기록함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalReauthorizationAdoptionResponse" }
        "202":
          description: 기존 authorization을 검증했으나 provider 상태가 여전히 미확정임
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalReauthorizationAdoptionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/payment/paypal/mo-compensations/{compensationId}/refund-adoptions:
    parameters:
      - name: compensationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: adoptPayPalMORefund
      summary: 만료된 원 요청이 만든 기존 PayPal refund를 fresh GET으로만 검증·채택한다
      description: >-
        새 PayPal refund POST를 보내지 않는다. resource ID가 없는 최신 SENT/UNKNOWN
        PAYPAL_MO_REFUND 작업의 원래 idempotency deadline이 지난 경우에만 열리며,
        저장된 환경·정확한 MO 총액·parent Capture·원 operation invoice와 일치해야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerRefundId, publicRationale, evidenceSource, evidenceHash, observedAt]
              properties:
                providerRefundId: { type: string, minLength: 1, maxLength: 255 }
                publicRationale: { type: string, minLength: 1, maxLength: 2000 }
                evidenceSource: { type: string, enum: [PAYPAL_DASHBOARD, PAYPAL_API, PAYPAL_WEBHOOK, OTHER] }
                evidenceHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
                observedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 기존 refund의 성공 또는 terminal 실패 결과를 검증·기록함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalMORefundAdoptionResponse" }
        "202":
          description: 기존 refund가 PENDING이며 채택 evidence와 미확정 상태를 기록함
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPalMORefundAdoptionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/procurement/queue:
    get:
      operationId: listProcurementQueue
      summary: 수납 확정 주문의 Shop-checkout 단위 Procurement Task 큐를 조회한다
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: 배송 원문을 포함하지 않는 Procurement Task 큐
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, items]
                properties:
                  schemaVersion: { type: string, const: vitlane.procurement-queue.v1 }
                  items:
                    type: array
