  /curations/product-notices/sync: {"post": {"operationId": "syncCurationProductNotices", "summary": "현재 큐레이션 진입·가시성 갱신 및 새 상품 표시 조회 (60초)", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["schemaVersion", "clientId", "curationId", "visible"], "properties": {"schemaVersion": {"const": "vitlane.curation-notice-sync.v1"}, "clientId": {"type": "string", "format": "uuid"}, "curationId": {"type": "string", "description": "가시 큐레이션 UUID 또는 빈 문자열"}, "visible": {"type": "boolean"}}}}}}, "responses": {"200": {"description": "기록된 결과", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["schemaVersion", "curationIds"], "properties": {"schemaVersion": {"const": "vitlane.curation-notices.v1"}, "curationIds": {"type": "array", "items": {"type": "string", "format": "uuid"}}}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}}}}
  /curations/{curationId}/catalog-research/candidates/{candidateId}/browser-runs:
    parameters:
      - $ref: '#/components/parameters/CurationId'
      - $ref: '#/components/parameters/BrowserCandidateId'
    post:
      operationId: createBrowserRun
      summary: 저장된 후보의 서버 확정 URL로 owner-bound 기기 브라우저 작업을 만든다
      description: client URL은 받지 않는다. 본문에 URL이나 알 수 없는 필드가 있으면 거절한다.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201': { $ref: '#/components/responses/BrowserRun' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /browser-runs/{runId}:
    parameters: [{ $ref: '#/components/parameters/BrowserRunId' }]
    get:
      operationId: getBrowserRun
      responses:
        '200': { $ref: '#/components/responses/BrowserRun' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /browser-runs/{runId}/navigation-approvals:
    parameters: [{ $ref: '#/components/parameters/BrowserRunId' }]
    post:
      operationId: approveBrowserRunNavigation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunCommandV1' } } } }
      responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /browser-runs/{runId}/preparation-approvals:
    parameters: [{ $ref: '#/components/parameters/BrowserRunId' }]
    post:
      operationId: approveBrowserRunPreparation
      description: 최종 결제, password, OTP와 payment detail은 허용 step이 될 수 없다.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunPreparationApprovalV1' } } } }
      responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /browser-runs/{runId}/observations:
    parameters: [{ $ref: '#/components/parameters/BrowserRunId' }]
    post:
      operationId: recordBrowserRunObservation
      description: 민감정보가 제거된 기기 관찰 envelope만 받는다. sessionStateHint는 인증 증거가 아니다.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunObservationCommandV1' } } } }
      responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /browser-runs/{runId}/handoffs:
    parameters: [{ $ref: '#/components/parameters/BrowserRunId' }]
    post:
      operationId: requireBrowserRunHandoff
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunHandoffCommandV1' } } } }
      responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /browser-runs/{runId}/takeover: { parameters: [{ $ref: '#/components/parameters/BrowserRunId' }], post: { operationId: takeOverBrowserRun, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunCommandV1' } } } }, responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } } }
  /browser-runs/{runId}/pause: { parameters: [{ $ref: '#/components/parameters/BrowserRunId' }], post: { operationId: pauseBrowserRun, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunCommandV1' } } } }, responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } } }
  /browser-runs/{runId}/resume-requests: { parameters: [{ $ref: '#/components/parameters/BrowserRunId' }], post: { operationId: requestBrowserRunResume, description: agent 제어를 바로 복구하지 않고 이후의 fresh sanitized observation을 요구한다., parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunCommandV1' } } } }, responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } } }
  /browser-runs/{runId}/cancellation: { parameters: [{ $ref: '#/components/parameters/BrowserRunId' }], post: { operationId: cancelBrowserRun, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunCommandV1' } } } }, responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } } }
  /browser-runs/{runId}/result-verifications:
    parameters: [{ $ref: '#/components/parameters/BrowserRunId' }]
    post:
      operationId: verifyBrowserRunResult
      description: 판매처에서 관찰한 결과와 사용자 자기보고를 서로 다른 evidenceSource로 보존한다.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserRunResultVerificationCommandV1' } } } }
      responses: { '200': { $ref: '#/components/responses/BrowserRun' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vitlane_session
      description: >-
        브라우저용 HttpOnly AuthSession cookie. bearerAuth와 동시에 보내면 모호한 자격으로
        거절된다.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque AuthSession
      description: >-
        모바일 handoff exchange 또는 local·test 개발 세션에서 발급한 Vitlane opaque
        AuthSession token. Google/provider access token이나 MCP capability token이 아니며
        cookieAuth와 동시에 보내지 않는다.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    CurationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: CurationRun 생성 재시도를 같은 요청으로 수렴시키는 UUID
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CurationId:
      name: curationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CurationActionId:
      name: actionId
      in: path
      required: true
      description: owner command/idempotency/OriginRequest와 공유하는 user action UUID
      schema: { type: string, format: uuid }
    SelectionId:
      name: selectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OriginRequestId:
      name: originRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RootOriginRequestId:
      name: rootOriginRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthAttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderSheetId:
      name: orderSheetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgencyOrderId:
      name: agencyOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportAttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProcurementTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecoveryEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LogisticsShipmentId:
      name: shipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BrowserCandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    BrowserRunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BrowserRun:
      description: 현재 owner-bound browser run 상태, Cache-Control no-store
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BrowserRunResponseV1' }
    OrderProcessReceipt:
      description: 영속 요청의 현재 판단이다. 접수·대기는 구매·환불 완료를 뜻하지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrderProcessReceipt"
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SupportImageDownload:
      description: 복호화된 JPEG/PNG 이미지. 응답은 private, no-store이며 원본 파일명은 노출하지 않는다.
      headers:
        Cache-Control:
          schema: { type: string, const: "private, no-store" }
        Content-Disposition:
          schema: { type: string }
        X-Content-Type-Options:
          schema: { type: string, const: nosniff }
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
    RateLimited:
      description: Account 인증 시도 제한에 도달함
      headers:
        Retry-After:
          description: 동일 인증 요청을 다시 허용할 때까지 남은 초
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: RATE_LIMITED
              message: 인증 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.
    SettlementQuoteStale:
      description: Quote snapshot과 현재 활성 결제 설정이 달라 재견적·재승인이 필요함
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: SETTLEMENT_QUOTE_STALE
              message: 결제 설정이 변경되었습니다. 최신 결제 조건을 다시 확인해 주세요.
    ProcurementTaskMutation:
      description: 멱등 처리된 Procurement Task 상태
      content:
        application/json:
          schema:
            type: object
            required: [item, replay]
            properties:
              item: { $ref: "#/components/schemas/ProcurementQueueItem" }
              replay: { type: boolean }
    ProcurementCustomerRequestMutation:
      description: 멱등 처리된 Procurement 고객 요청 상태
      content:
        application/json:
          schema:
            type: object
            required: [customerRequest, replay]
            properties:
              customerRequest: { $ref: "#/components/schemas/ProcurementCustomerRequest" }
              replay: { type: boolean }
    RecoveryEntryMutation:
      description: 멱등 처리된 회수 원장 entry
      content:
        application/json:
          schema:
            type: object
            required: [entry, replay]
            properties:
              entry: { $ref: "#/components/schemas/RecoveryEntry" }
              replay: { type: boolean }
  schemas:
    BrowserRunResponseV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, run]
      properties:
        schemaVersion: { type: string, const: vitlane.browser-run.v1 }
        run: { $ref: '#/components/schemas/BrowserRunV1' }
    BrowserRunCommandV1:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    BrowserRunPreparationApprovalV1:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, planRevision, quoteDigest, allowedPreparationSteps, priceCeilingMinor, priceCurrency]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200, description: Idempotency-Key header와 정확히 같아야 한다. }
        planRevision: { type: integer, minimum: 1 }
        quoteDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        allowedPreparationSteps:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: string, enum: [SELECT_VARIANT, SET_QUANTITY, ADD_TO_CART, OPEN_CHECKOUT_REVIEW] }
        priceCeilingMinor: { type: integer, minimum: 1 }
        priceCurrency: { type: string, pattern: '^[A-Z]{3}$' }
    BrowserRunObservationCommandV1:
      type: object
      additionalProperties: false
      required: [expectedVersion, observationRevision, kind, origin, pageIdentityDigest, sanitized, containsSensitiveData]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        observationRevision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [PUBLIC_PRODUCT, SIGN_IN_REQUIRED, CHECKOUT_REVIEW, RESULT] }
        origin: { type: string, format: uri, pattern: '^https://' }
        pageIdentityDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        sessionStateHint:
          type: string
          enum: [authenticated, anonymous, unknown]
          description: page에서 유도한 untrusted privacy-safe hint이며 로그인 증거나 승인 근거가 아니다.
        sanitized: { type: boolean, const: true }
        containsSensitiveData: { type: boolean, const: false }
    BrowserRunHandoffCommandV1:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, enum: [SIGN_IN_REQUIRED, VERIFICATION_REQUIRED, UNSUPPORTED_INTERACTION, FINAL_PAYMENT_REQUIRED] }
    BrowserRunResultVerificationCommandV1:
      type: object
      additionalProperties: false
      required: [expectedVersion, outcome, evidenceSource]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [SUCCEEDED, PARTIAL, FAILED, UNKNOWN] }
        evidenceSource: { type: string, enum: [MERCHANT_OBSERVED, USER_REPORTED] }
        evidenceDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        observationRevision: { type: integer, minimum: 1 }
      description: MERCHANT_OBSERVED는 현재 RESULT observation revision과 digest가 필요하고 USER_REPORTED에는 둘 다 허용하지 않는다.
    BrowserRunObservationV1:
      type: object
      additionalProperties: false
      required: [revision, kind, origin, pageIdentityDigest, observedAt]
      properties:
        revision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [PUBLIC_PRODUCT, SIGN_IN_REQUIRED, CHECKOUT_REVIEW, RESULT] }
        origin: { type: string, format: uri }
        pageIdentityDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        sessionStateHint: { type: string, enum: [authenticated, anonymous, unknown] }
        observedAt: { type: string, format: date-time }
    BrowserRunPreparationV1:
      type: object
      additionalProperties: false
      required: [planRevision, quoteDigest, allowedPreparationSteps, priceCeilingMinor, priceCurrency, approvedAt]
      properties:
        planRevision: { type: integer, minimum: 1 }
        quoteDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        allowedPreparationSteps: { type: array, items: { type: string, enum: [SELECT_VARIANT, SET_QUANTITY, ADD_TO_CART, OPEN_CHECKOUT_REVIEW] } }
        priceCeilingMinor: { type: integer, minimum: 1 }
        priceCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        approvedAt: { type: string, format: date-time }
    BrowserRunResultV1:
      type: object
      additionalProperties: false
      required: [outcome, evidenceSource, verifiedAt]
      properties:
        outcome: { type: string, enum: [SUCCEEDED, PARTIAL, FAILED, UNKNOWN] }
        evidenceSource: { type: string, enum: [MERCHANT_OBSERVED, USER_REPORTED] }
        evidenceDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        observationRevision: { type: integer, minimum: 1 }
        verifiedAt: { type: string, format: date-time }
    BrowserRunV1:
      type: object
      additionalProperties: false
      required: [id, curationId, candidateId, productUrl, merchantOrigin, merchantHost, state, controlOwner, version, freshObservationRequired, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        candidateId: { type: string, minLength: 1, maxLength: 512 }
        productUrl: { type: string, format: uri, pattern: '^https://' }
        merchantOrigin: { type: string, format: uri, pattern: '^https://' }
        merchantHost: { type: string }
        state: { type: string, enum: [AWAITING_NAVIGATION_APPROVAL, NAVIGATION_APPROVED, AWAITING_PREPARATION_APPROVAL, PREPARATION_APPROVED, USER_CONTROL, RESUME_REQUIRES_OBSERVATION, PAUSED, READY_FOR_USER_PAYMENT, COMPLETED, PARTIAL, FAILED, RESULT_UNKNOWN, CANCELLED] }
        controlOwner: { type: string, enum: [NONE, AGENT, USER] }
        version: { type: integer, minimum: 1 }
        navigationApprovedAt: { type: string, format: date-time }
        preparationApproval: { $ref: '#/components/schemas/BrowserRunPreparationV1' }
        latestObservation: { $ref: '#/components/schemas/BrowserRunObservationV1' }
        handoffReason: { type: string, enum: [SIGN_IN_REQUIRED, VERIFICATION_REQUIRED, UNSUPPORTED_INTERACTION, USER_REQUESTED, FINAL_PAYMENT_REQUIRED] }
        resumeAfterObservationRevision: { type: integer, minimum: 1 }
        freshObservationRequired: { type: boolean }
        resultVerification: { $ref: '#/components/schemas/BrowserRunResultV1' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        terminalAt: { type: string, format: date-time }
    CurationConversationRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, mode, request, expectedCurationVersion, clientRequestId]
      properties:
        schemaVersion: { const: vitlane.curation-conversation-request.v1 }
        mode: { type: string, enum: [ADD_TARGET, RESEARCH_AGAIN, RETRY] }
        request: { type: string, maxLength: 2000 }
        targetId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        expectedCurationVersion: { type: integer, minimum: 1 }
        expectedConversationVersion: { type: integer, minimum: 0 }
        clientRequestId: { type: string, format: uuid }
    CurationConversationRequestResult:
      type: object
      required: [status, decision, source, reasonCode, replay]
      properties:
        status: { type: string, enum: [EXECUTED, NEEDS_SELECTION, NO_ACTION] }
