    ProcurementQueueItem:
      type: object
      required: [task, merchantOrder, units, agencyOrder, processState, logisticsSummary, delivery]
      properties:
        task: { $ref: "#/components/schemas/ProcurementTask" }
        merchantOrder: { $ref: "#/components/schemas/ProcurementMerchantOrder" }
        units:
          type: array
          items: { $ref: "#/components/schemas/MerchantOrderUnitSummary" }
