        enabled: { type: boolean }
        currency: { type: string, enum: [KRW, USD] }
        totalAmount: { type: [string, 'null'], description: 활성 Target 배분 합계. 여유/미배분은 없다. }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/TargetBudgetV1' }
