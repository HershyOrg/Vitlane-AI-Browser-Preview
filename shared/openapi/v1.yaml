        outputTokens: { type: integer, format: int64, minimum: 0 }
        totalTokens: { type: integer, format: int64, minimum: 0 }
        requestCount: { type: integer, format: int64, minimum: 0 }
        reservedMicros: { type: integer, format: int64, minimum: 0 }
        settledMicros: { type: integer, format: int64, minimum: 0 }
        spentMicros: { type: integer, format: int64, minimum: 0 }
        usagePercent: { type: number, format: double, minimum: 0 }
    ManagedRunnerServerUsage:
