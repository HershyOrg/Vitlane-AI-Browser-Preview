      type: string
      enum:
        [INTENT_NEXT_STEP, PLANNING_ADD_TARGETS,
         PLANNING_START_CURATING, CURATION_ADD_TARGETS,
         TARGET_RESEARCH_AGAIN, TARGET_REMOVE, SELECTION_MUTATION]
    CurationActionSubjectSchema:
      type: object
      additionalProperties: false
      required: [type, idRequired]
      properties:
        type:
          type: string
          enum: [INTENT, TARGET_LIST, CURATION, TARGET, SELECTION]
        idRequired: { type: boolean }
    CurationActionDescriptor:
      type: object
      additionalProperties: false
      required:
        [id, alias, enabled, subjectSchema, bodySchema, effectKind,
         transcriptPolicy, expectedResourceVersion, requiresConfirmation]
      properties:
        id:
          $ref: "#/components/schemas/CurationActionType"
        alias:
          type: string
          pattern: "^@[A-Za-z]+-[A-Za-z]+$"
          description: |
            catalog template. subjectSchema.idRequired=true이면 Web은 실행 전에
            @Subject:<subjectId>-Action 형태로 current artifact ID를 결합한다.
          enum:
            ["@Intent-NextStep", "@TargetList-AddTarget",
             "@Planning-NextStep", "@Curation-AddTarget",
             "@Target-ResearchAgain", "@Target-Remove",
             "@Selection-Mutation"]
        enabled: { type: boolean }
        unavailableReason: { type: string }
        subjectSchema: { $ref: "#/components/schemas/CurationActionSubjectSchema" }
        bodySchema:
          type: string
          enum: [NONE, TEXT_REQUIRED, TEXT_OPTIONAL, TYPED_COMMAND]
          description: |
            TEXT_REQUIRED와 TYPED_COMMAND는 chat command body가 필수다. TEXT_OPTIONAL은 빈 재조사를 허용한다.
        effectKind:
          type: string
          enum: [NONE, INTELLIGENCE]
        transcriptPolicy:
          type: string
          enum: [APPEND, PATCH_ONLY]
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        requiresConfirmation: { type: boolean }
        requestedTransitionTo:
          type: string
          enum: [PLANNING, CURATING]
    CurationAction:
      type: object
      additionalProperties: false
      required:
        [id, curationId, actorUserId, type, phaseAtRequest, subjectType,
         effectKind, sourceRefType, sourceRefId, expectedCurationVersion,
         createdAt]
      properties:
        id: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        type:
          type: string
          enum: [AUTO_START, BUDGET_CHANGE, CRITERIA_CHANGE, START_RESEARCH, INTENT_NEXT_STEP, PLANNING_ADD_TARGETS, PLANNING_START_CURATING, CURATION_ADD_TARGETS, TARGET_RESEARCH_AGAIN, TARGET_REMOVE, SELECTION_MUTATION, RESPONSE]
        phaseAtRequest:
          type: string
          enum: [HAVING_INTENT, PLANNING, CURATING]
        requestedTransitionTo:
          type: string
          enum: [PLANNING, CURATING]
        subjectType:
          type: string
          enum: [INTENT, TARGET_LIST, CURATION, TARGET, SELECTION]
        subjectId: { type: string }
        effectKind:
          type: string
          enum: [NONE, INTELLIGENCE]
        sourceRefType:
          type: string
          enum:
            [SHOPPING_PLAN, CURATION_RUN_REQUEST, RESEARCH_START_REQUEST,
             RESEARCH_AGAIN_REQUEST, PLAN_TARGET,
             CURATION_SELECTION_COMMAND, CURATION_THREAD]
        sourceRefId: { type: string }
        expectedCurationVersion:
          type: integer
          format: int64
          minimum: 1
        createdAt: { type: string, format: date-time }
        targetId:
          type: string
        targetLabel:
          type: string
        instruction:
          type: string
        budget:
          $ref: '#/components/schemas/CurationBudgetCommandV1'
        criteria:
          $ref: '#/components/schemas/TargetCriteriaSetV1'
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - WAITING_SELECTION
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - SKIPPED
        jobs:
          decisions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CurationActionDecisionV1'
        response:
          $ref: '#/components/schemas/CurationThreadResponseV1'
        questions:
          type: array
          description: 답변 후에도 보존하는 질문과 검증된 선택지 이력
          items:
            $ref: '#/components/schemas/CurationActionQuestionV1'
        question:
          $ref: '#/components/schemas/CurationActionQuestionV1'
        answers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CurationThreadAnswerV1'
        interpretationStartedAt:
          type: string
          format: date-time
        threadId:
          type: string
        generatedByActionId:
          type: string
        retryOfActionId:
          type: string
        sequence:
          type: integer
          minimum: 0
        inputRevision:
          type: integer
          minimum: 0
        decisionIds:
          type: array
          items:
            type: string
    CurationTimelineAction:
      type: object
      additionalProperties: false
      description: |
        사용자 transcript용 redacted action이다. actor identity, source
        reference, request hash와 owner payload는 포함하지 않는다.
      required:
        [id, curationId, type, phaseAtRequest, subjectType, effectKind,
         expectedCurationVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        type:
          $ref: "#/components/schemas/CurationActionType"
        phaseAtRequest:
          type: string
          enum: [HAVING_INTENT, PLANNING, CURATING]
        requestedTransitionTo:
          type: string
          enum: [PLANNING, CURATING]
        subjectType:
          type: string
          enum: [INTENT, TARGET_LIST, CURATION, TARGET, SELECTION]
        subjectId: { type: string }
        effectKind:
          type: string
          enum: [NONE, INTELLIGENCE]
        expectedCurationVersion:
          type: integer
          format: int64
          minimum: 1
        createdAt: { type: string, format: date-time }
    CurationTimelineDiff:
      type: object
      additionalProperties: false
      properties:
        added:
          type: array
          items: { type: string }
        changed:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
    CurationTimelineResult:
      type: object
      additionalProperties: false
      required: [kind, summary, occurredAt]
      properties:
        kind:
          type: string
          enum:
            [INTENT_ACCEPTED, TARGET_EXPANSION, RESEARCH_STARTED,
             TARGET_RESEARCHED]
        summary:
          type: string
          description: owner 결과에서 만든 compact user-safe summary
        occurredAt: { type: string, format: date-time }
        diff: { $ref: "#/components/schemas/CurationTimelineDiff" }
    CurationTimelineItem:
      type: object
      additionalProperties: false
      required: [action]
      description: |
        transcriptPolicy=APPEND인 행동만 포함한다. Target 제거와 Selection 수정
        같은 PATCH_ONLY 행동은 현재 artifact만 갱신하고 채팅 타임라인에는
        투영하지 않는다.
      properties:
        action: { $ref: "#/components/schemas/CurationTimelineAction" }
        displayBody:
          type: string
          description: |
            ShoppingPlan originalIntent, CurationRun instruction 또는
            ResearchFeedback feedback 중 해당 action의 user-authored text
        result: { $ref: "#/components/schemas/CurationTimelineResult" }
    AvailableCurationActions:
      type: object
      additionalProperties: false
      required: [curationId, phase, version, availableActions]
      properties:
        curationId: { type: string, format: uuid }
        phase: { type: string, enum: [PLANNING, CURATING] }
        version: { type: integer, format: int64, minimum: 1 }
        availableActions:
          type: array
          items: { $ref: "#/components/schemas/CurationActionDescriptor" }
    TargetRemoveActionRequest:
      type: object
      additionalProperties: false
      required: [targetId, expectedCurationVersion]
      properties:
        targetId: { type: string, format: uuid }
        expectedCurationVersion:
          { type: integer, format: int64, minimum: 1 }
    TargetRemoveActionResult:
      type: object
      additionalProperties: false
      required: [action, targetId, curationVersion, removedAt, replay]
      properties:
        action: { $ref: "#/components/schemas/CurationAction" }
        targetId: { type: string, format: uuid }
        curationVersion: { type: integer, format: int64, minimum: 2 }
        removedAt: { type: string, format: date-time }
        replay: { type: boolean }
    PlanTarget:
      type: object
      required:
        [id, curationId, userId, planId, title, normalizedIntent,
         allocatedBudget, researchScope, orderIndex, targetHashSchema, version,
         createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        createdByCurationRunId:
          type: string
          format: uuid
          description: 이 Target을 추가한 INITIAL 또는 EXPANSION CurationRun
        title: { type: string }
        normalizedIntent: { type: string }
        category: { type: string }
        productVertical:
          type: string
          enum: [GENERAL, FASHION, BEAUTY, FOOD, LIVING, ELECTRONICS]
          description: Mall 경로 선택용 대표 상품군 하나. 기존 미분류 Target에서는 생략한다.
        allocatedBudget: { $ref: "#/components/schemas/Money" }
        researchScope: { $ref: "#/components/schemas/ResearchScope" }
        orderIndex: { type: integer, minimum: 0 }
        confirmedAt: { type: string, format: date-time }
        targetHash: { type: string }
        targetHashSchema: { type: string, const: vitlane.plan-target.v1 }
        version: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        removedAt:
          type: string
          format: date-time
          description: soft removal 시각. 기본 Plan 조회는 제거된 Target을 반환하지 않는다.
        removedByUserId:
          type: string
          format: uuid
          description: direct removal을 실행한 사용자
    PlanningTask:
      type: object
      required:
        [id, planId, userId, contextVersion, contextHash, status, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        contextVersion: { type: integer, format: int64 }
        contextHash: { type: string }
        status: { type: string, enum: [REQUESTED, COMPLETED, CANCELLED] }
        expiresAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        firstDiscoveredAt: { type: string, format: date-time }
        firstContextReadAt: { type: string, format: date-time }
        lastAgentActivityAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CurationRun:
      type: object
      required:
        [id, curationId, planId, userId, kind, instruction, planningTaskId,
         status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        kind:
          type: string
          enum: [INITIAL, EXPANSION]
        instruction:
          type: string
          minLength: 1
          description: INITIAL은 원본 Intent, EXPANSION은 Curation 하단 추가 요청
        planningTaskId: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, MATERIALIZING, COMPLETED, FAILED, CANCELLED]
          description: |
            Planning owner의 Target materialization lifecycle만 나타낸다.
            ResearchRound나 Intelligence execution 상태를 복제하지 않는다.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: lifecycle이 바뀔 때 갱신되는 polling revision 시각
        completedAt: { type: string, format: date-time }
    ExecuteExpansionActionRequest:
      type: object
      additionalProperties: false
      required:
        [curationId, curationActionId, type, instruction,
         expectedCurationVersion]
      properties:
        curationId: { type: string, format: uuid }
        curationActionId:
          type: string
          format: uuid
          description: Idempotency-Key와 같은 user action ID
        type:
          type: string
          enum: [PLANNING_ADD_TARGETS, CURATION_ADD_TARGETS]
        instruction:
          type: string
          minLength: 1
          description: 추가로 조사할 상품이나 항목
        expectedCurationVersion:
          { type: integer, format: int64, minimum: 1 }
    CreateCurationExpansionResult:
      type: object
      required: [run, planningTask, replay]
      properties:
        run: { $ref: "#/components/schemas/CurationRun" }
        planningTask: { $ref: "#/components/schemas/PlanningTask" }
        intelligenceJob: { $ref: "#/components/schemas/IntelligenceJobRef" }
        replay:
          type: boolean
          description: |
            POST에서는 같은 Idempotency-Key와 요청으로 만든 기존 결과인지 여부다.
            current 복구 조회는 이미 저장된 Run을 반환하므로 항상 true다.
    PlanResult:
      type: object
      required:
        [plan, curation, targets, sessions, availableActions, journey]
      properties:
        plan: { $ref: "#/components/schemas/ShoppingPlan" }
        curation: { $ref: "#/components/schemas/Curation" }
        targets:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/PlanTarget" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ShoppingSession" }
        planningTask: { $ref: "#/components/schemas/PlanningTask" }
        intelligenceJob: { $ref: "#/components/schemas/IntelligenceJobRef" }
        availableActions:
          type: array
          items: { $ref: "#/components/schemas/CurationActionDescriptor" }
        journey: { $ref: "#/components/schemas/PlanJourney" }
    JourneyStep:
      type: object
      required: [key, label, state, readOnly]
      properties:
        key: { type: string, enum: [INTENT, CURATION] }
        label: { type: string }
        state: { type: string, enum: [COMPLETED, CURRENT, LOCKED] }
        path:
          type: string
          description: 현재 또는 과거 Step에만 존재하는 Vitlane Web 경로
        readOnly: { type: boolean }
    SessionStatusCounts:
      type: object
      required: [ready, researching, reviewing]
      properties:
        ready: { type: integer, minimum: 0, maximum: 10 }
        researching: { type: integer, minimum: 0, maximum: 10 }
        reviewing: { type: integer, minimum: 0, maximum: 10 }
    PlanJourney:
      type: object
      required: [currentStep, currentStage, resumePath, nextAction, steps, sessionCount]
      properties:
        currentStep: { type: string, enum: [INTENT, CURATION] }
        currentStage:
          type: string
          enum: [PLANNING, READY, RESEARCHING, REVIEWING, CURATING]
        resumePath: { type: string }
        nextAction: { type: string }
        steps:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/JourneyStep" }
        sessionCount: { $ref: "#/components/schemas/SessionStatusCounts" }
    CurationListItem:
      type: object
      additionalProperties: false
      required: [curationId, intentSummary, createdAt]
      properties:
        curationId: { type: string, format: uuid }
        intentSummary: { type: string, description: 사이드바 제목. Plan의 originalIntent. }
        createdAt: { type: string, format: date-time }
    StartCuratingActionRequest:
      type: object
      additionalProperties: false
      required:
        [curationId, curationActionId, expectedCurationVersion, sessionIds]
      properties:
        curationId: { type: string, format: uuid }
        curationActionId:
          type: string
          format: uuid
          description: Idempotency-Key와 같은 PLANNING_START_CURATING action ID
        expectedCurationVersion:
          { type: integer, format: int64, minimum: 1 }
        sessionIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
      description: 기본 행동에는 connectionId나 assigneeMode가 존재하지 않는다.
    ResearchTask:
      type: object
      required:
        [roundId, sessionId, targetTitle, roundNumber, contextSchema, contextVersion, contextHash, status, feedbackRequired]
      properties:
        roundId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        targetTitle: { type: string }
        roundNumber: { type: integer, minimum: 1 }
        contextSchema: { type: string, enum: [vitlane.research-context.v1, vitlane.research-context.v3] }
        contextVersion: { type: integer, format: int64, minimum: 1 }
        contextHash: { type: string }
        status: { type: string, enum: [REQUESTED, RESULTS_READY, NO_RESULTS, CANCELLED, SUPERSEDED] }
        feedbackRequired: { type: boolean }
    ShoppingSession:
      type: object
      required:
        [id, planTargetId, userId, targetSnapshot, researchScopeSnapshot, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        planTargetId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        targetSnapshot: { type: object, additionalProperties: true }
        researchScopeSnapshot: { type: object, additionalProperties: true }
        status: { type: string, enum: [READY, RESEARCHING, REVIEWING] }
        currentResearchRoundId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ResearchRound:
      type: object
      required:
        [id, shoppingSessionId, userId, roundNumber, contextSchema, contextVersion, contextHash, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        shoppingSessionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        roundNumber: { type: integer, minimum: 1 }
        contextSchema: { type: string, enum: [vitlane.research-context.v1, vitlane.research-context.v3] }
        contextVersion: { type: integer, format: int64, minimum: 1 }
        contextHash: { type: string }
        status:
          type: string
          enum: [REQUESTED, RESULTS_READY, NO_RESULTS, FAILED, CANCELLED, SUPERSEDED]
        failureReasonCode:
          type: string
          description: FAILED Round에 대응하는 IntelligenceJob의 typed safe reason.
        failureRetryable:
          type: boolean
          description: FAILED Round가 사용자 재시도를 허용하는지 나타낸다.
        firstDiscoveredAt: { type: string, format: date-time }
        firstContextReadAt: { type: string, format: date-time }
        lastAgentActivityAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    CatalogLikedVariant:
      type: object
      additionalProperties: false
      required:
        [curationId, candidateId, variantId, productTitle, variantTitle,
         merchant, priceMinor, currency, targetTitle, updatedAt]
      properties:
        curationId: { type: string, format: uuid }
        candidateId: { type: string, minLength: 1, maxLength: 512 }
        variantId: { type: string, minLength: 1, maxLength: 512 }
        productTitle: { type: string, minLength: 1, maxLength: 240 }
        variantTitle: { type: string, minLength: 1, maxLength: 240 }
        productUrl: { type: string, format: uri }
        merchant: { type: string, minLength: 1, maxLength: 240 }
        priceMinor: { type: integer, format: int64, minimum: 0 }
        priceUnknown: { type: boolean, default: false, description: "true이면 priceMinor는 가격 관찰값이 아니며 표시하지 않는다." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        targetTitle: { type: string, minLength: 1, maxLength: 240 }
        updatedAt: { type: string, format: date-time }
    CatalogLikedVariantSnapshot:
      type: object
      additionalProperties: false
      required:
        [productTitle, variantTitle, merchant, priceMinor, currency, targetTitle]
      properties:
        productTitle: { type: string, minLength: 1, maxLength: 240 }
        variantTitle: { type: string, minLength: 1, maxLength: 240 }
        productUrl: { type: string, format: uri }
        merchant: { type: string, minLength: 1, maxLength: 240 }
        priceMinor: { type: integer, format: int64, minimum: 0 }
        priceUnknown: { type: boolean, default: false, description: "true이면 priceMinor는 가격 관찰값이 아니며 표시하지 않는다." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        targetTitle: { type: string, minLength: 1, maxLength: 240 }
    SourceProductRefV3:
      oneOf:
        - { $ref: "#/components/schemas/KoreanProductRefV1" }
        - type: object
          additionalProperties: false
          required: [source, productId]
          properties:
            source: { type: string, const: SHOPIFY }
            productId: { type: string, minLength: 1 }
        - type: object
          additionalProperties: false
          required: [source, marketplace, anchorAsin]
          properties:
            source: { type: string, const: AMAZON }
            marketplace: { type: string, const: US }
            anchorAsin: { type: string, pattern: '^[A-Z0-9]{10}$' }
    AmazonVariantRefV3:
      type: object
      additionalProperties: false
      required: [source, marketplace, asin]
      properties:
        source: { type: string, const: AMAZON }
        marketplace: { type: string, const: US }
        asin: { type: string, pattern: '^[A-Z0-9]{10}$' }
    VariantObservationV3:
      type: object
      required: [observationId, variantRef, price, availability, seller, deliveryEligibility, purchaseRoute, productUrl, observedAt, refreshAfter]
      properties:
        observationId: { type: string }
        variantRef: { $ref: "#/components/schemas/AmazonVariantRefV3" }
        price:
          oneOf:
            - type: object
              required: [kind, amountMinor, currency]
              properties:
                kind: { type: string, const: OBSERVED }
                amountMinor: { type: integer, minimum: 0, maximum: 9007199254740991 }
                currency: { type: string, const: USD }
            - type: object
              required: [kind, reasonCode]
              properties:
                kind: { type: string, const: UNKNOWN }
                reasonCode: { type: string }
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE, UNKNOWN] }
        seller: { type: object, properties: { kind: { type: string, enum: [KNOWN, UNKNOWN] } } }
        deliveryEligibility: { type: string, const: UNCONFIRMED }
        purchaseRoute: { type: string, const: EXTERNAL }
        productUrl: { type: string, pattern: '^https://www\.amazon\.com/dp/[A-Z0-9]{10}$' }
        observedAt: { type: string, format: date-time }
        refreshAfter: { type: string, format: date-time }
    ExternalPurchaseFeedbackV3:
      type: object
      required: [schemaVersion, version, records]
      properties:
        schemaVersion: { type: string, enum: [vitlane.external-purchase-feedback.v3, vitlane.external-purchase-feedback.v4] }
        version: { type: integer, minimum: 0 }
        records:
          type: array
          items:
            type: object
            required: [candidateId, checked, version, recordedAt, evidence]
            oneOf:
              - required: [variantRef]
                not: { required: [productRef] }
              - required: [productRef]
                not: { required: [variantRef] }
            properties:
              candidateId: { type: string }
              productRef: { $ref: "#/components/schemas/KoreanProductRefV1" }
              variantRef: { $ref: "#/components/schemas/AmazonVariantRefV3" }
              checked: { type: boolean }
              version: { type: integer, minimum: 1 }
              recordedAt: { type: string, format: date-time }
              evidence: { type: string, const: SELF_REPORTED }
    PurchaseCheckSnapshotV1:
      type: object
      additionalProperties: false
      required: [productTitle, priceMinor, priceUnknown]
      properties:
        productTitle: { type: string, minLength: 1, maxLength: 2000 }
        variantTitle: { type: string, maxLength: 240 }
        merchant: { type: string, maxLength: 240 }
        priceMinor: { type: integer, minimum: 0, description: priceUnknown이면 의미 없는 값(0) }
        priceUnknown: { type: boolean }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: 가격이 확인된 경우 필수 }
    PurchaseCheckV1:
      type: object
      required: [curationId, candidateId, productUrl, checked, version, recordedAt, evidence, snapshot]
      oneOf:
        - required: [variantRef]
          not: { required: [productRef] }
        - required: [productRef]
          not: { required: [variantRef] }
      properties:
        curationId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetTitle: { type: string, description: 현재 Target 제목. 후보 행이 없으면 생략 }
        candidateId: { type: string }
        productRef: { $ref: "#/components/schemas/KoreanProductRefV1" }
        variantRef: { $ref: "#/components/schemas/AmazonVariantRefV3" }
        productUrl: { type: string, format: uri, description: 참조에서 도출한 원본 상품 페이지 }
        checked: { type: boolean, const: true }
        version: { type: integer, minimum: 1 }
        recordedAt: { type: string, format: date-time }
        evidence: { type: string, const: SELF_REPORTED }
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/PurchaseCheckSnapshotV1"
            - type: "null"
        snapshotAt: { type: string, format: date-time }
    PurchaseCheckListV1:
      type: object
      required: [schemaVersion, records]
      properties:
        schemaVersion: { type: string, const: vitlane.account-purchase-checks.v1 }
        records:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PurchaseCheckV1" }
    AmazonCandidateStateV3:
      type: object
      required: [schemaVersion, variantRef, configurationVersion, purchaseFeedback]
      properties:
        schemaVersion: { type: string, const: vitlane.amazon-candidate-state.v3 }
        variantRef: { $ref: "#/components/schemas/AmazonVariantRefV3" }
        configurationVersion: { type: integer, minimum: 0 }
        purchaseFeedback: { $ref: "#/components/schemas/ExternalPurchaseFeedbackV3" }
    ExternalLinkV3:
      type: object
      required: [schemaVersion, source, url]
      properties:
        schemaVersion: { type: string, const: vitlane.external-link.v3 }
        source: { type: string, const: AMAZON }
        url: { type: string, pattern: '^https://www\.amazon\.com/dp/[A-Z0-9]{10}$' }
    AmazonVariantResolutionV3:
      type: object
      required: [schemaVersion, product]
      properties:
        schemaVersion: { type: string, const: vitlane.amazon-variant.v3 }
        product: { type: object, additionalProperties: true }
    AmazonSourceControl:
      type: object
      required: [enabled, version, updatedAt]
      properties:
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    AmazonAPIUsageV3:
      type: object
      required: [schemaVersion, source, enabled, configured, control, quota, estimatedRemaining, attemptsSinceObservation, requests24h, succeeded24h, failures24h]
      properties:
        operations24h:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOperationUsageV1'
        schemaVersion: { type: string, const: vitlane.catalog-api-usage.v3 }
        source: { type: string, const: AMAZON }
        configured: { type: boolean, description: 서버 환경과 키가 준비된 수집 capability }
        control: { $ref: "#/components/schemas/AmazonSourceControl" }
        enabled: { type: boolean, description: configured와 운영자 enabled가 모두 참인 유효 상태 }
        mode: { type: string, enum: [LIVE, STUB, DISABLED] }
        quota:
          type: [object, 'null']
          properties:
            limit: { type: integer, minimum: 0 }
            used: { type: integer, minimum: 0 }
            remaining: { type: integer, minimum: 0 }
            isFree: { type: boolean }
            observedAt: { type: string, format: date-time }
            resetAt: { type: string, format: date-time }
        estimatedRemaining: { type: [integer, 'null'], minimum: 0 }
        attemptsSinceObservation: { type: integer, minimum: 0 }
        requests24h: { type: integer, minimum: 0 }
        succeeded24h: { type: integer, minimum: 0 }
        failures24h:
          type: array
          items:
            type: object
            properties:
              reasonCode: { type: string }
              count: { type: integer, minimum: 0 }
        lastFailureCode: { type: string }
        lastFailureAt: { type: string, format: date-time }
        quotaRefreshFailure: { type: string }
    CatalogResearchHydration:
      type: object
      additionalProperties: false
      required: [schemaVersion, messages, pools, configurations, interactions, metrics]
      properties:
        schemaVersion: { type: string, const: vitlane.catalog-research-hydration.v3 }
        messages:
          type: array
          items: { $ref: "#/components/schemas/CatalogWorkspaceProviderMessage" }
        pools:
          type: array
          items:
            type: object
            required:
              [targetId, version, expandOrdinal, latestDurationMilliseconds,
               latestShopifyCalls, latestRateRemaining, products, hiddenProducts,
               messages]
            properties:
              targetId: { type: string, format: uuid }
              version: { type: integer, format: int64, minimum: 1 }
              expandOrdinal: { type: integer, minimum: 0 }
              sourceCoverage:
                type: [array, 'null']
                items:
                  type: object
                  required: [source, status, candidateCount]
                  properties:
                    source: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
                    status: { type: string, enum: [SUCCEEDED, EMPTY, PARTIAL, FAILED, UNSUPPORTED, SKIPPED] }
                    reasonCode: { type: string }
                    candidateCount: { type: integer, minimum: 0 }
              latestMode: { type: string, enum: [REPLACE, APPEND] }
              latestDurationMilliseconds: { type: integer, format: int64, minimum: 0 }
              latestShopifyCalls: { type: integer, minimum: 0 }
              latestRateRemaining: { type: integer, minimum: 0 }
              products:
                type: array
                items: { $ref: "#/components/schemas/CatalogResearchHydratedCandidate" }
              hiddenProducts:
                type: array
                items: { $ref: "#/components/schemas/CatalogResearchHydratedCandidate" }
              messages:
                type: array
                items: { $ref: "#/components/schemas/CatalogWorkspaceProviderMessage" }
        configurations:
          type: array
          items:
            type: object
            required: [candidateId, variant, observedAt]
            properties:
              candidateId: { type: string, minLength: 1 }
              variant: { type: object, additionalProperties: true }
              observedAt: { type: string, format: date-time }
        interactions:
          type: array
          items:
            type: object
            required: [candidateId, variantId, pinned, sentiment]
            properties:
              candidateId: { type: string, minLength: 1 }
              variantId: { type: string, minLength: 1 }
              pinned: { type: boolean }
              sentiment: { type: string, enum: [NONE, LIKE, DISLIKE] }
        metrics: { type: object, additionalProperties: true }
    CatalogResearchHydratedCandidate:
      type: object
      additionalProperties: true
      required: [candidateId, source, sourceProductRef, purchaseRoute, hydration]
      properties:
        axisAssessment: { $ref: "#/components/schemas/AxisAssessmentV1" }
        candidateId: { type: string, minLength: 1 }
        source: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        sourceProductRef: { $ref: "#/components/schemas/SourceProductRefV3" }
        externalObservation: { $ref: "#/components/schemas/ExternalProductObservationV1" }
        purchaseRoute: { type: string, enum: [VITLANE_CHECKOUT, EXTERNAL] }
        variantObservation: { $ref: "#/components/schemas/VariantObservationV3" }
        hydration:
          type: object
          additionalProperties: false
          required: [status, retryable]
          properties:
            status: { type: string, enum: [READY, UNRESOLVED] }
            reasonCode:
              type: string
              description: 소스 기준의 안정적인 오류 코드. 내부 adapter 이름이나 raw error는 포함하지 않는다.
            retryable: { type: boolean }
    CatalogResearchWorkspaceCandidate:
      type: object
      additionalProperties: false
      description: >-
        Durable Candidate assessment returned by Curation workspace polling.
        Empty feature and specification collections are encoded as JSON arrays,
        never null.
      required: [candidateId, source, sourceProductRef, features, specifications]
      properties:
        axisAssessment: { $ref: "#/components/schemas/AxisAssessmentV1" }
        candidateId: { type: string, minLength: 1 }
        source: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        sourceProductRef: { $ref: "#/components/schemas/SourceProductRefV3" }
        externalObservation: { $ref: "#/components/schemas/ExternalProductObservationV1" }
        locator:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [PRODUCT_URL, MERCHANT_VARIANT] }
            productUrl: { type: string, format: uri }
            variantId: { type: string, minLength: 1 }
            sellerDomain: { type: string, minLength: 1 }
        intentPoint: { type: string }
        features:
          type: array
          items: { type: string }
        specifications:
          type: array
          items: { type: string }
    CatalogResearchWorkspace:
      type: object
      additionalProperties: false
      description: >-
        Curation workspace polling에 포함되는 DB-only CandidatePool 골격이다.
        title·price·media·merchant 같은 Shopify display fact는 포함하지 않는다.
      required: [schemaVersion, pools, configurations, interactions]
      properties:
        schemaVersion: { type: string, const: vitlane.catalog-research-workspace.v4 }
        purchaseFeedback:
          description: >-
            큐레이션의 구매 자기보고 목록. 외부 상품 카드가 카드마다 따로 읽지 않도록
            DB-only workspace 읽기에 함께 실린다. 주문·결제가 아니다(ADR-0075).
          $ref: "#/components/schemas/ExternalPurchaseFeedbackV3"
        productReactions:
          description: 쿠팡·11번가 상품 수준 반응. 카드가 받은 값을 그대로 쓴다.
          type: array
          items: { $ref: "#/components/schemas/ProductReactionV1" }
        reactionAllowedCandidateIds:
          description: 상품 수준 반응이 허용되는 Candidate. 서버가 확정한 KR 원본 상품이며 알려진 Variant가 없다.
          type: array
          items: { type: string }
        pools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [targetId, version, expandOrdinal, products, hiddenProducts]
            properties:
              targetId: { type: string, format: uuid }
              version: { type: integer, format: int64, minimum: 1 }
              expandOrdinal: { type: integer, minimum: 0 }
              sourceCoverage:
                type: [array, 'null']
                items:
                  type: object
                  required: [source, status, candidateCount]
                  properties:
                    source: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
                    status: { type: string, enum: [SUCCEEDED, EMPTY, PARTIAL, FAILED, UNSUPPORTED, SKIPPED] }
                    reasonCode: { type: string }
                    candidateCount: { type: integer, minimum: 0 }
              discoveryOutcome: { $ref: "#/components/schemas/ResearchDiscoveryOutcomeV1" }
              latestMode: { type: string, enum: [REPLACE, APPEND] }
              products:
                type: array
                items: { $ref: "#/components/schemas/CatalogResearchWorkspaceCandidate" }
              hiddenProducts:
                type: array
                items: { $ref: "#/components/schemas/CatalogResearchWorkspaceCandidate" }
        configurations:
          type: array
          items: { type: object, additionalProperties: true }
        interactions:
          type: array
          items: { type: object, additionalProperties: true }
    CatalogWorkspaceProviderMessage:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [error, warning, info] }
        code: { type: string }
        path: { type: string }
        subjectKind: { type: string, enum: [SEARCH, PRODUCT] }
        subjectRef: { type: string }
        contentType: { type: string, enum: [plain, markdown] }
        content: { type: string, minLength: 1 }
        severity: { type: string }
        presentation: { type: string }
        imageUrl: { type: string, format: uri }
        url: { type: string, format: uri }
    CatalogCartItem:
      type: object
      additionalProperties: false
      required:
        [cartItemId, targetId, candidateId, productTitle, variantId,
         variantTitle, selectedOptions, previewPriceMinor, previewCurrency,
         quantity, observedAt]
      properties:
        cartItemId: { type: string, minLength: 1, maxLength: 1024 }
        targetId: { type: string, format: uuid }
        candidateId: { type: string, minLength: 1, maxLength: 512 }
        productTitle: { type: string, minLength: 1, maxLength: 240 }
        productUrl: { type: string, format: uri }
        merchantName: { type: string, maxLength: 240 }
        sellerDomain: { type: string, maxLength: 255 }
        intentPoint: { type: string, maxLength: 1000 }
        variantId: { type: string, minLength: 1, maxLength: 512 }
        variantTitle: { type: string, minLength: 1, maxLength: 240 }
        selectedOptions: { type: array, items: { type: string, minLength: 1 } }
        previewPriceMinor: { type: integer, format: int64, minimum: 0 }
        previewCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        observedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time, readOnly: true }
    CatalogCartView:
      type: object
      additionalProperties: false
      required: [schemaVersion, curationId, version, country, currency, items]
      properties:
        schemaVersion: { type: string, const: vitlane.cart-view.v2 }
        curationId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        country: { type: string, minLength: 2, maxLength: 2 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/CatalogCartItem" } }
        updatedAt: { type: string, format: date-time }
    ResearchFeedback:
      type: object
      required:
        [id, shoppingSessionId, previousRoundId, nextRoundId, feedback, interactionSnapshot, schemaVersion, feedbackVersion, feedbackHash, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        shoppingSessionId: { type: string, format: uuid }
        previousRoundId: { type: string, format: uuid }
        nextRoundId: { type: string, format: uuid }
        feedback: { type: string }
        interactionSnapshot: { type: object, additionalProperties: true }
        schemaVersion: { type: string, const: vitlane.research-feedback.v3 }
        feedbackVersion: { type: integer, format: int64, minimum: 1 }
        feedbackHash: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        createdAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
    ResearchAgainResult:
      type: object
      required: [session, round, feedback, replay]
      properties:
        session: { $ref: "#/components/schemas/ShoppingSession" }
        round: { $ref: "#/components/schemas/ResearchRound" }
        feedback: { $ref: "#/components/schemas/ResearchFeedback" }
        replay: { type: boolean }
    ResearchGroup:
      type: object
      required: [session, rounds]
      properties:
        session: { $ref: "#/components/schemas/ShoppingSession" }
        round: { $ref: "#/components/schemas/ResearchRound" }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/ResearchRound" }
    PlanResearchResult:
      type: object
      required: [planId, groups]
      properties:
        planId: { type: string, format: uuid }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ResearchGroup" }
    Wallet:
      type: object
      required:
        [id, userId, address, accountId, chainId, registrationStatus,
         isDefault, registeredAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        accountId: { type: string, examples: ["eip155:91342:0x0000000000000000000000000000000000000001"] }
        chainId: { type: string, examples: ["eip155:91342"] }
        registrationStatus:
          type: string
          enum: [REGISTERED, DEREGISTERED]
        currentOwnershipProofId: { type: string, format: uuid }
        isDefault: { type: boolean }
        registeredAt: { type: string, format: date-time }
        deregisteredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WalletRegistrationAttempt:
      type: object
      description: 서명 전 임시 challenge이며 이 단계에는 Wallet row가 없다
      required:
        [id, address, accountId, chainId, status, message, messageHash,
         nonce, expiresAt]
      properties:
        id: { type: string, format: uuid }
        address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        accountId: { type: string }
        chainId: { type: string }
        status:
          type: string
          enum: [PENDING, COMPLETED, EXPIRED, LOCKED, CANCELLED, SUPERSEDED]
        message: { type: string }
        messageHash: { type: string }
        nonce: { type: string }
        expiresAt: { type: string, format: date-time }
    WalletOwnershipProof:
      type: object
      required:
        [id, userId, walletId, registrationAttemptId, address, accountId,
         chainId, origin, method, messageHash, verifiedAt, validUntil]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        registrationAttemptId: { type: string, format: uuid }
        address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        accountId: { type: string }
        chainId: { type: string }
        origin: { type: string, format: uri }
        method: { type: string, const: EIP191_PERSONAL_SIGN }
        messageHash: { type: string }
        verifiedAt: { type: string, format: date-time }
        validUntil:
          type: string
          format: date-time
          description: verifiedAt에서 정확히 24시간이며 조회로 연장되지 않는다
        revokedAt: { type: string, format: date-time }
    WalletRegistrationResult:
      type: object
      description: complete command가 exact replay하는 불변 Wallet 등록 결과
      required:
        [walletId, ownershipProofId, address, accountId, chainId, verifiedAt,
         validUntil]
      properties:
        walletId: { type: string, format: uuid }
        ownershipProofId: { type: string, format: uuid }
        address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        accountId: { type: string }
        chainId: { type: string, pattern: "^eip155:[1-9][0-9]*$" }
        verifiedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    WalletNextAction:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            [NONE, REGISTER, REAUTHENTICATE, START_KYC, CHECK_RESULT,
             RECHECK, CONTACT_SUPPORT]
        url: { type: string }
        expiresAt: { type: string, format: date-time }
        label: { type: string }
    WalletOwnershipProjection:
      type: object
      required: [status, nextAction]
      properties:
        status:
          type: string
          enum: [VALID, REAUTH_REQUIRED, REVOKED]
        proofId: { type: string, format: uuid }
        verifiedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        nextAction: { $ref: "#/components/schemas/WalletNextAction" }
    ShippingAddressInput:
      type: object
      required: [label, recipientName, addressLine1, city, region, postalCode, country]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        recipientName: { type: string, minLength: 1, maxLength: 120 }
        addressLine1: { type: string, minLength: 1, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        region: { type: string, minLength: 1, maxLength: 100 }
        postalCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 -]{1,15}$"
        country: { type: string, pattern: "^[A-Z]{2}$" }
        phone: { type: string, maxLength: 40 }
    OrderSheetShippingAddressInput:
      type: object
      description: OrderSheet 편집 폼의 현재 값이며 EMPTY source에서는 필수 문자열이 비어 있을 수 있다
      required: [recipientName, addressLine1, addressLine2, city, region, postalCode, country, phone]
      properties:
        recipientName: { type: string, maxLength: 120 }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 16 }
        country: { type: string, const: US }
        phone: { type: string, maxLength: 40 }
    OrderSheetShippingAddressCommand:
      type: object
      required: [expectedVersion, recipientName, addressLine1, city, region, postalCode, country]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        recipientName: { type: string, minLength: 1, maxLength: 120 }
        addressLine1: { type: string, minLength: 1, maxLength: 200 }
        addressLine2: { type: string, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        region: { type: string, minLength: 1, maxLength: 100 }
        postalCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 -]{1,15}$"
        country: { type: string, const: US }
        phone: { type: string, maxLength: 40 }
    ShippingAddress:
      type: object
      description: 소유자 명시적 no-store 공개 또는 운영자 감사 공개에서만 사용하며 기본 projection과 로그에 포함하지 않는다
      required: [recipientName, addressLine1, city, region, postalCode, country]
      properties:
        recipientName: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        phone: { type: string }
    ShippingProfile:
      type: object
      description: 암호문·nonce·fingerprint와 주소 원문을 제외한 사용자용 metadata
      required:
        [id, userId, label, country, maskedSummary, keyVersion, version,
         isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        label: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        maskedSummary: { type: string }
        keyVersion: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        isDefault: { type: boolean }
        retiredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KYCVerificationCase:
      type: object
      required:
        [id, userId, walletId, startedWithOwnershipProofId, requestedLevel,
         providerKind, providerVersion, externalEffect, state, createdAt,
         updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        startedWithOwnershipProofId: { type: string, format: uuid }
        requestedLevel: { type: string, const: ADVANCED_TEST_KYC }
        providerKind: { type: string, enum: [DOJANG, MOCK_DOJANG] }
        providerVersion: { type: string }
        externalEffect: { type: string, enum: [LIVE, SIMULATED] }
        state:
          type: string
          enum:
            [CREATED, PENDING_PROVIDER, VERIFIED, REJECTED, EXPIRED,
             CANCELLED]
        providerCaseRef: { type: string }
        credentialId: { type: string, format: uuid }
        failureCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    KYCCredential:
      type: object
      required:
        [id, userId, walletId, caseId, level, providerKind, providerVersion,
         externalEffect, subjectAccountId, issuerRef, schemaRef, evidenceHash,
         issuedAt, validUntil, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        level:
          type: string
          enum: [MOCK_DOJANG_VERIFIED, DOJANG_VERIFIED_ADDRESS]
        providerKind: { type: string, enum: [MOCK_DOJANG, DOJANG] }
        providerVersion: { type: string }
        externalEffect: { type: string, enum: [SIMULATED, LIVE] }
        subjectAccountId: { type: string }
        issuerRef: { type: string }
        schemaRef: { type: string }
        evidenceHash: { type: string }
        issuedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    KYCEvidenceObservation:
      type: object
      required:
        [id, credentialId, userId, walletId, status, evidenceHash,
         sourceVersion, observedAt, validUntil, recheckAfter]
      properties:
        id: { type: string, format: uuid }
        credentialId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        status: { type: string, enum: [VALID, EXPIRED, REVOKED] }
        evidenceHash: { type: string }
        sourceVersion: { type: integer, format: int64, minimum: 1 }
        observedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        recheckAfter: { type: string, format: date-time }
    WalletKYCProjection:
      type: object
      required:
        [eligibility, actionEligible, providerKind, externalEffect, disclosure,
         nextAction]
      properties:
        eligibility:
          type: string
          enum:
            [NONE, PENDING, VALID, RECHECK_REQUIRED, EXPIRED, REVOKED,
             REJECTED]
        actionEligible:
          type: boolean
          description: REGISTERED Wallet, 현재 ownership proof와 유효한 KYC evidence가 모두 충족될 때만 true
        providerKind: { type: string, enum: [MOCK_DOJANG, DOJANG] }
        externalEffect: { type: string, enum: [SIMULATED, LIVE] }
        disclosure:
          type: string
          description: MockDojang은 TEST/SIMULATED이며 실제 외부 신원 확인이 아님을 명시한다
        activeCase: { $ref: "#/components/schemas/KYCVerificationCase" }
        credential: { $ref: "#/components/schemas/KYCCredential" }
        observation: { $ref: "#/components/schemas/KYCEvidenceObservation" }
        failureCode:
          type: string
          description: 최신 terminal case 또는 provider operation의 stable failure code
        retryable:
          type: boolean
          description: 같은 nextAction으로 사용자가 안전하게 다시 시도할 수 있는지 여부
        nextAction: { $ref: "#/components/schemas/WalletNextAction" }
    WalletActionsProjection:
      type: object
      required:
        [canSetDefault, canDeregister, canReauthenticate, canStartKYC,
         canCheckKYC]
      properties:
        canSetDefault: { type: boolean }
        canDeregister: { type: boolean }
        canReauthenticate: { type: boolean }
        canStartKYC: { type: boolean }
        canCheckKYC: { type: boolean }
    WalletProjection:
      type: object
      required: [wallet, ownership, kyc, actions]
      properties:
        wallet: { $ref: "#/components/schemas/Wallet" }
        ownership: { $ref: "#/components/schemas/WalletOwnershipProjection" }
        kyc: { $ref: "#/components/schemas/WalletKYCProjection" }
        actions: { $ref: "#/components/schemas/WalletActionsProjection" }
    BuyerProfile:
      type: object
      required:
        [id, userId, profileKind, label, fixtureKey, country, city, version,
         snapshotHash, containsRealPii, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        profileKind: { type: string, const: TEST_PROFILE }
        label: { type: string }
        fixtureKey: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        city: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        snapshotHash: { type: string }
        containsRealPii: { type: boolean, const: false }
        isDefault: { type: boolean }
        retiredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PolicyAcceptance:
      type: object
      required: [policyId, policyVersion, acceptedAt]
      properties:
        policyId: { type: string }
        policyVersion: { type: string }
        acceptedAt: { type: string, format: date-time }
    SettlementConfig:
      type: object
      required:
        [environment, chainId, chainCaip2, rpcUrl, explorerUrl, tokenAddress,
         faucetAddress, settlementAddress, tokenSymbol, tokenDecimals, feeBps,
         feeRecipient, claimAmountBaseUnits]
      properties:
        environment: { type: string, enum: [LOCAL, GIWA_TESTNET] }
        chainId: { type: integer, format: int64, minimum: 1 }
        chainCaip2:
          type: string
          pattern: "^eip155:[1-9][0-9]*$"
        rpcUrl: { type: string, format: uri }
        explorerUrl: { type: string, format: uri }
        tokenAddress:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        faucetAddress:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        settlementAddress:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        tokenSymbol: { type: string, const: tVITUSD }
        tokenDecimals: { type: integer, const: 6 }
        feeBps: { type: integer, minimum: 0, maximum: 10000 }
        feeRecipient:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        claimAmountBaseUnits:
          type: string
          pattern: "^[0-9]+$"
    PaymentAuthorizationRecord:
      type: object
      required:
        [id, agencyOrderId, authorization, domain, signer, typedDataHash, signature,
         createdAt]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        authorization:
          type: object
          required:
            [payer, token, passThroughAmount, feeAmount, orderHash, merchantId,
             merchantRegistryVersion, feeBps, feeRecipient,
             principalRecipient, assuranceLevel, nonce, payDeadline,
             refundAfter]
          properties:
            payer: { type: string }
            token: { type: string }
            passThroughAmount: { type: string, pattern: "^[0-9]+$" }
            feeAmount: { type: string, pattern: "^[0-9]+$" }
            orderHash: { type: string }
            merchantId: { type: string }
            merchantRegistryVersion:
              { type: integer, format: int64, minimum: 1 }
            feeBps: { type: integer, minimum: 0, maximum: 10000 }
            feeRecipient: { type: string }
            principalRecipient: { type: string }
            assuranceLevel: { type: string }
            nonce: { type: string }
            payDeadline: { type: integer, format: int64 }
            refundAfter: { type: integer, format: int64 }
        domain:
          type: object
          required: [name, version, chainId, verifyingContract]
          properties:
            name: { type: string, const: "Vitlane Settlement" }
            version: { type: string, const: "2" }
            chainId: { type: integer, format: int64, minimum: 1 }
            verifyingContract:
              { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        signer: { type: string }
        typedDataHash: { type: string }
        signature: { type: string }
        createdAt: { type: string, format: date-time }
    SettlementPayment:
      type: object
      required:
        [id, agencyOrderId, orderHash, chainId, settlementAddress, payer,
         amountBaseUnits, state, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        agencyOrderId: { type: string, format: uuid }
        orderHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        chainId: { type: integer, format: int64, minimum: 1 }
        settlementAddress:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        payer:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        amountBaseUnits:
          type: string
          pattern: "^[0-9]+$"
        claimTxHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        approveTxHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        payTxHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        completeTxHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        refundTxHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        state:
          type: string
          enum:
            [AUTHORIZED, AWAITING_ALLOWANCE, PAYMENT_SUBMITTED,
             SUBMISSION_UNKNOWN, SAFE, FINALIZED, COMPLETION_SUBMITTED,
             COMPLETED, REFUND_PENDING, REFUNDED, FAILED]
        safeBlock: { type: integer, format: int64, minimum: 0 }
        finalizedBlock: { type: integer, format: int64, minimum: 0 }
        lastReasonCode:
          type: string
          enum:
            [RPC_OBSERVATION_FAILED, TX_OBSERVATION_EXHAUSTED,
             PAYMENT_SUBMISSION_NOT_OBSERVED, EXPECTED_EVENT_MISMATCH,
             TX_REVERTED]
        observationExhaustedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RefundIntent:
      type: object
      required:
        [agencyOrderId, chainId, orderHash,
         settlementAddress, payer, amountBaseUnits, refundAfter, eligible]
      properties:
        agencyOrderId: { type: string, format: uuid }
        chainId: { type: integer, format: int64, minimum: 1 }
        orderHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
        settlementAddress:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        payer:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        amountBaseUnits:
          type: string
          pattern: "^[0-9]+$"
        # v2 (ADR-0050): self-refund escape hatch는 escrow의 pass-through만
        # 반환한다. fee 반환은 운영 refundPartial 경로다.
        passThroughBaseUnits:
          type: string
          pattern: "^[0-9]+$"
        feeBaseUnits:
          type: string
          pattern: "^[0-9]+$"
        refundAfter: { type: string, format: date-time }
        eligible: { type: boolean, const: true }
    AccountOverview:
      type: object
      required:
        [wallets, buyerProfiles, shippingProfiles, policyAcceptances,
         assurancePolicy]
      properties:
        wallets:
          type: array
          items: { $ref: "#/components/schemas/WalletProjection" }
        buyerProfiles:
          type: array
          items: { $ref: "#/components/schemas/BuyerProfile" }
        shippingProfiles:
          type: array
          items: { $ref: "#/components/schemas/ShippingProfile" }
        policyAcceptances:
          type: array
          items: { $ref: "#/components/schemas/PolicyAcceptance" }
        assurancePolicy:
          type: object
          additionalProperties: { type: string }
    CurationSelection:
      type: object
      additionalProperties: false
      required:
        [id, curationId, targetId, shoppingSessionId, candidateId,
         candidateConfigurationId, configurationHash, quantity, version,
         selectedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        shoppingSessionId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        candidateConfigurationId: { type: string, format: uuid }
        configurationHash: { type: string, minLength: 1 }
        quantity:
          { type: integer, format: int64, minimum: 1, maximum: 99 }
        version: { type: integer, format: int64, minimum: 1 }
        selectedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        removedAt: { type: string, format: date-time }
    CartViewCandidate:
      type: object
      additionalProperties: false
      required: [id, name, productUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        productUrl: { type: string, format: uri }
        imageUrl: { type: string, format: uri }
    CartSelection:
      type: object
      additionalProperties: false
      required: [selection, candidate, unitPrice, lineTotal]
      properties:
        selection: { $ref: "#/components/schemas/CurationSelection" }
        candidate: { $ref: "#/components/schemas/CartViewCandidate" }
        unitPrice: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }
    CartWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1 }
        selectionId: { type: string, format: uuid }
        message: { type: string, minLength: 1 }
    CartView:
      type: object
      additionalProperties: false
      required: [curationId, selections, total, warnings, updatedAt]
      properties:
        curationId: { type: string, format: uuid }
        selections:
          type: array
          items: { $ref: "#/components/schemas/CartSelection" }
        total: { $ref: "#/components/schemas/Money" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CartWarning" }
        updatedAt: { type: string, format: date-time }
    CreateCurationSelectionRequest:
      type: object
      additionalProperties: false
      required:
        [clientCommandId, candidateConfigurationId,
         expectedCurationVersion, quantity]
      properties:
        clientCommandId: { type: string, format: uuid }
        candidateConfigurationId: { type: string, format: uuid }
        expectedCurationVersion:
          { type: integer, format: int64, minimum: 1 }
        quantity:
          { type: integer, format: int64, minimum: 1, maximum: 99 }
    UpdateCurationSelectionRequest:
      type: object
      additionalProperties: false
      required:
        [clientCommandId, expectedVersion, expectedCurationVersion,
         candidateConfigurationId, quantity]
      properties:
        clientCommandId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        expectedCurationVersion:
          { type: integer, format: int64, minimum: 1 }
        candidateConfigurationId: { type: string, format: uuid }
        quantity:
          { type: integer, format: int64, minimum: 1, maximum: 99 }
    RemoveCurationSelectionRequest:
      type: object
      additionalProperties: false
      required:
        [clientCommandId, expectedVersion, expectedCurationVersion]
      properties:
        clientCommandId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        expectedCurationVersion:
          { type: integer, format: int64, minimum: 1 }
    CurationSelectionCommandResult:
      type: object
      additionalProperties: false
      required: [selection, replay]
      properties:
        selection: { $ref: "#/components/schemas/CurationSelection" }
        replay: { type: boolean }
    CurationAgencyOrderTrace:
      type: object
      additionalProperties: false
      required:
        [agencyOrderId, curationId, targetId, candidateId, state, issuedAt,
         updatedAt]
      properties:
        agencyOrderId: { type: string, format: uuid }
        curationId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        state: { type: string }
        issuedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CurationActiveWork:
      type: object
      additionalProperties: false
      required: [workTargetId, label, status]
      properties:
        workTargetId:
          type: string
          description: |
            foreground work를 복구할 PlanningTask ID 또는 ResearchRound ID
        label: { type: string }
        status:
          type: string
          enum: [QUEUED, RUNNING, RESULT_CONFIRMATION_REQUIRED]
          description: |
            RESULT_CONFIRMATION_REQUIRED는 provider effect가 불명확해 자동 재호출과
            workspace polling을 모두 중단했으며 운영 확인이 필요한 상태다.
        detail: { type: string }
    CurationWorkspace:
      type: object
      additionalProperties: false
      required:
        [plan, curation, targets, research, cart, availableActions, timeline,
         latestArtifact, coverage, agencyOrderTrace, catalogResearch]
      properties:
        conversation: { $ref: "#/components/schemas/CurationConversation" }
        plan: { $ref: "#/components/schemas/ShoppingPlan" }
        curation: { $ref: "#/components/schemas/Curation" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/PlanTarget" }
        research: { $ref: "#/components/schemas/PlanResearchResult" }
        cart: { $ref: "#/components/schemas/CartView" }
        availableActions:
          type: array
          items: { $ref: "#/components/schemas/CurationActionDescriptor" }
        timeline:
          type: array
          description: |
            모든 typed 사용자 command와 APPEND owner result projection을
            포함한다. PATCH_ONLY는 action-only다. configuration/Selection raw
            payload, hash, credential과 PII owner payload는 제외한다.
          items: { $ref: "#/components/schemas/CurationTimelineItem" }
        latestArtifact:
          type: string
          enum: [TARGET_LIST, CURATION_BOARD]
        coverage:
          type: string
          enum: [NONE, PARTIAL, COMPLETE]
        agencyOrderTrace:
          type: array
          items: { $ref: "#/components/schemas/CurationAgencyOrderTrace" }
        activeWork: { $ref: "#/components/schemas/CurationActiveWork" }
        intelligence:
          type: array
          description: |
            ADR-0038: 이 큐레이션의 IntelligenceJob 진행 projection. browser의
            유일한 진행 데이터 소스이며 별도 progress endpoint는 없다.
          items: { $ref: "#/components/schemas/IntelligenceJobProgress" }
        catalogResearch:
          $ref: "#/components/schemas/CatalogResearchWorkspace"
    StartPlanResearchResult:
      type: object
      additionalProperties: false
      description: |
        ADR-0038: 명령이 연 ResearchRound 목록. 진행은 workspace projection의
        intelligence 블록으로만 조회한다.
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ResearchTask" }
    CancelCurationActionResult:
      type: object
      additionalProperties: false
      required: [cancelledJobs]
      properties:
        cancelledJobs: { type: integer, minimum: 0 }
    IntelligenceJobRef:
      type: object
      additionalProperties: false
      description: |
        ADR-0038 IntelligenceJob의 browser-safe 참조. activation이나 claim
        material을 갖지 않으며, 진행은 workspace projection으로만 조회한다.
      required: [jobId, replay]
      properties:
        jobId: { type: string, format: uuid }
        replay: { type: boolean }
    IntelligenceJobProgress:
      type: object
      additionalProperties: false
      required: [jobId, actionId, targetKind, targetId, provider, status, retryable,
                 attempt, steps]
      properties:
        jobId: { type: string, format: uuid }
        actionId:
          type: string
          format: uuid
          description: 이 Job과 함께 파생된 작업을 원자적으로 취소할 CurationAction ID
        targetKind: { type: string, enum: [PLANNING_TASK, RESEARCH_ROUND] }
        targetId: { type: string, format: uuid }
        provider: { type: string, enum: [MANAGED] }
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        failureCode: { type: string }
        retryable: { type: boolean }
        attempt: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceStep" }
        queueReason:
          type: string
          description: PENDING Job이 아직 실행되지 않는 이유(MODEL_SLOT_BUSY, RETRY_BACKOFF, CATALOG_ROUTES_DEFERRED 등). 상한 대기는 비어 있다.
        notBefore:
          type: string
          format: date-time
          description: 이 시각 전에는 claim되지 않는다(자원 대기·재시도 백오프).
        queueAhead:
          type: integer
          minimum: 0
          description: 같은 사용자의 PENDING 조사 Job 중 이 Job보다 앞선 수. 조사 Job이 PENDING일 때만 있다.
    IntelligenceStep:
      type: object
      additionalProperties: false
      required: [id, jobId, attemptId, ordinal, kind, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        kind:
