    parameters:
      - $ref: "#/components/parameters/SupportAttachmentId"
    get:
      operationId: downloadSupportImage
      summary: 내 지원 대화의 암호화 저장 이미지 첨부를 비공개 다운로드한다
      responses:
        "200":
          $ref: "#/components/responses/SupportImageDownload"
