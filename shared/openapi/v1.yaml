      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getShoppingSession
      responses:
        "200":
          description: READY Session
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { $ref: "#/components/schemas/ShoppingSession" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /shopping-sessions/{sessionId}/research/cancel:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelResearch
      summary: 열린 REQUESTED Round를 취소하고 Session을 READY로 되돌린다
      responses:
        "204": { description: 취소됨 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /shopping-sessions/{sessionId}/research-again:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestResearchAgain
      summary: 명시한 대상의 조건 변경과 재조사를 요청 스레드로 접수한다
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [schemaVersion, expectedCriteriaVersion, curationId, targetId, curationActionId, feedback,
                 expectedCurationVersion, expectedSessionVersion]
              properties:
