          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                agencyOrderId: { type: string, format: uuid }
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SupportMessageMultipart"
      responses:
        "201":
          description: 발신된 답변
          content:
            application/json:
              schema:
                type: object
                required: [message, replay]
                properties:
                  message: { $ref: "#/components/schemas/SupportMessage" }
                  replay: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
