      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/SupportAttachmentId"
    get:
      operationId: downloadSupportOperatorImage
      summary: 운영자가 대상 고객 대화의 이미지 증거를 fresh 인증으로 비공개 다운로드한다
      responses:
        "200":
          $ref: "#/components/responses/SupportImageDownload"
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/support/conversations/{userId}/messages/{messageId}/no-reply-resolution:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: handleSupportConversationWithoutReply
      summary: 마지막 고객 메시지를 답변 발송 없이 운영 완료로 처리한다
      responses:
        "200":
          description: 무응답 처리 결과(같은 메시지 재시도는 replay=true)
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, handled, replay]
                properties:
                  schemaVersion: { type: string, const: vitlane.support-no-reply-resolution.v1 }
                  handled: { type: boolean, const: true }
                  replay: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/support/orders/{agencyOrderId}/messages:
    parameters:
      - $ref: "#/components/parameters/AgencyOrderId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: sendSupportOrderMessage
      summary: 운영자가 주문 첨부 안내를 보낸다 — 종전 고지함 발행의 대체(주문 소유 고객의 대화로 발신)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                images:
                  type: array
                  maxItems: 4
                  items: { type: string, format: binary }
      responses:
        "201":
          description: 발신된 안내
          content:
            application/json:
              schema:
                type: object
                required: [message, replay]
                properties:
                  message: { $ref: "#/components/schemas/SupportMessage" }
                  replay: { type: boolean }
        "422": { $ref: "#/components/responses/Error" }
  /admin/support/counts:
    get:
      operationId: getSupportCounts
      summary: 미답변·미처리 대화 전역 카운트(운영자 nav 뱃지 폴링)
      responses:
        "200":
          description: 대기 카운트
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, counts]
                properties:
                  schemaVersion: { type: string, const: vitlane.support-counts.v2 }
                  counts:
                    type: object
                    required: [awaiting, actionRequired]
                    properties:
                      awaiting: { type: integer, minimum: 0 }
                      actionRequired: { type: integer, minimum: 0 }
  /curations/{curationId}/cart:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    get:
      operationId: getCurationCart
      summary: 정확한 Offer가 아닌 fallible 사용자 선택 목록 CartView를 조회한다
      responses:
        "200":
          description: Candidate Variant draft의 current snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCartView" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceCurationCart
      summary: Shopify 호출 없이 CartView를 optimistic version으로 교체한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, items]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                items:
                  type: array
                  maxItems: 10
                  items: { $ref: "#/components/schemas/CatalogCartItem" }
      responses:
        "200":
          description: 저장된 CartView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCartView" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /curations/{curationId}/selections:
    parameters:
      - $ref: "#/components/parameters/CurationId"
    post:
      operationId: createCurationSelection
      summary: configured Candidate를 독립 Selection으로 보관한다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCurationSelectionRequest" }
      responses:
        "201":
          description: 생성 또는 clientCommandId replay 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurationSelectionCommandResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /curations/{curationId}/selections/{selectionId}:
    parameters:
      - $ref: "#/components/parameters/CurationId"
      - $ref: "#/components/parameters/SelectionId"
    put:
      operationId: updateCurationSelection
      summary: Selection configuration과 quantity만 optimistic lock으로 갱신한다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCurationSelectionRequest" }
      responses:
        "200":
          description: 갱신 또는 clientCommandId replay 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurationSelectionCommandResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeCurationSelection
      summary: Selection을 terminal soft removal해 현재 CartView에서 제외한다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveCurationSelectionRequest" }
      responses:
        "200":
          description: 제거 또는 clientCommandId replay 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurationSelectionCommandResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /shopping-sessions/{sessionId}:
