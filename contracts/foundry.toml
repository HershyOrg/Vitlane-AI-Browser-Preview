[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = true
