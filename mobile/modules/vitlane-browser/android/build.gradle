plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vitlane.browser'
version = '0.8.23'

android {
  namespace 'com.vitlane.browser'
  defaultConfig {
    versionCode 35
    versionName '0.8.23'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Keep the compiled DOM adapter in sync with its reviewed/tested JavaScript source.
def verifyBrowserPageScript = tasks.register('verifyBrowserPageScript', Exec) {
  workingDir projectDir.parentFile
  commandLine 'node', 'scripts/sync-browser-page-script.mjs', '--check'
}
tasks.named('preBuild').configure { dependsOn verifyBrowserPageScript }
