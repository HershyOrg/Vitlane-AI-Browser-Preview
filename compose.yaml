services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitlane
      POSTGRES_USER: vitlane
      POSTGRES_PASSWORD: vitlane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitlane -d vitlane"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vitlane-postgres:/var/lib/postgresql/data

  vitlane:
    build:
      context: .
      args:
        VITE_ALLOW_DEV_AUTH_UI: ${VITE_ALLOW_DEV_AUTH_UI:-true}
    environment:
      DATABASE_URL: postgres://vitlane:vitlane@postgres:5432/vitlane?sslmode=disable
      DB_MAX_OPEN_CONNECTIONS: ${DB_MAX_OPEN_CONNECTIONS:-40}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-10}
      DB_CONNECTION_MAX_IDLE_SECONDS: ${DB_CONNECTION_MAX_IDLE_SECONDS:-300}
      DB_CONNECTION_MAX_LIFETIME_SECONDS: ${DB_CONNECTION_MAX_LIFETIME_SECONDS:-1800}
      DB_ACQUIRE_TIMEOUT_SECONDS: ${DB_ACQUIRE_TIMEOUT_SECONDS:-2}
      DB_MIGRATION_LOCK_TIMEOUT_SECONDS: ${DB_MIGRATION_LOCK_TIMEOUT_SECONDS:-120}
      DB_INTERACTIVE_QUERY_TIMEOUT_SECONDS: ${DB_INTERACTIVE_QUERY_TIMEOUT_SECONDS:-3}
      DB_INTERACTIVE_TRANSACTION_TIMEOUT_SECONDS: ${DB_INTERACTIVE_TRANSACTION_TIMEOUT_SECONDS:-8}
      DB_INTERACTIVE_LOCK_TIMEOUT_SECONDS: ${DB_INTERACTIVE_LOCK_TIMEOUT_SECONDS:-1}
      DB_WORKER_QUERY_TIMEOUT_SECONDS: ${DB_WORKER_QUERY_TIMEOUT_SECONDS:-5}
      DB_WORKER_TRANSACTION_TIMEOUT_SECONDS: ${DB_WORKER_TRANSACTION_TIMEOUT_SECONDS:-15}
      DB_WORKER_LOCK_TIMEOUT_SECONDS: ${DB_WORKER_LOCK_TIMEOUT_SECONDS:-1}
      DB_ADMIN_QUERY_TIMEOUT_SECONDS: ${DB_ADMIN_QUERY_TIMEOUT_SECONDS:-60}
      DB_ADMIN_TRANSACTION_TIMEOUT_SECONDS: ${DB_ADMIN_TRANSACTION_TIMEOUT_SECONDS:-120}
      DB_ADMIN_LOCK_TIMEOUT_SECONDS: ${DB_ADMIN_LOCK_TIMEOUT_SECONDS:-5}
      HTTP_CONNECT_TIMEOUT_SECONDS: ${HTTP_CONNECT_TIMEOUT_SECONDS:-5}
      HTTP_KEEP_ALIVE_SECONDS: ${HTTP_KEEP_ALIVE_SECONDS:-30}
      HTTP_TLS_HANDSHAKE_TIMEOUT_SECONDS: ${HTTP_TLS_HANDSHAKE_TIMEOUT_SECONDS:-5}
      HTTP_RESPONSE_HEADER_TIMEOUT_SECONDS: ${HTTP_RESPONSE_HEADER_TIMEOUT_SECONDS:-20}
      HTTP_EXPECT_CONTINUE_TIMEOUT_SECONDS: ${HTTP_EXPECT_CONTINUE_TIMEOUT_SECONDS:-1}
      HTTP_IDLE_CONNECTION_TIMEOUT_SECONDS: ${HTTP_IDLE_CONNECTION_TIMEOUT_SECONDS:-90}
      HTTP_MAX_IDLE_CONNECTIONS: ${HTTP_MAX_IDLE_CONNECTIONS:-100}
      HTTP_MAX_IDLE_CONNECTIONS_PER_HOST: ${HTTP_MAX_IDLE_CONNECTIONS_PER_HOST:-10}
      HTTP_MAX_CONNECTIONS_PER_HOST: ${HTTP_MAX_CONNECTIONS_PER_HOST:-20}
      HTTP_MAX_CONCURRENT_REQUESTS: ${HTTP_MAX_CONCURRENT_REQUESTS:-500}
      HTTP_REQUEST_TIMEOUT_SECONDS: ${HTTP_REQUEST_TIMEOUT_SECONDS:-10}
      EXTERNAL_FINALIZATION_TIMEOUT_SECONDS: ${EXTERNAL_FINALIZATION_TIMEOUT_SECONDS:-3}
      GOOGLE_OIDC_TIMEOUT_SECONDS: ${GOOGLE_OIDC_TIMEOUT_SECONDS:-15}
      SHOPIFY_UCP_TIMEOUT_SECONDS: ${SHOPIFY_UCP_TIMEOUT_SECONDS:-15}
      MANAGED_MODEL_TIMEOUT_SECONDS: ${MANAGED_MODEL_TIMEOUT_SECONDS:-180}
      EVM_RPC_HTTP_TIMEOUT_SECONDS: ${EVM_RPC_HTTP_TIMEOUT_SECONDS:-15}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      MARKETING_BASE_URL: ${MARKETING_BASE_URL:-http://marketing.localhost:8080}
      MARKETING_WEB_DIR: /app/marketing
      ANALYTICS_MODE: ${ANALYTICS_MODE:-disabled}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      GA4_API_SECRET: ${GA4_API_SECRET:-}
      ANALYTICS_IDENTITY_KEY: ${ANALYTICS_IDENTITY_KEY:-}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      DEV_AUTH_DEFAULT_USER_ID: ${DEV_AUTH_DEFAULT_USER_ID:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      MOBILE_AUTH_REDIRECT_URIS: ${MOBILE_AUTH_REDIRECT_URIS:-vitlane://auth/callback}
      TRUSTED_BROWSER_ORIGIN: ${TRUSTED_BROWSER_ORIGIN:-}
      MARKETING_ADMIN_EMAILS: ${MARKETING_ADMIN_EMAILS:-admin@example.com,operator@example.com}
      ACCOUNT_RATE_LIMIT_SECRET: ${ACCOUNT_RATE_LIMIT_SECRET:-local-account-rate-limit-secret}
      ACCOUNT_RATE_LIMIT_KEY_VERSION: ${ACCOUNT_RATE_LIMIT_KEY_VERSION:-1}
      SHOPIFY_UCP_ENABLED: ${SHOPIFY_UCP_ENABLED:-false}
      SHOPIFY_UCP_CATALOG_URL: ${SHOPIFY_UCP_CATALOG_URL:-https://catalog.shopify.com/api/ucp/mcp}
      SHOPIFY_UCP_AGENT_PROFILE_URL: ${SHOPIFY_UCP_AGENT_PROFILE_URL:-https://shopify.dev/ucp/agent-profiles/2026-04-08/valid-with-capabilities.json}
      # ADR-0032 ManagedRunner. Forwarded empty rather than defaulted, so the
      # Server applies its own rule: the model secret decides, and an explicit
      # setting overrides. Hard-coding a default here would either force the
      # runner off in an environment that supplied a secret, or force it on in
      # one that did not and could then only fail to boot.
      BACKGROUND_RESEARCH_ENABLED: ${BACKGROUND_RESEARCH_ENABLED:-false}
      BACKGROUND_TELEGRAM_ENABLED: ${BACKGROUND_TELEGRAM_ENABLED:-true}
      BACKGROUND_AMAZON_ENABLED: ${BACKGROUND_AMAZON_ENABLED:-false}
      BACKGROUND_AMAZON_DAILY_CALLS: ${BACKGROUND_AMAZON_DAILY_CALLS:-0}
      BACKGROUND_AMAZON_FOREGROUND_RESERVE: ${BACKGROUND_AMAZON_FOREGROUND_RESERVE:-10}
      MANAGED_RUNNER_ENABLED: ${MANAGED_RUNNER_ENABLED:-}
      MANAGED_RUNNER_MODEL_PROVIDER: ${MANAGED_RUNNER_MODEL_PROVIDER:-openai}
      MANAGED_OPENAI_API_SECRET: ${MANAGED_OPENAI_API_SECRET:-}
      MANAGED_RUNNER_CONCURRENCY: ${MANAGED_RUNNER_CONCURRENCY:-10}
      INTELLIGENCE_RESEARCH_MAX_PER_USER: ${INTELLIGENCE_RESEARCH_MAX_PER_USER:-3}
      INTELLIGENCE_RESEARCH_MAX_PER_CURATION: ${INTELLIGENCE_RESEARCH_MAX_PER_CURATION:-3}
      INTELLIGENCE_RESEARCH_MAX_GLOBAL: ${INTELLIGENCE_RESEARCH_MAX_GLOBAL:-6}
      INTELLIGENCE_OTHER_JOB_LANE: ${INTELLIGENCE_OTHER_JOB_LANE:-4}
      MANAGED_MODEL_SLOT_WAIT_SECONDS: ${MANAGED_MODEL_SLOT_WAIT_SECONDS:-30}
      RESEARCH_EVALUATION_BATCH_LIMIT: ${RESEARCH_EVALUATION_BATCH_LIMIT:-25}
      RESEARCH_EVALUATION_PARALLEL: ${RESEARCH_EVALUATION_PARALLEL:-2}
      RESEARCH_EVALUATION_EXTRA_SLOT_WAIT_SECONDS: ${RESEARCH_EVALUATION_EXTRA_SLOT_WAIT_SECONDS:-10}
      RESEARCH_EVALUATION_BATCH_TIMEOUT_SECONDS: ${RESEARCH_EVALUATION_BATCH_TIMEOUT_SECONDS:-120}
      MANAGED_RUNNER_SERVER_DAILY_MICROS: ${MANAGED_RUNNER_SERVER_DAILY_MICROS:-10000000}
      MANAGED_RUNNER_SERVER_ADMISSION_MICROS: ${MANAGED_RUNNER_SERVER_ADMISSION_MICROS:-8000000}
      MANAGED_RUNNER_USER_DAILY_MICROS: ${MANAGED_RUNNER_USER_DAILY_MICROS:-100000}
      RESEARCH_CATALOG_PROVIDER: ${RESEARCH_CATALOG_PROVIDER:-}
      CURATION_CATALOG_RESEARCH_ENABLED: ${CURATION_CATALOG_RESEARCH_ENABLED:-false}
      KOREAN_PRODUCT_SEARCH_ENABLED: ${KOREAN_PRODUCT_SEARCH_ENABLED:-false}
      BROWSER_PRODUCT_SEARCH_ENABLED: ${BROWSER_PRODUCT_SEARCH_ENABLED:-false}
      # A container's 127.0.0.1 is the API container itself. Set a separately
      # reachable bridge origin explicitly when enabling browser discovery.
      BROWSER_BRIDGE_URL: ${BROWSER_BRIDGE_URL_CONTAINER:-}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      KOREAN_CATALOG_DETAIL_LIMIT: ${KOREAN_CATALOG_DETAIL_LIMIT:-4}
      KOREAN_CATALOG_MAX_CONCURRENT: ${KOREAN_CATALOG_MAX_CONCURRENT:-4}
      KOREAN_CATALOG_TIMEOUT_SECONDS: ${KOREAN_CATALOG_TIMEOUT_SECONDS:-60}
      CATALOG_API_LIMITS_JSON: ${CATALOG_API_LIMITS_JSON:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_MONTHLY_CAP_USD: ${APIFY_MONTHLY_CAP_USD:-5}
      OPEN_WEB_NINJA_API_KEY: ${OPEN_WEB_NINJA_API_KEY:-}
      NAVER_API_HUB_CLIENT_ID: ${NAVER_API_HUB_CLIENT_ID:-}
      NAVER_API_HUB_CLIENT_SECRET: ${NAVER_API_HUB_CLIENT_SECRET:-}
      SERP_API_KEY: ${SERP_API_KEY:-}
      AMAZON_PRODUCT_SEARCH_ENABLED: ${AMAZON_PRODUCT_SEARCH_ENABLED:-false}
      AMAZON_PRODUCT_SEARCH_MODE: ${AMAZON_PRODUCT_SEARCH_MODE:-live}
      AMAZON_PRODUCT_SEARCH_API: ${AMAZON_PRODUCT_SEARCH_API:-}
      CURATION_CATALOG_RESEARCH_CALLS_PER_MINUTE: ${CURATION_CATALOG_RESEARCH_CALLS_PER_MINUTE:-10}
      CURATION_CATALOG_RESEARCH_MAX_CONCURRENCY: ${CURATION_CATALOG_RESEARCH_MAX_CONCURRENCY:-16}
      AGENCY_ORDER_ENABLED: ${AGENCY_ORDER_ENABLED:-false}
      AGENCY_ORDER_CHECKOUT_PROVIDER: ${AGENCY_ORDER_CHECKOUT_PROVIDER:-stub}
      SHOPIFY_DEV_CLIENT_ID: ${SHOPIFY_DEV_CLIENT_ID:-}
      SHOPIFY_DEV_CLIENT_SECRET: ${SHOPIFY_DEV_CLIENT_SECRET:-}
      # PayPal Sandbox rail (Phase 8 Step 3): 서버 자격 3키만 주입한다.
      # buyer/merchant 로그인 자격은 서버에 절대 넣지 않는다(ADR-0050).
      AGENCY_ORDER_BUYER_CONTACT_EMAIL: ${AGENCY_ORDER_BUYER_CONTACT_EMAIL:-}
      PAYPAL_SANDBOX_ENABLED: ${PAYPAL_SANDBOX_ENABLED:-false}
      PAYPAL_SANDBOX_CLIENT_ID: ${PAYPAL_SANDBOX_CLIENT_ID:-}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${PAYPAL_SANDBOX_CLIENT_SECRET:-}
      PAYPAL_SANDBOX_WEBHOOK_ID: ${PAYPAL_SANDBOX_WEBHOOK_ID:-}
      # Live adapter can be provisioned while all money-moving gates stay off.
      # Activation is an explicit staged configuration change, never a default.
      LIVE_AGENCY_ORDER_ISSUE_ENABLED: ${LIVE_AGENCY_ORDER_ISSUE_ENABLED:-false}
      PAYPAL_LIVE_CAPTURE_ENABLED: ${PAYPAL_LIVE_CAPTURE_ENABLED:-false}
      MANUAL_MERCHANT_EFFECT_ENABLED: ${MANUAL_MERCHANT_EFFECT_ENABLED:-false}
      PAYPAL_LIVE_CLIENT_ID: ${PAYPAL_LIVE_CLIENT_ID:-}
      PAYPAL_LIVE_CLIENT_SECRET: ${PAYPAL_LIVE_CLIENT_SECRET:-}
      PAYPAL_LIVE_WEBHOOK_ID: ${PAYPAL_LIVE_WEBHOOK_ID:-}
      PAYPAL_LIVE_MERCHANT_ID: ${PAYPAL_LIVE_MERCHANT_ID:-}
      PAYPAL_LIVE_EMAIL: ${PAYPAL_LIVE_EMAIL:-}
      PHASE5_SETTLEMENT_ENABLED: ${PHASE5_SETTLEMENT_ENABLED:-false}
      PHASE5_OPERATOR_EMAILS: ${PHASE5_OPERATOR_EMAILS:-}
      SETTLEMENT_ENV: ${SETTLEMENT_ENV:-DISABLED}
      GIWA_CHAIN_ID: ${GIWA_CHAIN_ID:-91342}
      GIWA_RPC_URL: ${GIWA_RPC_URL:-}
      GIWA_PUBLIC_RPC_URL: ${GIWA_PUBLIC_RPC_URL:-}
      GIWA_EXPLORER_URL: ${GIWA_EXPLORER_URL:-}
      SETTLEMENT_RECONCILE_BATCH_SIZE: ${SETTLEMENT_RECONCILE_BATCH_SIZE:-50}
      SETTLEMENT_RECONCILE_TICK_TIMEOUT_SECONDS: ${SETTLEMENT_RECONCILE_TICK_TIMEOUT_SECONDS:-30}
      SETTLEMENT_RECONCILE_RPC_TIMEOUT_SECONDS: ${SETTLEMENT_RECONCILE_RPC_TIMEOUT_SECONDS:-5}
      SETTLEMENT_RECONCILE_EVENT_CHUNK_BLOCKS: ${SETTLEMENT_RECONCILE_EVENT_CHUNK_BLOCKS:-1000}
      SETTLEMENT_RECONCILE_EVENT_OVERLAP_BLOCKS: ${SETTLEMENT_RECONCILE_EVENT_OVERLAP_BLOCKS:-32}
      SETTLEMENT_RECONCILE_OBSERVATION_TIMEOUT_SECONDS: ${SETTLEMENT_RECONCILE_OBSERVATION_TIMEOUT_SECONDS:-21600}
      SETTLEMENT_RECONCILE_BACKOFF_MIN_SECONDS: ${SETTLEMENT_RECONCILE_BACKOFF_MIN_SECONDS:-15}
      SETTLEMENT_RECONCILE_BACKOFF_MAX_SECONDS: ${SETTLEMENT_RECONCILE_BACKOFF_MAX_SECONDS:-900}
      ONCHAIN_MANIFEST_PATH: ${ONCHAIN_MANIFEST_PATH:-}
      KYC_ASSURANCE_MODE: ${KYC_ASSURANCE_MODE:-}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PII_KEY_VERSION: ${PII_KEY_VERSION:-v1}
      DOJANG_SCROLL_ADDRESS: ${DOJANG_SCROLL_ADDRESS:-}
      DOJANG_EAS_ADDRESS: ${DOJANG_EAS_ADDRESS:-}
      DOJANG_SCHEMA_UID: ${DOJANG_SCHEMA_UID:-}
      DOJANG_ATTESTER_ID: ${DOJANG_ATTESTER_ID:-}
      DOJANG_ATTESTER_ADDRESS: ${DOJANG_ATTESTER_ADDRESS:-}
      QUOTE_SIGNER_KEY_FILE: ${QUOTE_SIGNER_KEY_FILE:-}
      FINALIZER_KEY_FILE: ${FINALIZER_KEY_FILE:-}
      REFUNDER_KEY_FILE: ${REFUNDER_KEY_FILE:-}
      TVITUSD_ADDRESS: ${TVITUSD_ADDRESS:-}
      FAUCET_ADDRESS: ${FAUCET_ADDRESS:-}
      SETTLEMENT_ADDRESS: ${SETTLEMENT_ADDRESS:-}
      TEST_FEE: ${TEST_FEE:-}
      REFUNDER_ADDRESS: ${REFUNDER_ADDRESS:-}
      PAUSER_ADDRESS: ${PAUSER_ADDRESS:-}
      AMAZON_TEST_PRINCIPAL: ${AMAZON_TEST_PRINCIPAL:-}
      WALMART_TEST_PRINCIPAL: ${WALMART_TEST_PRINCIPAL:-}
      SHOPIFY_TEST_PRINCIPAL: ${SHOPIFY_TEST_PRINCIPAL:-}
      GENERIC_WEB_TEST_PRINCIPAL: ${GENERIC_WEB_TEST_PRINCIPAL:-}
      AMAZON_TEST_REGISTRY_VERSION: ${AMAZON_TEST_REGISTRY_VERSION:-1}
      WALMART_TEST_REGISTRY_VERSION: ${WALMART_TEST_REGISTRY_VERSION:-1}
      SHOPIFY_TEST_REGISTRY_VERSION: ${SHOPIFY_TEST_REGISTRY_VERSION:-1}
      GENERIC_WEB_TEST_REGISTRY_VERSION: ${GENERIC_WEB_TEST_REGISTRY_VERSION:-1}
      FAUCET_CLAIM_AMOUNT: ${FAUCET_CLAIM_AMOUNT:-1000000000}
      CHAIN_START_BLOCK: ${CHAIN_START_BLOCK:-0}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  vitlane-postgres:
